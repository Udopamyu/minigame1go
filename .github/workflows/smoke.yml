name: Three-team smoke check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/pipeline.py --game tap-spark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-spark-handoff
          path: |
            games/tap-spark/test-results.json
            games/tap-spark/preview.png
            videos/tap-spark/gameplay.mp4
            videos/tap-spark/recording.json
            videos/tap-spark/checklist.json
            runs/tap-spark/latest.json
