name: "#003 Roulette Rogue browser QA"

on:
  pull_request:
    paths:
      - "games/roulette-rogue/**"
      - "scripts/verify_roulette_rogue.py"
      - ".github/workflows/roulette-rogue.yml"
  push:
    branches: ["feature/003-roulette-rogue-prototype"]
    paths:
      - "games/roulette-rogue/**"
      - "scripts/verify_roulette_rogue.py"
      - ".github/workflows/roulette-rogue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_roulette_rogue.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roulette-rogue-prototype-evidence
          path: |
            evaluation/roulette-rogue/
            games/roulette-rogue/index.html
            games/roulette-rogue/README.md
          if-no-files-found: warn
