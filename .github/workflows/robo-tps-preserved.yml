name: Robo Salvage original-UI TPS QA

on:
  push:
    branches:
      - feature/robo-salvage-original-ui-tps-20261117
    paths:
      - 'games/robo-salvage-tps-preserved/**'
      - 'scripts/verify_robo_tps_preserved.py'
      - '.github/workflows/robo-tps-preserved.yml'
  pull_request:
    paths:
      - 'games/robo-salvage-tps-preserved/**'
      - 'scripts/verify_robo_tps_preserved.py'
      - '.github/workflows/robo-tps-preserved.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tps-preservation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.62.0
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$BROWSER" ]; then
            echo "CHROMIUM_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify original hangar, route map, combat speed and TPS camera
        run: python scripts/verify_robo_tps_preserved.py
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-tps-original-ui-screens
          retention-days: 14
          if-no-files-found: warn
          path: evaluation/robo-tps-preserved/
