name: Four AI agents - static validation

on:
  pull_request:
    paths:
      - 'scripts/agents/**'
      - '.github/workflows/agent-*.yml'
      - 'requirements-agents.txt'
  push:
    paths:
      - 'scripts/agents/**'
      - '.github/workflows/agent-*.yml'
      - 'requirements-agents.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-definition-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and parser
        run: python -m pip install -r requirements-agents.txt pyyaml
      - name: Compile and validate four distinct AI definitions
        run: |
          python -m py_compile scripts/agents/autonomous.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import yaml
          from agents import Agent, Runner, function_tool
          path=Path('scripts/agents/autonomous.py')
          spec=importlib.util.spec_from_file_location('minigame1go_agents', path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert set(module.BOARDS) == {'manager','game','evaluation','video'}
          assert len(set(module.BOARDS.values())) == 4
          assert len(set(module.LABELS.values())) == 4
          for role in module.BOARDS:
              workflow=Path(f'.github/workflows/agent-{role}.yml')
              assert workflow.exists(), workflow
              data=yaml.load(workflow.read_text(), Loader=yaml.BaseLoader)
              assert 'workflow_dispatch' in data['on']
              assert 'schedule' in data['on']
              assert data['jobs']['autonomous-agent']['steps']
              assert module.ROLE_INSTRUCTIONS[role]
          print('FOUR INDEPENDENT AGENT CONFIGS: PASS')
          print('Live API not exercised; OPENAI_API_KEY required for real model execution.')
          PY
