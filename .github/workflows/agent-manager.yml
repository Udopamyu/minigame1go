name: MiniGame1GO - Producer AI

on:
  workflow_dispatch:
  schedule:
    - cron: '7 10 * * 2,5' # UTC: Tue/Fri 19:07 JST

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: minigame1go-agent-manager
  cancel-in-progress: false

jobs:
  autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Locate active development branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          BASE=main
          STATE=$(gh pr view 2 --json state --jq '.state' 2>/dev/null || echo CLOSED)
          if [ "$STATE" = "OPEN" ]; then
            git fetch origin feature/catapult-four-team-pipeline
            git checkout -B agent-work origin/feature/catapult-four-team-pipeline
            BASE=feature/catapult-four-team-pipeline
          fi
          echo "AGENT_BASE_BRANCH=$BASE" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check AI model API credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::OPENAI_API_KEY repository secret is missing. An AI agent cannot start without a model credential.'
            exit 1
          fi
      - name: Install agent runtime
        run: python -m pip install -r requirements-agents.txt
      - name: Run independent manager AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: gpt-6-luna
        run: python scripts/agents/autonomous.py --role manager
      - name: Save evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manager-ai-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            agent-output/manager.json
