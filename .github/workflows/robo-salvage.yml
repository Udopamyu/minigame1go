name: Robo Salvage prototype QA

on:
  push:
    paths:
      - 'games/robo-salvage/**'
      - 'scripts/verify_robo_salvage.py'
      - 'scripts/robo_playtest.py'
      - '.github/workflows/robo-salvage.yml'
  pull_request:
    paths:
      - 'games/robo-salvage/**'
      - 'scripts/verify_robo_salvage.py'
      - 'scripts/robo_playtest.py'
      - '.github/workflows/robo-salvage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Verify assembled HTML and measure first-party source
        run: |
          python scripts/build_robo_salvage.py --check
          python scripts/robo_line_count.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('games/robo-salvage/index.html').read_text()
          js=re.findall(r'<script[^>]*>(.*?)</script\s*>',s,re.S|re.I)
          assert len(js)==1
          Path('/tmp/robo-salvage.js').write_text(js[0])
          PY
          node --check /tmp/robo-salvage.js
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use preinstalled Chrome where available
        run: |
          python -m pip install playwright
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$BROWSER" ]; then
            echo "CHROMIUM_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"
          else
            python -m playwright install chromium
          fi
      - name: Ensure Japanese glyphs render in screenshot evidence
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser QA
        run: python scripts/verify_robo_salvage.py
      - name: Autonomous gameplay playtest (real UI; no combat cheats)
        run: python scripts/robo_playtest.py
      - name: Upload playable prototype and test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robo-salvage-prototype
          retention-days: 14
          if-no-files-found: warn
          path: |
            games/robo-salvage/index.html
            evaluation/robo-salvage/
