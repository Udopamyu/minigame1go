<main class="layout"><section class="play"><div class="view-wrap"><canvas id="game" width="720" height="400" aria-label="投石機ゲーム"></canvas><div class="inview viewtop"><div class="pixelbox" id="stageName">01 木の物見台</div><div class="pixelbox" id="goalText">54%</div></div><div id="status" hidden>READY</div><div class="target-inset"><div class="target-caption">TARGET ◉</div><canvas id="targetCanvas" width="220" height="132" aria-label="標的の常時プレビュー"></canvas></div></div><div class="camera-bar"><span>◀ VIEW</span><input id="cameraSlide" type="range" min="0" max="100" value="0" aria-label="画面を横にスクロール"><span>▶</span></div><div class="footer-controls"><div class="setting"><label>解放ピン <output id="pinOut">112°</output></label><input id="pin" type="range" min="82" max="139" step="1" value="112"></div><div class="setting"><label>巻き上げ <output id="windOut">85%</output></label><input id="wind" type="range" min="55" max="100" step="1" value="85"></div><button id="fire" class="fire">投 石 !!</button></div><div class="ammo-row" id="ammoRow"><button data-ammo="stone" class="ammo-btn active">● 石弾</button><button data-ammo="scatter" class="ammo-btn">••• 散弾 <small>🔒</small></button><button data-ammo="explosive" class="ammo-btn">✸ 炸裂 <small>🔒</small></button></div></section>
<aside class="shop" id="shop"><div class="shop-head"><b>⚙ 改造</b><button id="closeShop" class="shop-close">ゲームに戻る</button></div><div id="upgrades" class="upgrades"></div><div class="tools"><button id="reset">最初から</button><button id="sound">♪ ON</button></div></aside></main><button class="mobile-shop" id="openShop">⚙ 改造</button>
<div class="overlay" id="overlay"><div class="dialog"><div style="font-size:32px">✷ ◈ ✷</div><h2 id="resultTitle">STAGE CLEAR!</h2><p id="resultInfo"></p><div class="reward" id="reward"></div><button id="next">次のステージへ ▶</button><button class="alt" id="showShop">改造してから進む</button></div></div>
<style>.camera-bar{display:flex;align-items:center;gap:9px;background:#142338;color:#e8d19b;padding:7px 14px;font:12px monospace}.camera-bar input{flex:1;min-width:0;accent-color:#f2c86f;touch-action:auto}.upgrade-desc{font:11px/1.4 sans-serif;color:#c8d5d1;margin:3px 0 6px}</style><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d',{alpha:false}),PI=Math.PI,DEG=PI/180,G=9.81,SMALL=window.innerWidth<700,W=SMALL?480:720,H=SMALL?580:400,VIEW=SMALL?80:90,HOME=SMALL?-5:-6,GROUND=H*(SMALL?.73:.78),KEY='pixel-trebuchet-v03';
canvas.width=W;canvas.height=H;
ctx.imageSmoothingEnabled=false;
const STAGES=[
 ['木の物見台',58,.54,110,'wood'],['二連の柵',68,.55,150,'wood'],['石積みの塀',80,.56,210,'stone'],['見張りの塔',90,.56,275,'stone'],['橋の関所',101,.59,340,'wood'],['峡谷のつり橋',108,.56,440,'wood'],['山上の古城',118,.57,560,'stone'],['戦車の進軍',125,.58,690,'metal'],['赤い峡谷の城塞',136,.59,850,'stone'],['天空の王城',147,.60,1250,'metal']];
// Later levels have real, collidable elevated foundations. Elevation is in world units.
const SCENES=[
 {theme:'plain',height:0,wind:0,gust:0},
 {theme:'plain',height:0,wind:0,gust:0},
 {theme:'plain',height:0,wind:0,gust:0},
 {theme:'plain',height:0,wind:0,gust:0},
 {theme:'plain',height:0,wind:0,gust:0},
 {theme:'bridge',height:11,wind:-.22,gust:.08},
 {theme:'mountain',height:14,wind:.18,gust:.06},
 {theme:'tank',height:5,wind:-.18,gust:.09},
 {theme:'canyon',height:24,wind:.24,gust:.08},
 {theme:'royal',height:30,wind:-.28,gust:.12}
];
function scene(){return SCENES[save.stage]||SCENES[0]}
// Three separate, destructible spans with intact islands in between.
// The ground under each span is genuinely absent; it is not an invisible bridge.
function bridgeGeometry(t=STAGES[5][1]){
 return [
  {x0:t-31,x1:t-18,y:11,h:2},
  {x0:t-11,x1:t+2,y:11,h:2},
  {x0:t+9,x1:t+22,y:11,h:2}
 ];
}
function makeBridges(){
 if(save.stage!==5)return [];
 return bridgeGeometry().map((b,i)=>({...b,id:i,hp:440,max:440,dead:false}));
}
function terrainHeight(x){
 const e=scene().height,t=STAGES[save.stage][1];
 if(!e)return 0;
 if(save.stage===5){
  // Shore -> bridge -> island -> bridge -> island -> bridge -> shore
  if((x>=t-50&&x<=t-31)||(x>=t-18&&x<=t-11)||
     (x>=t+2&&x<=t+9)||(x>=t+22&&x<=t+48))return e;
  return 0;
 }
 return x>=t-12&&x<=t+43?e:0;
}
function windAt(t){const m=scene();return m.wind + m.gust*Math.sin(t*2.3) +m.gust*.35*Math.sin(t*5.6)}
const M={wood:{hp:50,gold:17,base:'#a86e43',hi:'#dba36b',dark:'#5f3d35'},stone:{hp:105,gold:34,base:'#829294',hi:'#b5c5ba',dark:'#536c78'},metal:{hp:175,gold:55,base:'#526e87',hi:'#8ca6a8',dark:'#293e59'}};
const TECH=[
 {id:'cw',title:'▣ 重り増量',desc:'重り100kg → 最大740kg',max:8,price:65,rate:1.62},
 {id:'arm',title:'╱ アーム延長',desc:'長い腕で射出速度アップ',max:7,price:70,rate:1.61},
 {id:'sling',title:'⌁ スリング改良',desc:'投射ひもの長さと効率',max:7,price:65,rate:1.62},
 {id:'axle',title:'⊕ 軸受け強化',desc:'回転時の摩擦を減らす',max:7,price:75,rate:1.59},
 {id:'ball',title:'● 石の硬化',desc:'直接衝撃ダメージ強化',max:7,price:80,rate:1.6},
 {id:'blast',title:'✸ 衝撃波',desc:'着弾周囲も破壊する',max:6,price:90,rate:1.68},
 {id:'income',title:'◆ 資材回収',desc:'破壊時の獲得G増加',max:7,price:65,rate:1.6},
 {id:'scatter',title:'••• 散弾',desc:'Lv.1で3発、最大6発',max:4,price:135,rate:1.7},
 {id:'explosive',title:'✸ 炸裂弾',desc:'着弾地点を広範囲破壊',max:4,price:170,rate:1.75}];
const BASE={gold:120,stage:0,done:0,pin:112,wind:85,lv:Object.fromEntries(TECH.map(x=>[x.id,0])),active:Object.fromEntries(TECH.map(x=>[x.id,0])),ammo:'stone',sound:true,shots:0};
let save;try{let old=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('pixel-trebuchet-v02')||'null');save={...BASE,...(old||{}),lv:{...BASE.lv,...(old?.lv||{})},active:{...BASE.active,...(old?.active||old?.lv||{})}};save.stage=clampStage(save.stage);for(const t of TECH){save.lv[t.id]=Math.max(0,Math.min(t.max,save.lv[t.id]|0));save.active[t.id]=Math.max(0,Math.min(save.lv[t.id],save.active[t.id]|0))}if(!['stone','scatter','explosive'].includes(save.ammo))save.ammo='stone';}catch{save=structuredClone(BASE)};
function clampStage(i){return Math.max(0,Math.min(9,i|0))}
let barriers=[],balloons=[],balloonTotal=0,balloonDown=0,manualCamera=false,camGoal=HOME,blocks=[],bridges=[],targetBounds=null,brokenCount=0,stageGoal=0,stagePaid=false,winAll=false,mode='idle',actionTime=0,clock=0,last=0,sim=null,projectiles=[],impactHold=0,camera=HOME,visualShake=0,flash=0,particles=[],texts=[],preview=null,stageStartCount=0,stageRestored=false;
const lv=id=>save.active[id]||0,owned=id=>save.lv[id]||0, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), money=n=>Math.floor(n).toLocaleString('ja-JP'),cost=t=>Math.round(t.price*Math.pow(t.rate,owned(t.id))/5)*5;
function store(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch{}}
function addBlock(col,row,mat= 'wood'){return {x:STAGES[save.stage][1]+col*3.4,y:scene().height+row*3.4,w:3.4,h:3.4,mat,hp:M[mat].hp,max:M[mat].hp,dead:false,fall:false,vy:0,vx:0,rot:0}}
function blueprint(){
 let stage=save.stage,list=[],ids=new Set();
 const add=(x,y,type)=>{let k=x+':'+y;if(ids.has(k))return;ids.add(k);list.push(addBlock(x,y,type))};
 const rect=(x0,x1,y0,y1,mt)=>{for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)add(x,y,mt)};
 const tower=(c,h,mt)=>{rect(c,c+1,0,h-1,mt);rect(c-1,c+2,h,h,mt==='metal'?'stone':'wood')};
 switch(stage){
 case 0:tower(0,3,'wood');break;
 case 1:tower(0,3,'wood');tower(4,3,'wood');rect(2,3,0,1,'wood');break;
 case 2:rect(0,5,0,2,'stone');rect(1,4,3,3,'wood');break;
 case 3:tower(0,5,'stone');tower(5,4,'wood');rect(2,4,0,1,'stone');break;
 case 4:tower(0,4,'wood');tower(6,4,'stone');rect(2,5,3,3,'wood');rect(2,5,0,1,'wood');break;
 // A suspended destructible bridge across a genuine valley, higher than launch level.
 case 5:break; // Three independently destructible bridge objects; islands are terrain.
 // A compact hilltop castle, with battlements instead of a plain vertical wall.
 case 6:tower(0,4,'stone');tower(5,4,'stone');rect(2,4,0,2,'stone');rect(2,4,3,3,'wood');break;
 // Battlefield: low bunkers and moving armoured targets.
 case 7:rect(0,3,0,1,'metal');tower(6,2,'stone');rect(4,7,0,0,'wood');break;
 // A fortress split into two groups on the canyon mesa.
 case 8:tower(0,4,'stone');tower(8,4,'stone');rect(2,6,0,2,'wood');rect(2,6,3,3,'stone');break;
 // Final royal keep with towers, roof and battlements, on an elevated plateau.
 case 9:tower(0,4,'metal');tower(8,4,'metal');rect(2,7,0,3,'stone');rect(3,6,4,4,'metal');break;
 }
 return list;
}
function maxCam(){return Math.max(HOME,STAGES[save.stage][1]-(save.stage===5?VIEW*.49:VIEW*.30))}
function makeBarriers(){
 const i=save.stage;if(i<1||i>=5)return [];
 const x=STAGES[i][1];
 // Unbreakable obstacles: each stage is a distinct trajectory puzzle.
 const layouts=[[],
 [{x:-18,y:0,w:3.5,h:13}],
 [{x:-23,y:0,w:5,h:19},{x:-9,y:28,w:10,h:3}],
 [{x:-32,y:0,w:4,h:23},{x:-17,y:14,w:13,h:3}],
 [{x:-27,y:0,w:6,h:10},{x:-11,y:34,w:13,h:4}],
 [{x:-36,y:0,w:4,h:29},{x:-18,y:20,w:5,h:4},{x:6,y:38,w:15,h:3}],
 [{x:-32,y:0,w:7,h:16},{x:-21,y:27,w:15,h:3},{x:12,y:0,w:4,h:11}],
 [{x:-39,y:0,w:4,h:24},{x:-27,y:35,w:12,h:4},{x:-8,y:14,w:11,h:3}],
 [{x:-40,y:0,w:7,h:12},{x:-29,y:22,w:13,h:4},{x:-13,y:41,w:16,h:3},{x:18,y:0,w:5,h:12}],
 [{x:-43,y:0,w:5,h:30},{x:-31,y:38,w:14,h:4},{x:-13,y:20,w:11,h:3},{x:23,y:0,w:6,h:16}]];
 return layouts[i].map((b,n)=>({...b,x:x+b.x,kind:b.y===0?'pillar':'floating',stripe:n%2}));
}
function balloonX(b){return b.x+Math.sin(clock*(b.speed||.6)+b.phase)*(b.range||0)}
function makeBalloons(){
 const i=save.stage;if(i<3||i===5)return [];
 if(i===7||i===9){
  const n=i===7?2:1,t=STAGES[i][1],h=scene().height;
  return Array.from({length:n},(_,j)=>({
   kind:'tank',x:t+8+j*11,y:h+2.5,r:2.9,dead:false,
   phase:j*1.3+.5,speed:.44+j*.09,range:5.5+j*1.5
  }));
 }
 const n=i>=8?2:1;
 return Array.from({length:n},(_,j)=>({
  kind:'balloon',x:STAGES[i][1]+8+j*13,
  y:Math.max(scene().height+12,25+j*10+(i-3)*1.6),
  r:i<5?2.25:2.6,dead:false,phase:j*2.3+1.1,
  speed:.48+j*.15+i*.035,range:3.5+i*.75

function makeMech(){let a=save.wind/100;return {th:(181+34*a)*DEG,om:0,phi:0.02,pv:0,sphi:0.04,sv:0,alpha:0,tipAX:0,tipAY:0,trail:[],rel:false}}

 for(const q of barriers){let x=(q.x-minX)*scale,y=base-(q.y+q.h)*scale;ic.fillStyle='#263b4b';ic.fillRect(x-q.w*scale/2,y,q.w*scale,q.h*scale)}for(const q of balloons){if(q.dead)continue;ic.fillStyle=q.kind==='tank'?'#657565':'#f2a5a2';ic.fillRect((balloonX(q)-minX)*scale-(q.kind==='tank'?7:3),base-(q.y+(q.kind==='tank'?0:Math.sin(clock*.8+q.phase)*.5))*scale-5,q.kind==='tank'?14:6,9)}ic.strokeStyle='#d2c49e';ic.lineWidth=3;ic.strokeRect(1.5,1.5,w-3,h-3);
}
function draw(){ctx.save();ctx.translate(Math.round((Math.random()-.5)*visualShake*4),Math.round((Math.random()-.5)*visualShake*3));sky();drawTerrain();drawBridges();for(let b of blocks)drawBlock(b);drawBarriers();drawBalloons();drawMech();drawTrajectory();for(const p of projectiles){if(p.gone)continue;for(let i=0;i<p.trail.length;i++){let q=p.trail[i];rect(sx(q.x)-2,sy(q.y)-2,3,3,i%2?'#edd29c':'#fff8d4')}pixelBall(sx(p.x),sy(p.y),Math.max(3,6+lv('ball')*.5)*(p.kind==='scatter'?.68:1));}
 for(let p of particles)rect(sx(p.x),sy(p.y),p.sz,p.sz,p.color);for(let t of texts)squareText(t.t,sx(t.x),sy(t.y),11,t.color,'center');if(flash>0){ctx.globalAlpha=flash*1.8;rect(0,0,W,H,'#fff9ce')}ctx.restore();drawTarget();}

function tick(t){const dt=Math.min(.042,(t-last)/1000||0);last=t;let n=Math.max(1,Math.ceil(dt/(1/60)));for(let k=0;k<n;k++)update(dt/n);draw();requestAnimationFrame(tick)}
$('cameraSlide').oninput=e=>{manualCamera=true;camGoal=HOME+(maxCam()-HOME)*(+e.target.value/100);camera=camGoal};let dragX=null;canvas.addEventListener('pointerdown',e=>{dragX=e.clientX;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(dragX===null)return;manualCamera=true;camGoal=clamp(camGoal-(e.clientX-dragX)*VIEW/canvas.getBoundingClientRect().width,HOME,maxCam());dragX=e.clientX});canvas.addEventListener('pointerup',()=>dragX=null);canvas.addEventListener('pointercancel',()=>dragX=null);$('fire').onclick=()=>{manualCamera=false;shoot()};
$('pin').oninput=e=>{if(mode!=='idle')return;save.pin=+e.target.value;if(mode==='idle'){sim=makeMech();preview=predict()}store();ui()};
$('wind').oninput=e=>{if(mode!=='idle')return;save.wind=+e.target.value;if(mode==='idle'){sim=makeMech();preview=predict()}store();ui()};
$('upgrades').onclick=e=>{let b=e.target.closest('[data-buy]');if(b)buy(b.dataset.buy)};
$('upgrades').oninput=e=>{if(!e.target.matches('[data-tune]'))return;tune(e.target.dataset.tune,e.target.value);e.target.parentElement.querySelector('strong').textContent='使用 '+e.target.value};
$('upgrades').onchange=e=>{if(e.target.matches('[data-tune]'))ui()};
$('ammoRow').onclick=e=>{const el=e.target.closest('[data-ammo]');if(el)chooseAmmo(el.dataset.ammo)};
$('openShop').onclick=()=>$('shop').classList.add('open');$('closeShop').onclick=()=>$('shop').classList.remove('open');$('next').onclick=()=>nextStage(false);$('showShop').onclick=()=>nextStage(true);
$('sound').onclick=()=>{save.sound=!save.sound;$('sound').textContent=save.sound?'♪ ON':'♪ OFF';store()};$('sound').textContent=save.sound?'♪ ON':'♪ OFF';
$('reset').onclick=()=>{if(!confirm('所持金・強化・ステージを初期化しますか？'))return;save=structuredClone(BASE);store();loadStage();$('shop').classList.remove('open')};
window.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target instanceof Element&&e.target.closest('button,input,textarea,select,a,[contenteditable]'))return;e.preventDefault();shoot()});

// Read-only diagnostics for browser QA: no game state can be modified here.
window.__catapultQA=()=>({
 stage:save.stage,theme:scene().theme,elevation:scene().height,camera:camera,viewWidth:VIEW,
 targetGround:terrainHeight(STAGES[save.stage][1]),
 lowestTargetBlock:Math.min(...blocks.map(b=>b.y)),
 highestTargetBlock:Math.max(...blocks.map(b=>b.y+b.h)),
 movingTargets:balloons.map(b=>({kind:b.kind,x:balloonX(b),y:b.y,range:b.range})),
 wind:windAt(0),targetX:STAGES[save.stage][1],
 previewLanding:preview?preview.land:null
});
loadStage();requestAnimationFrame(tick);
})();
</script></body></html>
