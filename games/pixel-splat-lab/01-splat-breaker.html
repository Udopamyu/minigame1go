<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b0d20"><title>SPLAT BREAKER — 粒子破壊アクション</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a18;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#intro,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070b18b0;z-index:5;color:#e4fff8;backdrop-filter:blur(3px)}#end{display:none}.sheet{text-align:center;max-width:440px;margin:18px;padding:28px 30px 24px;background:#0d1830eb;border:1px solid #66d7d079;box-shadow:0 20px 90px #000a;transform:skewY(-1deg)}h1{font:950 clamp(26px,7vw,45px)/1.05 ui-monospace,monospace;letter-spacing:-1.5px;margin:0 0 14px;color:#aeffe3;text-shadow:3px 4px 0 #164955}.sheet p{font-size:13px;color:#b0c8d0;line-height:1.9;margin:12px 0}.sheet button{display:block;margin:18px auto 0;padding:12px 39px;border:1px solid #9affe4;background:#42c4b7;color:#071528;font:900 15px system-ui;cursor:pointer;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}.sheet small{font-size:11px;opacity:.72}#pad{position:fixed;left:clamp(10px,4vw,38px);bottom:max(22px,env(safe-area-inset-bottom));height:123px;width:123px;border-radius:50%;border:2px solid #83d4ce4f;background:#173b4b48;touch-action:none;display:none;z-index:3}#nub{width:54px;height:54px;border-radius:50%;background:#93f1db90;box-shadow:inset 0 0 0 3px #c9fff797;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}#dash{position:fixed;right:clamp(16px,6vw,45px);bottom:max(43px,env(safe-area-inset-bottom));border-radius:50%;width:94px;height:94px;display:none;place-items:center;z-index:3;border:2px solid #f7c7a8a0;background:#ce685953;color:#ffe1c4;touch-action:none}#dash svg{width:48px;height:48px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:round}#dash:active{background:#e5917a8c}#hint{position:fixed;right:14px;top:12px;color:#94b6c0aa;font:11px ui-monospace,monospace;letter-spacing:1px;pointer-events:none;z-index:2}@media(pointer:coarse){#pad{display:block}#dash{display:grid}#hint{display:none}}@media(max-height:490px){#pad{width:89px;height:89px;bottom:12px}#nub{height:38px;width:38px}#dash{height:73px;width:73px;bottom:19px}#dash svg{width:36px;height:36px}}@media(prefers-reduced-motion:reduce){#intro,#end{backdrop-filter:none}}
</style></head><body>
<canvas id="game" aria-label="粒子を破壊し吸収する高速アクションゲーム"></canvas><div id="hint">WASD / ARROWS · SPACE / SHIFT</div>
<div id="pad" aria-label="移動スティック"><div id="nub"></div></div><button id="dash" aria-label="突進"><svg viewBox="0 0 48 48"><path d="M28 3L9 26h15l-4 19 19-24H24z"/></svg></button>
<div id="intro"><div class="sheet"><h1>SPLAT<br>BREAKER</h1><p>光の塊へ突進して、粒子を砕け。<br>散らばった粒子を吸収して大きくなる。<br>ただし、大きくなるほど敵弾を避けにくい。</p><p><small>PC: WASD／矢印で移動・Space／Shiftで突進<br>スマホ: 左スティック＋右の稲妻</small></p><button id="play">▶ START</button></div></div>
<div id="end"><div class="sheet"><h1>CORE LOST</h1><p>砕いて、吸収して、もう一度。</p><button id="retry">↻ RETRY</button></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(v,b)),rr=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t;
let W=480,H=300,last=0,frames=0,elapsed=0,running=false,down=false,shake=0,flash=0,wave=1,cracked=0,upcoming=0;const rseeds=[],stars=[];let enemies=[],sparks=[],orbs=[],bullets=[],clouds=[];const worldRadius=258;
function resize(){const ratio=innerWidth/Math.max(1,innerHeight),w=clamp(Math.round(innerWidth*.64),300,560);W=w;H=clamp(Math.round(w/ratio),190,720);c.width=W;c.height=H;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();let seed=97744;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function sr(a,b){return a+(b-a)*rand()}
const player={x:0,z:0,y:24,vx:0,vz:0,r:14,size:1,health:100,dash:0,dashCool:0,inv:0,heading:0,combo:0,absorb:0};const keys={up:0,down:0,left:0,right:0};const map={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};let input={x:0,y:0},joy={active:false,id:0,x:0,y:0};
addEventListener('keydown',e=>{if(map[e.code]){keys[map[e.code]]=1;e.preventDefault()}if((e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat){burstDash();e.preventDefault()}});addEventListener('keyup',e=>{if(map[e.code])keys[map[e.code]]=0});addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=0);input={x:0,y:0};joy.active=false});
const pad=document.getElementById('pad'),nub=document.getElementById('nub');function movePad(e){const rect=pad.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,r=rect.width*.35;let dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),scale=Math.min(1,m/r);input.x=m?dx/m*scale:0;input.y=m?dy/m*scale:0;nub.style.transform=`translate(calc(-50% + ${input.x*r}px),calc(-50% + ${input.y*r}px))`}
pad.addEventListener('pointerdown',e=>{e.preventDefault();joy={active:true,id:e.pointerId};pad.setPointerCapture(e.pointerId);movePad(e)});pad.addEventListener('pointermove',e=>{if(joy.active&&joy.id===e.pointerId)movePad(e)});for(let name of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(name,e=>{if(e.pointerId===joy.id){joy.active=false;input.x=input.y=0;nub.style.transform='translate(-50%,-50%)'}});document.getElementById('dash').addEventListener('pointerdown',e=>{e.preventDefault();burstDash()});
let skyDots=[];for(let i=0;i<110;i++)skyDots.push({x:rand(),y:rand()*.85,r:sr(.5,1.5),phase:sr(0,TAU)});const palGround=['#203447','#1d374b','#304962','#426579','#4d6578'];
function h(x,z){const d=Math.hypot(x,z)/worldRadius;return -8+5*Math.sin(x*.032)*Math.cos(z*.025)-Math.max(0,d-.66)*28}
// All rocks and terrain are 3D sample points, rendered as perspective pixel splats.
function makeScenery(){clouds=[];for(let i=0;i<2800;i++){let a=sr(0,TAU),r=Math.sqrt(rand())*worldRadius,x=Math.cos(a)*r,z=Math.sin(a)*r;clouds.push({x,y:h(x,z)+sr(-1,1),z,color:palGround[Math.floor(sr(0,5))],s:sr(1.2,3.3),kind:0})}for(let j=0;j<22;j++){let a=sr(0,TAU),r=sr(90,243),x=Math.cos(a)*r,z=Math.sin(a)*r;for(let k=0;k<72;k++){const u=sr(0,TAU),v=sr(-1,1),q=sr(3,22);clouds.push({x:x+Math.cos(u)*q*.67,y:h(x,z)+Math.abs(v)*q*.85,z:z+Math.sin(u)*q*.67,color:k%7?'#465d6b':'#d288aa',s:sr(1,3.4),kind:0})}}for(let i=0;i<350;i++){let a=sr(0,TAU),r=sr(270,460);clouds.push({x:Math.cos(a)*r,y:sr(-60,80),z:Math.sin(a)*r,color:'#505075',s:sr(1.5,4),kind:1})}}
makeScenery();
// A miniature point-cloud hull, shaped like a manta-shaped hover machine.
function sampleShell(n,team,shape=0){const out=[];for(let i=0;i<n;i++){let angle=sr(0,TAU),rad=Math.sqrt(rand()),y=sr(-1,1);let x=Math.cos(angle)*rad*18,z=Math.sin(angle)*rad*18;let lift=13+6*(1-rad);if(shape===0){x*=1.35;z*=1.05;lift+=10*(1-Math.abs(x/24));}if(shape===1){x*=1.15;z*=1.2;lift+=13*Math.max(0,1-Math.abs(z)/22);}let col=team==='player'?(i%8===0?'#fff5a9':i%5===0?'#4ac6db':i%3===0?'#a3fff1':'#418c9d'):(i%7===0?'#ffb7b5':i%5===0?'#ffc18c':i%2?'#ed708b':'#934b71');out.push({x,y:y*7+lift,z,col,s:sr(1.8,3.9)});}return out}
const playerShell=sampleShell(260,'player');const enemyShell=Array.from({length:4},(_,i)=>sampleShell(145+i*28,'enemy',i%2));
function spawnWave(){enemies=[];const count=4+Math.min(6,wave*2);for(let i=0;i<count;i++){let a=i/count*TAU+sr(-.35,.35),r=sr(120,230);enemies.push({x:Math.cos(a)*r,z:Math.sin(a)*r,y:17,r:14+wave*.7,hp:1+Math.floor((wave-1)/3),t:sr(0,TAU),shoot:sr(.9,2),type:i%4,mesh:enemyShell[i%4],hit:0})}upcoming=0}
function start(){player.x=player.z=0;player.vx=player.vz=0;player.health=100;player.dash=0;player.dashCool=0;player.size=1;player.combo=0;player.absorb=0;player.inv=.3;player.heading=-Math.PI/2;running=true;cracked=0;wave=1;bullets=[];orbs=[];sparks=[];flash=0;spawnWave();document.getElementById('intro').style.display='none';document.getElementById('end').style.display='none'}document.getElementById('play').onclick=start;document.getElementById('retry').onclick=start;
function burstDash(){if(!running||player.dashCool>0)return;let mx=player.vx,mz=player.vz,mag=Math.hypot(mx,mz);if(mag<15){mx=Math.cos(player.heading);mz=Math.sin(player.heading)}else{mx/=mag;mz/=mag}player.vx=mx*610;player.vz=mz*610;player.dash=.31;player.dashCool=.78;player.inv=.31;shake=2;flash=.13;burst(player.x,20,player.z,'#99ffee',22,160)}
function burst(x,y,z,col,n=38,vel=100){for(let i=0;i<n;i++){let a=sr(0,TAU),r=sr(0,vel);sparks.push({x,y,z,vx:Math.cos(a)*r,vy:sr(1,110),vz:Math.sin(a)*r,life:sr(.35,1.25),color:col,s:sr(1.2,3.8)})}if(sparks.length>850)sparks.splice(0,sparks.length-850)}
function damage(n){if(player.inv>0)return;player.health=Math.max(0,player.health-n);player.inv=.54;shake=8;flash=.23;burst(player.x,22,player.z,'#ffb3b2',28,130);if(player.health<=0){running=false;document.getElementById('end').style.display='flex'}}
function kill(e){let ix=enemies.indexOf(e);if(ix<0)return;enemies.splice(ix,1);cracked++;shake=Math.min(12,shake+4);flash=.16;burst(e.x,28,e.z,'#f894ae',115,165);burst(e.x,18,e.z,'#ffc78f',58,130);for(let i=0;i<28;i++)orbs.push({x:e.x+sr(-20,20),y:sr(8,48),z:e.z+sr(-20,20),life:9,phase:sr(0,TAU)});player.combo++;if(enemies.length===0)upcoming=1.4}
function update(dt){if(!running)return;elapsed+=dt;frames++;shake=Math.max(0,shake-dt*25);flash=Math.max(0,flash-dt*1.5);player.dashCool=Math.max(0,player.dashCool-dt);player.inv=Math.max(0,player.inv-dt);let ix=(keys.right-keys.left)+input.x,iy=(keys.down-keys.up)+input.y,mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}const yaw=.57,sy=Math.sin(yaw),cy=Math.cos(yaw),dx=ix*cy+iy*sy,dz=-ix*sy+iy*cy;
if(mag>.05)player.heading=Math.atan2(dz,dx);
let oldx=player.x,oldz=player.z;if(player.dash>0){player.dash=Math.max(0,player.dash-dt);player.vx*=Math.exp(-dt*1.1);player.vz*=Math.exp(-dt*1.1);if(Math.random()<.92)burst(player.x,20,player.z,'#6ae6dc',2,12)}else{let speed=178/(1+(player.size-1)*.57),blend=1-Math.exp(-dt*17);player.vx=lerp(player.vx,dx*speed,blend);player.vz=lerp(player.vz,dz*speed,blend)}player.x+=player.vx*dt;player.z+=player.vz*dt;let bound=Math.hypot(player.x,player.z),edge=worldRadius-23;if(bound>edge){player.x*=edge/bound;player.z*=edge/bound;player.vx*=.28;player.vz*=.28}player.y=h(player.x,player.z)+14+Math.sin(elapsed*10)*2;
for(const e of enemies){e.t+=dt;e.hit=Math.max(0,e.hit-dt);let vx=player.x-e.x,vz=player.z-e.z,d=Math.max(1,Math.hypot(vx,vz));let mov=clamp(d/120,0,1)*((wave>3?53:44)+wave*3)*dt;e.x+=vx/d*mov+Math.sin(e.t*2+e.type)*dt*13;e.z+=vz/d*mov+Math.cos(e.t*1.9+e.type)*dt*12;e.y=h(e.x,e.z)+8+Math.sin(e.t*3+e.type)*5;e.shoot-=dt;if(e.shoot<=0){e.shoot=sr(1.25,2.4);if(d<305){let ang=Math.atan2(vz,vx);bullets.push({x:e.x,y:e.y+18,z:e.z,vx:Math.cos(ang)*155,vz:Math.sin(ang)*155,life:3})}}if(d<player.r*player.size+e.r+6){if(player.dash>.01){e.hp-=1;e.hit=.15;if(e.hp<=0)kill(e);else burst(e.x,e.y+20,e.z,'#ffe1b0',24,90)}else damage(18)}}
for(const b of bullets){b.x+=b.vx*dt;b.z+=b.vz*dt;b.life-=dt;if(Math.hypot(b.x-player.x,b.z-player.z)<player.r*player.size+5){b.life=0;damage(11)}}bullets=bullets.filter(b=>b.life>0&&Math.hypot(b.x,b.z)<worldRadius+80);
for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];o.life-=dt;o.phase+=dt*5;let dx=player.x-o.x,dz=player.z-o.z,d=Math.hypot(dx,dz);if(d<105){let speed=d<40?390:245;o.x+=dx/Math.max(1,d)*dt*speed;o.z+=dz/Math.max(1,d)*dt*speed}o.y=15+Math.sin(o.phase)*4;if(d<14){orbs.splice(i,1);player.absorb++;if(player.absorb%26===0){player.size=Math.min(1.82,player.size+.115);player.health=Math.min(100,player.health+9);burst(player.x,24,player.z,'#d1ffe3',65,90)}continue}if(o.life<=0)orbs.splice(i,1)}
for(let i=sparks.length-1;i>=0;i--){let p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vx*=Math.exp(-dt*2.5);p.vz*=Math.exp(-dt*2.5);p.vy-=180*dt;p.life-=dt;if(p.life<=0)sparks.splice(i,1)}if(upcoming>0){upcoming-=dt;if(upcoming<=0){wave++;spawnWave();player.health=Math.min(100,player.health+12)}}}
let focus={x:0,z:0},zoom=1;const drawItems=[];function project(x,y,z){const sy=Math.sin(.57),cy=Math.cos(.57),e=.65,ce=Math.cos(e),se=Math.sin(e),dist=635;const camx=focus.x+sy*ce*dist,camz=focus.z+cy*ce*dist,camy=80+se*dist;let rx=x-camx,ry=y-camy,rz=z-camz;let depth=-(sy*ce*rx+se*ry+cy*ce*rz);if(depth<35||depth>1750)return null;let right=cy*rx-sy*rz,up=-sy*se*rx+ce*ry-cy*se*rz;let scale=zoom*Math.min(W/480,H/280)*(H/W>1.35?1.3:1)*860/depth;return {x:W*.50+right*scale,y:H*(H/W>1.35?.50:.56)-up*scale,scale,depth}}
function push(x,y,z,color,s,kind=0,alpha=1){const p=project(x,y,z);if(!p||p.x<-18||p.y<-18||p.x>W+18||p.y>H+18)return;drawItems.push([p.depth,p.x,p.y,clamp(Math.ceil(s*p.scale),1,10),color,alpha,kind])}
function draw(){const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1129');bg.addColorStop(.54,'#181a38');bg.addColorStop(1,'#37233b');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let a of skyDots){g.globalAlpha=.32+.35*Math.sin(elapsed*.6+a.phase);g.fillStyle='#a4a9d6';g.fillRect(a.x*W,a.y*H,a.r,a.r)}g.globalAlpha=1;focus.x=lerp(focus.x,player.x*.7,.1);focus.z=lerp(focus.z,player.z*.7,.1);zoom=lerp(zoom,player.dash>0?1.09:1,.11);drawItems.length=0;
for(const p of clouds)push(p.x,p.y,p.z,p.color,p.s,p.kind,p.kind?0.4:1);
for(let idx=0;idx<enemies.length;idx++){let e=enemies[idx],rot=e.t*.7,se=Math.sin(rot),co=Math.cos(rot);for(let p of e.mesh){let x=e.x+(p.x*co-p.z*se),z=e.z+(p.x*se+p.z*co);push(x,e.y+p.y*.85,z,e.hit>0?'#fff9d5':p.col,p.s,2)}for(let k=0;k<13;k++){let a=k/13*TAU;push(e.x+Math.cos(a)*e.r,e.y+2,e.z+Math.sin(a)*e.r,'#ff9e9c',1.8,1,.5)}}
for(let p of playerShell){const an=player.heading+.5,sy=Math.sin(an),cy=Math.cos(an),x=player.x+(p.x*cy-p.z*sy)*player.size,z=player.z+(p.x*sy+p.z*cy)*player.size;push(x,player.y+(p.y-8)*player.size,z,player.inv>0&&Math.floor(elapsed*24)%2?'#ffffff':p.col,p.s,2)}
for(let b of bullets)for(let k=0;k<5;k++)push(b.x-b.vx*.014*k,b.y+18,b.z-b.vz*.014*k,k?'#ee6c8a':'#fff6d9',3-k*.3,3);
for(let o of orbs)push(o.x,o.y,o.z,'#e0ffd7',2.9,3);
for(let p of sparks)push(p.x,p.y,p.z,p.color,p.s,4,clamp(p.life,0,1));drawItems.sort((a,b)=>b[0]-a[0]);
if(shake){g.save();g.translate(rr(-shake,shake),rr(-shake,shake))}for(const p of drawItems){g.globalAlpha=p[5];g.fillStyle=p[4];g.fillRect(p[1]-p[3]/2,p[2]-p[3]/2,p[3],p[3])}g.globalAlpha=1;if(shake)g.restore();
// HUD: geometry only, no distracting text during play.
let b=clamp(W*.22,70,118);g.fillStyle='#13283e';g.fillRect(16,17,b,5);g.fillStyle='#a5ffdc';g.fillRect(16,17,b*player.health/100,5);g.fillStyle='#23334b';g.fillRect(16,28,b,3);g.fillStyle='#fdc68f';g.fillRect(16,28,b*(1-player.dashCool/.78),3);for(let i=0;i<6;i++){let x=W/2+(i-2.5)*15;g.fillStyle=i<Math.min(6,enemies.length)?'#f49eae':'#426078';g.fillRect(x-4,13,8,5)}
const rim=clamp(6+player.size*3,9,17);let pr=project(player.x,player.y+18,player.z);if(pr){g.strokeStyle='#8fffee99';g.lineWidth=1;g.beginPath();g.arc(pr.x,pr.y,rim,0,TAU);g.stroke()}
if(flash){g.fillStyle=`rgba(255,230,205,${flash*.15})`;g.fillRect(0,0,W,H)}g.fillStyle='#02091977';g.fillRect(0,H-3,W,3)}
function loop(t){let dt=clamp((t-last)/1000||.016,0,.042);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.splatDiagnostics=()=>({game:'breaker',running,frames,wave,health:player.health,player:[player.x,player.z],size:player.size,dash:player.dash,dashCool:player.dashCool,enemyCount:enemies.length,particles:drawItems.length,cracked,viewport:[W,H]});
})();
</script></body></html>
