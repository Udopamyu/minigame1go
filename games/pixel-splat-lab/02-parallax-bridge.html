<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0e1027"><title>PARALLAX BRIDGE — 視点で組み立てる粒子パズル</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;padding:0;margin:0;overflow:hidden;touch-action:none;background:#0b0c25;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}.ctl{display:none;position:fixed;bottom:max(27px,env(safe-area-inset-bottom));gap:14px;z-index:3}.ctl.left{left:18px}.ctl.right{right:18px}.ctl button{width:71px;height:71px;border:1px solid #e2c3ff88;background:#2c2f5966;color:#e5ddfb;border-radius:20px;display:grid;place-items:center;touch-action:none}.ctl.right button{border-color:#95fff1aa;color:#b6fff6;background:#1b4c5980}.ctl button:active{background:#d8a4f366}.ctl svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:square;stroke-linejoin:round}#intro,#end{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08091dbc;z-index:6;color:#ecf8ff;backdrop-filter:blur(4px)}#end{display:none}.sheet{text-align:center;margin:22px;padding:31px 30px;max-width:450px;border:1px solid #b6a2fa99;background:linear-gradient(140deg,#1a1c42e9,#0a273de9);box-shadow:0 25px 90px #000b}h1{font:900 clamp(26px,7vw,44px)/1.05 ui-monospace,monospace;letter-spacing:-2px;color:#f0d9ff;text-shadow:3px 3px 0 #594673;margin:0 0 18px}.sheet p{font-size:13px;line-height:2;color:#bed0df}.sheet small{font-size:11px;color:#9dabbf}.sheet button{margin-top:14px;padding:13px 30px;background:#d4a7ef;border:0;color:#182137;font:800 15px ui-monospace,monospace;cursor:pointer;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}#hint{position:fixed;top:12px;right:12px;font:10px ui-monospace,monospace;letter-spacing:1px;color:#b5b3dc88;pointer-events:none}@media(pointer:coarse){.ctl{display:flex}#hint{display:none}}@media(max-height:460px){.ctl{bottom:12px;gap:6px}.ctl button{width:54px;height:54px}.ctl svg{width:26px;height:26px}}
</style></head><body>
<canvas id="game" aria-label="カメラの角度を変え、散らばった粒子で橋を完成させて渡るパズルゲーム"></canvas><div id="hint">A / D OR ← → : ROTATE · W / S : WALK</div>
<div class="ctl left"><button id="turnL" aria-label="視点を左回転"><svg viewBox="0 0 32 32"><path d="M18 6L8 16l10 10M8 16h17"/></svg></button><button id="turnR" aria-label="視点を右回転"><svg viewBox="0 0 32 32"><path d="M14 6l10 10-10 10M24 16H7"/></svg></button></div>
<div class="ctl right"><button id="back" aria-label="後退"><svg viewBox="0 0 32 32"><path d="M8 8h16v16H8zM16 22V10m-6 6 6-6 6 6"/></svg></button><button id="walk" aria-label="前進"><svg viewBox="0 0 32 32"><path d="M5 16h22M19 8l8 8-8 8"/></svg></button></div>
<div id="intro"><div class="sheet"><h1>PARALLAX<br>BRIDGE</h1><p>散った光の粒は、ある角度でだけ橋に見える。<br>視点を回して一本の橋を結び、渡れ。<br>角度がずれると、足場は消える。</p><p><small>PC: A / Dで視点回転、Wで進む、Sで戻る<br>スマホ: 左側の2ボタンで回転、右側で進退</small></p><button id="play">▶ START</button></div></div>
<div id="end"><div class="sheet"><h1>LIGHT<br>REJOINED</h1><p>4つの橋を見つけた。世界は再びつながった。</p><button id="retry">↻ AGAIN</button></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});const TAU=Math.PI*2,ELEV=.51,SE=Math.sin(ELEV),CE=Math.cos(ELEV),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;let W=480,H=300,frames=0,time=0,last=0,running=false,ended=false,level=0,progress=0,yaw=-.18,fall=0,flash=0,connected=false,wasConnected=false,falls=0;let focus={x:0,z:0};let seed=2027123;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function rr(a,b){return a+(b-a)*rand()}function resize(){W=clamp(Math.round(innerWidth*.63),300,585);H=clamp(Math.round(W*innerHeight/innerWidth),190,715);c.width=W;c.height=H;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const islands=[{x:-246,z:-22},{x:-112,z:57},{x:27,z:-47},{x:155,z:59},{x:280,z:-24}];const targetAngles=[.57,-.84,1.05,-.38];const palette=[['#234358','#4d648a','#7085a5','#ab83d5'],['#2c5469','#4d7088','#6ea1a7','#b6d6d1'],['#374267','#63669b','#8ca6bc','#d2b6da'],['#43556f','#7d7998','#b49ebb','#facbbc'],['#315b68','#5c849a','#8dc0b9','#fff4ca']];const stationary=[],bridgeFragments=[],motes=[],sky=[];let particles=[];const hero={x:islands[0].x,z:islands[0].z,y:27};const commands={left:0,right:0,forward:0,back:0};
for(let i=0;i<128;i++)sky.push({x:rand(),y:rand()*.93,r:rr(.5,2.0),phase:rr(0,TAU)});
function addDot(x,y,z,color,s,kind=0,bridge=-1){stationary.push({x,y,z,color,s,kind,bridge})}
// Floating islands and their undersides contain no triangle meshes; every sample is a 3D pixel splat.
for(let k=0;k<islands.length;k++){let p=islands[k],colors=palette[k];for(let j=0;j<600;j++){let a=rr(0,TAU),r=Math.sqrt(rand())*42,x=p.x+Math.cos(a)*r,z=p.z+Math.sin(a)*r,y=13+4*Math.sin(x*.028+z*.024);addDot(x,y,z,colors[j%3],rr(1.35,3.6),0)}for(let j=0;j<300;j++){let a=rr(0,TAU),r=Math.sqrt(rand())*43,down=rr(0,47)*(1-r/50),x=p.x+Math.cos(a)*r,z=p.z+Math.sin(a)*r;addDot(x,12-down,z,colors[j%2],rr(1.2,3.3),1)}for(let m=0;m<5;m++){let a=m*TAU/5+rr(-.2,.2),rad=rr(22,33),x=p.x+Math.cos(a)*rad,z=p.z+Math.sin(a)*rad,height=rr(22,50);for(let j=0;j<80;j++){let r=rr(0,5),a=rr(0,TAU),xx=x+Math.cos(a)*r,zz=z+Math.sin(a)*r,yy=16+rand()*height;addDot(xx,yy,zz,j%4===0?colors[3]:colors[2],rr(1.2,3.1),2)}}}
// Projection alignment trick: at the intended yaw, depth displacements project onto the SAME screen coordinates.
// A particle's depth offset d is compensated by y += d * tan(ELEV). Turning away splits the coherent bridge into apparent debris.
for(let b=0;b<4;b++){const a=islands[b],end=islands[b+1],ideal=targetAngles[b],sy=Math.sin(ideal),cy=Math.cos(ideal);bridgeFragments[b]=[];for(let i=0;i<540;i++){let t=rr(.18,.82),depth=rr(-74,74),cross=rr(-10,10),x=lerp(a.x,end.x,t)+depth*sy+cross*cy,z=lerp(a.z,end.z,t)+depth*cy-cross*sy,y=14+Math.tan(ELEV)*depth+rr(-2.2,2.2);bridgeFragments[b].push({x,y,z,phase:rr(0,TAU),s:rr(1.5,3.5),color:i%5===0?'#fcdfc5':i%3===0?'#ecb5ed':'#9fded8'})}for(let k=0;k<28;k++){let t=k/27,x=lerp(a.x,end.x,t),z=lerp(a.z,end.z,t);motes.push({x,y:16,z,bridge:b,t})}}
const dust=[];for(let i=0;i<230;i++)dust.push({x:rr(-400,440),y:rr(-100,140),z:rr(-260,300),r:rr(1,2.8)});
function nearAngle(x,t){return Math.abs(Math.atan2(Math.sin(x-t),Math.cos(x-t)))}function actorPosition(){if(level>=4)return {...islands[4],y:28};return {x:lerp(islands[level].x,islands[level+1].x,progress),z:lerp(islands[level].z,islands[level+1].z,progress),y:28+Math.sin(progress*Math.PI)*1.5}}
function reset(){level=0;progress=0;yaw=-.18;fall=0;flash=0;connected=false;wasConnected=false;falls=0;ended=false;running=true;time=0;particles=[];hero.x=islands[0].x;hero.z=islands[0].z;hero.y=28;document.getElementById('intro').style.display='none';document.getElementById('end').style.display='none'}document.getElementById('play').onclick=reset;document.getElementById('retry').onclick=reset;
const keyMap={KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back'};addEventListener('keydown',e=>{let s=keyMap[e.code];if(s){commands[s]=1;e.preventDefault()}});addEventListener('keyup',e=>{let s=keyMap[e.code];if(s)commands[s]=0});addEventListener('blur',()=>{Object.keys(commands).forEach(k=>commands[k]=0)});for(let [id,action] of [['turnL','left'],['turnR','right'],['walk','forward'],['back','back']]){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();commands[action]=1;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>commands[action]=0)}
let drag=null;c.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag?.id===e.pointerId){let d=e.clientX-drag.x;yaw=clamp(yaw+d*.0075,-TAU,TAU);drag.x=e.clientX}});for(let ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,e=>{if(drag?.id===e.pointerId)drag=null});
function emit(x,y,z,n,color){for(let i=0;i<n;i++){let a=rr(0,TAU),v=rr(15,90);particles.push({x,y,z,vx:Math.cos(a)*v,vy:rr(-40,70),vz:Math.sin(a)*v,life:rr(.45,1.25),s:rr(1.1,3.1),color})}if(particles.length>580)particles.splice(0,particles.length-580)}
function drop(){fall=1.02;falls++;flash=.4;emit(hero.x,hero.y,hero.z,90,'#ffb3d6')}
function update(dt){if(!running)return;frames++;time+=dt;flash=Math.max(0,flash-dt*1.1);let turn=(commands.right-commands.left);yaw+=turn*dt*1.18;connected=level<4&&nearAngle(yaw,targetAngles[level])<.15;if(connected&&!wasConnected){emit(hero.x,45,hero.z,36,'#daffef');flash=.18}wasConnected=connected;
if(fall>0){fall-=dt;hero.y-=130*dt;if(fall<=0){progress=0;fall=0;const a=islands[level];hero.x=a.x;hero.z=a.z;hero.y=28}}else if(level<4){const direction=commands.forward-commands.back;if(direction){let next=clamp(progress+direction*dt*.39,0,1);if((progress===0&&direction<0)||((!connected)&&next>0&&next<1)){if(progress>0)drop()}else{progress=next;const p=actorPosition();hero.x=p.x;hero.z=p.z;hero.y=p.y+Math.sin(time*6)*1.6;if(progress>=1){level++;progress=0;flash=.55;emit(hero.x,hero.y,hero.z,150,'#ffffd4');if(level>=4){running=false;ended=true;document.getElementById('end').style.display='flex'}else{connected=false;wasConnected=false}}}}if(progress>0&&!connected&&fall===0)drop();}
const next=islands[Math.min(level+1,4)],base=islands[Math.min(level,4)];const look={x:(hero.x+next.x)*.5,z:(hero.z+next.z)*.5};focus.x=lerp(focus.x,look.x,Math.min(1,dt*2.5));focus.z=lerp(focus.z,look.z,Math.min(1,dt*2.5));for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;p.vy-=125*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}}
function project(x,y,z){let dx=x-focus.x,dz=z-focus.z,sy=Math.sin(yaw),cy=Math.cos(yaw),s=Math.min(W/455,H/285)*1.12*(H/W>1.35?1.34:1);return {x:W/2+(dx*cy-dz*sy)*s,y:H*.57-((y-16)*CE-(dx*sy+dz*cy)*SE)*s,depth:dx*sy+dz*cy-y*.15,scale:s}}
const renderPoints=[];function put(x,y,z,col,s=2,a=1){let p=project(x,y,z);if(p.x<-14||p.x>W+14||p.y<-14||p.y>H+14)return;renderPoints.push({x:p.x,y:p.y,dep:p.depth,s:clamp(Math.round(s*p.scale),1,8),c:col,a})}
function diamond(x,y,r,color){g.fillStyle=color;g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r,y);g.lineTo(x,y+r);g.lineTo(x-r,y);g.closePath();g.fill()}
function draw(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#0b112a');grad.addColorStop(.55,'#252044');grad.addColorStop(1,'#432a52');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let s of sky){g.globalAlpha=.18+.47*Math.max(0,Math.sin(time*.8+s.phase));g.fillStyle='#d1d3f5';g.fillRect(s.x*W,s.y*H,s.r,s.r)}g.globalAlpha=1;renderPoints.length=0;
for(let p of dust)put(p.x,p.y,p.z,'#756c9a',p.r,.35);
for(let p of stationary)put(p.x,p.y,p.z,p.color,p.s,p.kind===1?.87:1);
// Only current bridge responds to the player's selected viewing angle. Completed ones remain faint traces.
for(let b=0;b<4;b++){let align=nearAngle(yaw,targetAngles[b]),active=level===b,done=b<level;for(let f of bridgeFragments[b]){let lum=active?clamp(1-align/.75,.08,1):done?.23:.10;let col=lum>.74?'#d9fff1':f.color;put(f.x,f.y+Math.sin(time*2+f.phase)*1.3,f.z,col,f.s*(lum>.72?1.28:1),done?.1:lum*.73)}}
for(let m of motes){let p=project(m.x,m.y,m.z);const a=level===m.bridge?clamp(1-nearAngle(yaw,targetAngles[level])/.6,.05,.9):m.bridge<level?.12:.08;let r=1+Math.sin(time*4+m.t*20)*.4;g.globalAlpha=a;g.fillStyle='#c5fcf3';g.fillRect(p.x-1,p.y-1,r+1,r+1)}g.globalAlpha=1;
// Hero is another 3D splat cloud, not a smooth billboard.
for(let i=0;i<190;i++){let r=Math.cbrt((i+.5)/190)*8,theta=i*2.39996,u=1-2*(i+.5)/190,sr=Math.sqrt(Math.max(0,1-u*u)),x=hero.x+Math.cos(theta)*sr*r,z=hero.z+Math.sin(theta)*sr*r,y=hero.y+u*r;put(x,y,z,i%8===0?'#fdf0bd':i%3===0?'#7cfbe5':'#c9fff6',2.5)}
for(let p of particles)put(p.x,p.y,p.z,p.color,p.s,clamp(p.life,0,1));renderPoints.sort((a,b)=>b.dep-a.dep);for(let p of renderPoints){g.globalAlpha=p.a;g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1;
// Projection-guide reticle: the four segments progress from 'scatter' to 'aligned'.
if(level<4){let closeness=clamp(1-nearAngle(yaw,targetAngles[level])/.85,0,1),px=W*.5,py=H-38,r=12;g.strokeStyle='#9db2c073';g.lineWidth=2;g.beginPath();g.arc(px,py,r,0,TAU);g.stroke();g.strokeStyle=connected?'#c4ffe4':'#d3aadf';g.beginPath();g.arc(px,py,r,-Math.PI/2,-Math.PI/2+closeness*TAU);g.stroke();if(connected){diamond(px,py,4,'#edffbe');}else{g.fillStyle='#778caa';g.fillRect(px-1,py-1,2,2)} }
for(let i=0;i<4;i++){let px=W/2+(i-1.5)*20;diamond(px,16,i<level?6:4,i<level?'#bdfff0':i===level?'#ecc1ff':'#46506a')}
let pr=project(hero.x,hero.y,hero.z);g.globalAlpha=.18;g.fillStyle='#c5fff4';g.beginPath();g.arc(pr.x,pr.y,16+3*Math.sin(time*3),0,TAU);g.fill();g.globalAlpha=1;if(flash>0){g.fillStyle=`rgba(234,240,255,${flash*.19})`;g.fillRect(0,0,W,H)}g.fillStyle='#0b0d2e7d';g.fillRect(0,H-4,W,4)}
function frame(t){let dt=clamp((t-last)/1000||.016,0,.04);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.splatDiagnostics=()=>({game:'parallax',frames,running,ended,level,progress,yaw,target:targetAngles[level]??null,alignment:level<4?nearAngle(yaw,targetAngles[level]):0,bridgeActive:connected,falls,hero:[hero.x,hero.y,hero.z],points:renderPoints.length,viewport:[W,H]});
})();
</script></body></html>
