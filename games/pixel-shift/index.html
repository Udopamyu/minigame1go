<div id="help" role="dialog" aria-modal="true" aria-label="操作説明"><article><h2>PIXEL SHIFT</h2><p>カメラが上空から車の後ろへ、同じ立体世界の中を飛んで移動します。車・樹木・障害物・ゲートは、積層したドット絵を実際の立体面として描画しています。</p><p>左右：A / D または ← / →<br>ブースト：Space / Shift / ↑<br>視点切替：C / V / Tab、またはカメラアイコン</p><p>光るゲートをくぐり、赤い障害物を避けて進みます。コースに沿って自動で走るので、左右を押すと車体の向きが大きく振れ、側面が見える鋭いドリフトになります。視点の使い分けも楽しめます。</p><p>プレイ画面は文字なし。俯瞰で先の障害物を確認し、追尾視点でスピードを楽しんでください。</p><button id="helpClose">戻る</button></article></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),g=canvas.getContext('2d',{alpha:false,desynchronized:true});

let W=480,H=270,frame=0,last=0,elapsed=0,fps=60,fpsAccumulator=0,fpsN=0,quality=1,drawCalls=0,collisionCount=0,gatesPassed=0,gateMissed=0,flash=0,hit=0;
const input={left:false,right:false,boost:false},car={z:0,lane:0,speed:235,heading:0,tilt:0,turnYaw:0,sideV:0,turnVelocity:0},cam={mix:0,target:0,x:0,y:0,z:0,yaw:0,forward:[0,0,1],right:[1,0,0],up:[0,1,0],focal:340,pitch:0};
let cameraTouched=false,engine=null;
function resize(){let w=innerWidth,h=innerHeight,base=Math.min(540,Math.max(250,Math.round(w*(w>820?.51:.69))));W=base;H=clamp(Math.round(W*h/w),200,650);canvas.width=W;canvas.height=H;g.imageSmoothingEnabled=false;}resize();window.addEventListener('resize',resize);
function curve(z){return 145*S(z/530)+62*S(z/219)+29*S(z/1050+1.4)}
function dcurve(z){return 145/530*C(z/530)+62/219*C(z/219)+29/1050*C(z/1050+1.4)}
function rnd(n){let v=S(n*127.1+48.3)*43758.5453;return v-Math.floor(v)}
const ROAD=210;
const gates=Array.from({length:140},(_,i)=>({z:320+i*480,lane:[0,57,-57,42,-42,0,-75,74][i%8],got:false,miss:false}));
const hazards=Array.from({length:180},(_,i)=>({z:550+i*280+45*rnd(i*3),lane:(rnd(i+8)>.5?1:-1)*(37+42*rnd(i*3+2)),hit:false}));
const trees=[];for(let i=0;i<470;i++){const z=i*115+60;for(let side of [-1,1])trees.push({z,x:curve(z)+side*(145+rnd(i*9+side*77)*170),s:.7+rnd(i+side*13)*.85,type:i%8===0?'tower':'tree'})}

function makeLayer(type,z){const c=document.createElement('canvas');c.width=35;c.height=49;const p=c.getContext('2d');p.imageSmoothingEnabled=false;const rect=(x,y,w,h,color)=>{p.fillStyle=color;p.fillRect(x,y,w,h)};
if(type==='car'){
 if(z<4){
  // Chassis, wheels, bumper and tail lights have their own exposed voxel faces.
  rect(7,6,21,39,z<2?'#0b2737':'#1b5766');
  for(let yy of [10,33]){rect(4,yy,6,8,'#07121e');rect(25,yy,6,8,'#07121e')}
  rect(10,3,15,6,'#5cd9df');rect(10,41,15,4,'#0d2c42');

  rect(xx+1,39,4,2,'#ff9675');rect(xx+w-5,39,4,2,'#ff9675');

 }
 if(z>=8&&z<14){

  const narrow=z>11?2:0,left=10+narrow,right=25-narrow;
  rect(left,17+narrow,right-left,20-2*narrow,z<11?'#2b8497':'#83d5d0');
  rect(left+2,17+narrow,right-left-4,9,z<11?'#0b3856':'#276d7f');
  rect(left+2,27,right-left-4,5,'#11435e');
  rect(left,33,right-left,3,'#d0fff0');
 }
 if(z===14){rect(13,21,9,10,'#d7fff0');rect(15,23,5,3,'#66b9c8')}
}else if(type==='tree'){
 if(z<9){rect(16,17,4,8,z%2?'#7f6266':'#53434e')}
 if(z>=4){const r=z<12?Math.min(16,(z-2)*1.9):Math.max(2,18-(z-12)*2.1);rect(17-r,18-r,2*r,2*r,z%3===0?'#64bc92':z%3===1?'#207f81':'#2fa29a');if(z%3===0){rect(15-r*.4,12-r*.4,6,4,'#a6eeb5')}}
}else if(type==='tower'){

}return c}
const stacks={car:Array.from({length:15},(_,i)=>makeLayer('car',i)),tree:Array.from({length:22},(_,i)=>makeLayer('tree',i)),tower:Array.from({length:22},(_,i)=>makeLayer('tower',i)),block:Array.from({length:16},(_,i)=>makeLayer('block',i))};
function cameraUpdate(dt){const a=1-Math.exp(-dt*2.1);cam.mix=lerp(cam.mix,cam.target,a);if(Math.abs(cam.mix-cam.target)<.0004)cam.mix=cam.target;
 const m=smooth(cam.mix),tangent=Math.atan(dcurve(car.z));cam.yaw=lerp(cam.yaw,tangent,clamp(dt*3.3,0,1));const fx=S(cam.yaw),fz=C(cam.yaw);
 const far=lerp(42,145,m)+Math.max(0,(car.speed-230))*m*.095;
 const cy=lerp(510,49,m),cx=curve(car.z)+car.lane-fx*far,cz=car.z-fz*far;
 const focusDist=lerp(78,168,m),tx=curve(car.z)+car.lane+fx*focusDist,tz=car.z+fz*focusDist,ty=lerp(0,17,m);
 cam.x=cx;cam.y=cy;cam.z=cz;
 let dx=tx-cx,dy=ty-cy,dz=tz-cz,inv=1/hyp(dx,dy,dz);dx*=inv;dy*=inv;dz*=inv;
 const rightX=dz/hyp(dx,dz),rightZ=-dx/hyp(dx,dz);
 cam.forward=[dx,dy,dz];cam.right=[rightX,0,rightZ];// Camera up is the cross product of forward and right; keeps both views in one true perspective projection.
 cam.up=[dy*rightZ,Math.sqrt(dx*dx+dz*dz),-dy*rightX];

}
function camCoord(x,y,z){let dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;return {X:dx*cam.right[0]+dz*cam.right[2],Y:dx*cam.up[0]+dy*cam.up[1]+dz*cam.up[2],Z:dx*cam.forward[0]+dy*cam.forward[1]+dz*cam.forward[2]}}
function proj(x,y,z){const a=camCoord(x,y,z);if(a.Z<=3.5)return null;const k=cam.focal/a.Z;return {x:W*.5+a.X*k,y:H*.50-a.Y*k,d:a.Z,k}}
function poly(points,color){let v=points.map(p=>camCoord(...p));const clipped=[];for(let i=0;i<v.length;i++){let a=v[i],b=v[(i+1)%v.length],ina=a.Z>4,inb=b.Z>4;if(ina)clipped.push(a);if(ina!==inb){let t=(4-a.Z)/(b.Z-a.Z);clipped.push({X:lerp(a.X,b.X,t),Y:lerp(a.Y,b.Y,t),Z:4})}}
if(clipped.length<3)return;g.fillStyle=color;g.beginPath();for(let i=0;i<clipped.length;i++){const p=clipped[i],scale=cam.focal/p.Z,x=W*.5+p.X*scale,y=H*.5-p.Y*scale;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.fill();drawCalls++}
function rectQuad(z0,z1,a0,b0,a1,b1,y,color){const x0=curve(z0),x1=curve(z1);poly([[x0+a0,y,z0],[x0+b0,y,z0],[x1+b1,y,z1],[x1+a1,y,z1]],color)}
const SKY_TOP='#0d273f',SKY_MID='#497d92';
function backdrop(){let horizon=clamp(H*(.50+Math.tan(cam.pitch)*.28),-H*3,H*3);let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,SKY_TOP);grd.addColorStop(.45,SKY_MID);grd.addColorStop(.78,'#a4c9b8');grd.addColorStop(1,'#456b6e');g.fillStyle=grd;g.fillRect(0,0,W,H);
 let cloud=lerp(1,0,smooth(cam.mix)),y=clamp(H*(.35-cam.pitch*.06),-20,H);g.fillStyle=`rgba(247,221,185,${.4*cam.mix})`;g.fillRect(W*.73,y-25,25,25);g.fillStyle=`rgba(249,238,202,${.6*cam.mix})`;g.fillRect(W*.73+7,y-18,11,11);

}
function hillHeight(offset,z){let t=clamp((Math.abs(offset)-135)/900,0,1);return -.65+t*(55+27*S(z/210+offset/180)+18*S(z/127-offset/260))+t*t*215}

function terrain(){const steps=[];for(let d=-230;d<3400;){let nd=d+(d<650?26:d<1600?62:130);steps.push([car.z+d,car.z+nd,d]);d=nd}
 for(let i=steps.length-1;i>=0;i--){const [z0,z1,d]=steps[i];const shade=(Math.floor(z0/56)%2===0);
  // A real heightfield: lateral bands carry ground elevation from the road up into hills.
  // No WebGL or tessellated 3D mesh; only a small set of terrain quads per depth slice.
  const hillBands=d>1100?[-1450,-550,-135,135,550,1450]:HILL_EDGES;
  for(let j=0;j<hillBands.length-1;j++){
    const a=hillBands[j],b=hillBands[j+1];
    poly([[curve(z0)+a,hillHeight(a,z0),z0],[curve(z0)+b,hillHeight(b,z0),z0],
          [curve(z1)+b,hillHeight(b,z1),z1],[curve(z1)+a,hillHeight(a,z1),z1]],
      j%3===0?(shade?'#3b7372':'#316465'):j%3===1?'#2d5c60':'#214e5d');
  }
  rectQuad(z0,z1,-131,131,-131,131,-.4,'#3c6b6d');rectQuad(z0,z1,-115,115,-115,115,-.20,shade?'#253b4b':'#263d50');
  rectQuad(z0,z1,-115,-111,-115,-111,0,'#8bbaad');rectQuad(z0,z1,111,115,111,115,0,'#8bbaad');
  if(Math.floor(z0/40)%3===0)rectQuad(z0,z1,-1.6,1.6,-1.6,1.6,.08,'#deccaa');

function circle(x,y,r,color,thickness=2){g.strokeStyle=color;g.lineWidth=thickness;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke()}

// Build real volumetric voxel surfaces from the original height-sliced sprites.
// Each rectangle is an exposed 3D face, not a screen-facing sprite; the same mesh
// is projected in the overhead and TPS camera with correct depth/side shading.
function buildVoxelMesh(type){
 const layers=stacks[type],step=type==='car'?2.5:3.5;
 const nx=Math.ceil(35/step),nz=Math.ceil(49/step),ny=layers.length;
 const solid=new Uint32Array(nx*nz*ny);
 const slot=(i,j,k)=>((k*nz+j)*nx+i);
 for(let k=0;k<ny;k++){
  const c=layers[k],ctx=c.getContext('2d');const pixels=ctx.getImageData(0,0,c.width,c.height).data;
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
   let color=0;const sx=Math.min(34,Math.floor((i+.5)*step)),sz=Math.min(48,Math.floor((j+.5)*step));
   let pos=(sz*35+sx)*4;
   if(pixels[pos+3]>50){color=0x1000000|(pixels[pos]<<16)|(pixels[pos+1]<<8)|pixels[pos+2]}
   if(color)solid[slot(i,j,k)]=color;
  }
 }
 const dims=[nx,nz,ny],faceData=[];
 const sample=(q)=>q[0]<0||q[1]<0||q[2]<0||q[0]>=nx||q[1]>=nz||q[2]>=ny?0:solid[slot(...q)];
 for(let axis=0;axis<3;axis++){
  const U=(axis+1)%3,V=(axis+2)%3,du=dims[U],dv=dims[V];
  for(let plane=0;plane<=dims[axis];plane++){
   const mask=new Array(du*dv).fill(null);
   for(let v=0;v<dv;v++)for(let u=0;u<du;u++){
    const a=[0,0,0],b=[0,0,0];a[axis]=plane-1;b[axis]=plane;a[U]=b[U]=u;a[V]=b[V]=v;
    const A=sample(a),B=sample(b);
    if(!!A===!!B)continue;
    mask[v*du+u]={color:A||B,sign:A?1:-1};
   }
   for(let v=0;v<dv;v++)for(let u=0;u<du;u++){
    const item=mask[v*du+u];if(!item)continue;
    let width=1;
    while(u+width<du){let a=mask[v*du+u+width];if(!a||a.color!==item.color||a.sign!==item.sign)break;width++}
    let height=1;
    outer:while(v+height<dv){for(let h=0;h<width;h++){
      let a=mask[(v+height)*du+u+h];if(!a||a.color!==item.color||a.sign!==item.sign)break outer
    }height++}
    for(let dy=0;dy<height;dy++)for(let dx=0;dx<width;dx++)mask[(v+dy)*du+u+dx]=null;
    const corners=[];
    for(const [cu,cv] of [[u,v],[u+width,v],[u+width,v+height],[u,v+height]]){
      const q=[0,0,0];q[axis]=plane;q[U]=cu;q[V]=cv;
      corners.push([q[0]*step-17.5, q[2]*(type==='car'?1.15:type==='block'?1.3:1.6),24.5-q[1]*step]);
    }

    const normal=axis===0?[item.sign,0,0]:axis===1?[0,0,-item.sign]:[0,item.sign,0];
    const light=axis===2?(item.sign>0?1.26:.48):axis===0?(item.sign>0?.78:.61):(item.sign>0?.66:.95);
    const r=(item.color>>>16)&255,g=(item.color>>>8)&255,b=item.color&255;
    const rgb=`rgb(${Math.min(255,Math.round(r*light))},${Math.min(255,Math.round(g*light))},${Math.min(255,Math.round(b*light))})`;
    faceData.push({corners,normal,rgb,centroid:corners.reduce((acc,p)=>[acc[0]+p[0]/4,acc[1]+p[1]/4,acc[2]+p[2]/4],[0,0,0])});
   }
  }
 }
 return faceData;
}
const volumes={car:buildVoxelMesh('car'),tree:buildVoxelMesh('tree'),tower:buildVoxelMesh('tower'),block:buildVoxelMesh('block')};
const depthFaces=[];
function stack(type,x,z,ang=0,scale=1){
 const base=proj(x,0,z);if(!base||base.d>1100||base.k<.12)return;
 const mesh=volumes[type],ss=S(ang),cc=C(ang);
 // Car only: a subtle lateral body-roll around the cabin midpoint. All
 // mesh face normals are rotated with the same transform as the vertices.
 const roll=type==='car'?car.tilt:0,rr=S(roll),rc=C(roll);
 const rolled=(p)=>{
   if(!roll)return p;
   const h=p[1]-16;return [p[0]*rc-h*rr,16+p[0]*rr+h*rc,p[2]];
 };
 // Different layers have correct exposed front/back/side faces. Cull faces
 // pointing away from the single perspective camera, then painter-sort.

 for(const f of mesh){
  const n=f.normal;

 }

 for(const item of depthFaces){
  const f=item.f;const verts=[];let outside=0;

  }
  if(outside||verts.length!==4)continue;
  if(verts.every(p=>p.x<0)||verts.every(p=>p.x>W)||verts.every(p=>p.y<0)||verts.every(p=>p.y>H))continue;
  g.fillStyle=f.rgb;g.beginPath();g.moveTo(verts[0].x,verts[0].y);
  for(let i=1;i<4;i++)g.lineTo(verts[i].x,verts[i].y);g.closePath();g.fill();drawCalls++;
 }
}
function groundMark(x,z,r,color){let p=proj(x,.4,z);if(!p)return;let ry=Math.max(2,r*p.k*Math.sin(cam.pitch));g.strokeStyle=color;g.lineWidth=clamp(p.k*1.5,1,4);g.beginPath();g.ellipse(p.x,p.y,r*p.k,ry,0,0,TAU);g.stroke()}
function drawGate(o){
 const x=curve(o.z)+o.lane,d=o.z-car.z;if(d<-80||d>1800)return;
 groundMark(x,o.z,35,o.got?'#4f837d':'#6af3d1');
 if(d>1350){const p=proj(x,39,o.z);if(p)disk(p.x,p.y,clamp(2*p.k,1,5),'#f7f1c6');return}
 // The checkpoint is a solid extruded arch: 2 concentric outlines, a front,
 // a back and a shaded inner/outer wall, all in the same 3D world.
 const n=d<600?32:20,inner=33,outer=38,center=39,front=o.z-3.6,back=o.z+3.6;
 g.save();g.globalAlpha=o.got?.38:1;
 for(let i=0;i<n;i++){
  let a=i/n*TAU,b=(i+1)/n*TAU;
  let frontOuter0=[x+C(a)*outer,center+S(a)*outer,front],frontOuter1=[x+C(b)*outer,center+S(b)*outer,front];
  let frontInner0=[x+C(a)*inner,center+S(a)*inner,front],frontInner1=[x+C(b)*inner,center+S(b)*inner,front];
  let backOuter0=[x+C(a)*outer,center+S(a)*outer,back],backOuter1=[x+C(b)*outer,center+S(b)*outer,back];
  let backInner0=[x+C(a)*inner,center+S(a)*inner,back],backInner1=[x+C(b)*inner,center+S(b)*inner,back];
  poly([backInner0,backOuter0,backOuter1,backInner1],'#64797a');
  poly([frontOuter0,backOuter0,backOuter1,frontOuter1],'#85675d');
  poly([frontInner0,frontInner1,backInner1,backInner0],'#c18d7c');
  poly([frontInner0,frontOuter0,frontOuter1,frontInner1],o.got?'#6b8992':i%4?'#dfb980':'#ffe4af');
 }
 if(!o.got){let p=proj(x,center,o.z);if(p&&p.k>.2)disk(p.x,p.y,clamp(3*p.k,2,9),'#f6ffd3')}
 g.restore();
}
function farVolume(o){
 const z=o.z,x=o.x,s=o.s;
 if(o.type==='tower'){
  const r=10*s,h=45*s;
  poly([[x-r,0,z-r],[x+r,0,z-r],[x+r,h,z-r],[x-r,h,z-r]],'#916d83');
  poly([[x+r,0,z-r],[x+r,0,z+r],[x+r,h,z+r],[x+r,h,z-r]],'#5b647a');
  poly([[x-r,h,z-r],[x+r,h,z-r],[x+r,h,z+r],[x-r,h,z+r]],'#e8c7aa');
 }else{
  const r=17*s,h=32*s;
  // Crossing solid diamond/prisms remain readable from either viewpoint.
  poly([[x-r,h*.45,z],[x,h*.98,z-r],[x+r,h*.45,z],[x,h*.70,z+r]],'#52b99f');
  poly([[x-r,h*.45,z],[x,h*.98,z-r],[x,h*.15,z-r]],'#317f85');
  poly([[x+r,h*.45,z],[x,h*.98,z-r],[x,h*.15,z-r]],'#216a80');
  poly([[x-r,0,z-r*.18],[x+r,0,z-r*.18],[x+r,h*.43,z-r*.18],[x-r,h*.43,z-r*.18]],'#835b5d');
 }
}
function drawObjects(){const drawList=[];
 for(let i=0;i<trees.length;i++){let o=trees[i],d=o.z-car.z;if(d> -150&&d<1350)drawList.push({d,kind:'tree',o})}
 for(let i=0;i<hazards.length;i++){let o=hazards[i],d=o.z-car.z;if(d>-90&&d<1300)drawList.push({d,kind:'hazard',o})}
 for(let i=0;i<gates.length;i++){let o=gates[i],d=o.z-car.z;if(d>-80&&d<1500)drawList.push({d,kind:'gate',o})}
 drawList.sort((a,b)=>b.d-a.d);
 for(let item of drawList){let o=item.o;if(item.kind==='tree'){
    let p=proj(o.x,0,o.z);if(!p||p.x<-75||p.x>W+75)continue;
    if(item.d>580){farVolume(o)}
    else stack(o.type,o.x,o.z,0,o.s)
  }else if(item.kind==='hazard'){
   let x=curve(o.z)+o.lane;if(!o.hit){groundMark(x,o.z,18,'#bd647c');stack('block',x,o.z)}
  }else drawGate(o)
 }
}
let exhaust=[],skidMarks=[];
function update(dt){elapsed+=dt;frame++;
 if(!cameraTouched&&elapsed>1.1){cam.target=1;cameraTouched=true}
 const steering=(+input.right)-(+input.left);
 car.speed=lerp(car.speed,input.boost?515:235,clamp(dt*(input.boost?1.65:.78),0,1));
 // Arcade drift: lateral inertia follows the actual controls, while the body
 // snaps its nose into the lane change. Strong yaw reveals the 3D side faces.
 const lateralTarget=steering*(155+car.speed*.28);
 car.sideV=lerp(car.sideV,lateralTarget,1-Math.exp(-dt*(steering?16:7.5)));
 const previousLane=car.lane;
 car.lane=clamp(car.lane+car.sideV*dt,-151,151);
 if(Math.abs(car.lane)>=150.9 && Math.sign(car.sideV)===Math.sign(car.lane))car.sideV=0;
 const sideActual=(car.lane-previousLane)/Math.max(dt,.001);
 const baseYaw=clamp(Math.atan2(sideActual,Math.max(210,car.speed))*1.34,-.98,.98);
 // At the road edge, keep a fraction of the turn animation, not an endless
 // sideways slide. Reversing the steering immediately flips the target.
 const cornerTarget=steering?(baseYaw*.79+steering*.26):0;
 const response=steering?(Math.sign(cornerTarget)===Math.sign(car.turnYaw)?17:23):9;
 const prevYaw=car.turnYaw;
 car.turnYaw=lerp(car.turnYaw,clamp(cornerTarget,-1.12,1.12),1-Math.exp(-dt*response));
 car.turnVelocity=(car.turnYaw-prevYaw)/Math.max(dt,.001);
 car.heading=Math.atan(dcurve(car.z))+car.turnYaw;
 const bankTarget=clamp(car.turnYaw*.14+car.turnVelocity*.008,-.17,.17);
 car.tilt=lerp(car.tilt,bankTarget,1-Math.exp(-dt*10));
 car.z+=car.speed*dt;
 // Two independently projected tire streaks follow the actual world path.
 // They are effects only, not steering/collision coordinates.
 if(frame%2===0&&Math.abs(car.turnYaw)>.24&&Math.abs(sideActual)>15){
  const cs=C(car.heading),sn=S(car.heading),x=curve(car.z)+car.lane;
  for(const side of [-1,1])skidMarks.push({x:x+side*14*cs-(-15)*sn,z:car.z-side*14*sn-15*cs,t:elapsed,side});
 }
 skidMarks=skidMarks.filter(v=>elapsed-v.t<2.1).slice(-165);
 for(let o of gates){let d=o.z-car.z;if(!o.got&&!o.miss&&d<-12){if(Math.abs(car.lane-o.lane)<48){o.got=true;gatesPassed++;flash=.8}else{o.miss=true;gateMissed++}}}
 for(let o of hazards){let d=Math.abs(o.z-car.z);if(!o.hit&&d<20&&Math.abs(car.lane-o.lane)<25){o.hit=true;car.speed*=.55;collisionCount++;hit=.95}}
 flash=Math.max(0,flash-dt*1.3);hit=Math.max(0,hit-dt*1.1);
 cameraUpdate(dt);
 if(frame%2===0 && car.speed>280){const x=curve(car.z)+car.lane;exhaust.push({x:x+(Math.random()-.5)*12,z:car.z-22,t:elapsed,side:Math.random()>.5?1:-1})}exhaust=exhaust.filter(p=>elapsed-p.t<.65).slice(-45);
}
function drawSkids(){
 // Ground-level trails, rendered with the same single-camera projection.
 let previous=[null,null];
 for(const k of skidMarks){
  const i=k.side===-1?0:1,p=proj(k.x,.5,k.z);
  const t=previous[i];
  if(p&&t&&Math.abs(p.x-t.x)<W*.24&&Math.abs(p.y-t.y)<H*.35){
   const fade=clamp(1-(elapsed-k.t)/2.1,0,1);
   g.globalAlpha=fade*.55;g.strokeStyle='#63d7cb';g.lineWidth=clamp(p.k*1.4,1,3);
   g.beginPath();g.moveTo(t.x,t.y);g.lineTo(p.x,p.y);g.stroke();
  }
  previous[i]=p;
 }
 g.globalAlpha=1;
}
function carDraw(){const x=curve(car.z)+car.lane,z=car.z;
 let p=proj(x,0,z);if(p){g.globalAlpha=.35;disk(p.x,p.y+3*p.k,clamp(p.k*22,6,47),'#03202a');g.globalAlpha=1}
 stack('car',x,z,car.heading,1.16);
 const d=proj(x,21,z-14);if(d&&input.boost){g.globalAlpha= .8;for(let side of [-1,1]){let q=proj(x+side*11,3,z-28);if(q){g.strokeStyle='#a6fff1';g.lineWidth=clamp(q.k*3,1,5);g.beginPath();g.moveTo(q.x,q.y);g.lineTo(q.x+side*3,q.y+clamp(car.speed/5*q.k,10,55));g.stroke()}}g.globalAlpha=1}
 for(let e of exhaust){let p=proj(e.x,2,e.z);if(!p)continue;g.globalAlpha=Math.max(0,1-(elapsed-e.t)/.65)*.55;g.fillStyle='#c1ffff';g.fillRect(p.x,p.y,clamp(p.k*3,1,9),clamp(p.k*3,1,9))}g.globalAlpha=1;
}
function speedFX(){const intensity=clamp((car.speed-230)/285,0,1);if(intensity<.035)return;
 const centerX=W*.5,centerY=H*.44;g.save();g.globalAlpha=.1+intensity*.48;
 for(let i=0;i<64;i++){let a=i*2.39996,phase=(i*.618034+elapsed*(.8+intensity*2.1))%1,r=phase*Math.max(W,H)*.72,x=centerX+C(a)*r,y=centerY+S(a)*r*.76,x2=centerX+C(a)*(r+12+intensity*68),y2=centerY+S(a)*(r+12+intensity*68)*.76;
 g.strokeStyle=i%5?'#d2fff5':'#ffe0a4';g.lineWidth=i%10?1:2;g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}g.restore();
 // front-edge speed glow
 let grad=g.createLinearGradient(0,H*.6,0,H);grad.addColorStop(0,'#64e6d800');grad.addColorStop(1,`rgba(111,238,218,${intensity*.12})`);g.fillStyle=grad;g.fillRect(0,H*.6,W,H*.4)
}
function HUD(){// all the UI elements on the playing field are pictographic
 let spacing=12,n=9,cy=16;for(let i=0;i<n;i++){const x=W*.5+(i-(n-1)/2)*spacing;disk(x,cy,2.6,i<(gatesPassed%n)?'#ffe6a8':'#305766');}
 const bars=21,fill=(car.speed-170)/390;for(let i=0;i<bars;i++){let x=W*.5+(i-bars/2)*6,y=H-12;g.fillStyle=i/bars<fill?(i>13?'#ffe2b2':'#9deed9'):'#1d4954';g.fillRect(x,y,4,5+(i%4===0?3:0))}
 if(flash){g.fillStyle=`rgba(236,255,196,${flash*.12})`;g.fillRect(0,0,W,H)}
 if(hit){g.fillStyle=`rgba(250,79,87,${hit*.30})`;g.fillRect(0,0,W,H)}
 if(elapsed<.4){g.fillStyle=`rgba(255,255,234,${(.4-elapsed)*.3})`;g.fillRect(0,0,W,H)}
}
function draw(){drawCalls=0;g.setTransform(1,0,0,1,0,0);backdrop();terrain();drawSkids();drawObjects();carDraw();speedFX();HUD();}
function tick(tm){let dt=last?Math.min(.04,(tm-last)/1000):.016;last=tm;
 if(document.getElementById('help').classList.contains('visible')){requestAnimationFrame(tick);return}
 update(dt);draw();fpsAccumulator+=dt;fpsN++;if(fpsAccumulator>=1){fps=Number((fpsN/fpsAccumulator).toFixed(1));fpsAccumulator=0;fpsN=0}requestAnimationFrame(tick)}
function toggleCamera(){cam.target=cam.target>.5?0:1;cameraTouched=true;document.getElementById('camera').classList.add('pressed');setTimeout(()=>document.getElementById('camera').classList.remove('pressed'),160)}
function helpToggle(force){const o=document.getElementById('help');o.classList.toggle('visible',typeof force==='boolean'?force:!o.classList.contains('visible'))}
document.getElementById('camera').addEventListener('click',toggleCamera);
document.getElementById('helpBtn').addEventListener('click',()=>helpToggle(true));document.getElementById('helpClose').addEventListener('click',()=>helpToggle(false));
for(let id of ['left','right','boost']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(e.isTrusted){try{b.setPointerCapture(e.pointerId)}catch(_){}}input[id]=true;b.classList.add('pressed')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{input[id]=false;b.classList.remove('pressed')})}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','shift','tab','c','v','a','d','escape'].includes(k))e.preventDefault();if(e.repeat&&(k==='c'||k==='v'||k==='tab'))return;
 if(k==='arrowleft'||k==='a')input.left=true;if(k==='arrowright'||k==='d')input.right=true;if(k==='arrowup'||k==='shift'||k===' ')input.boost=true;
 if(k==='c'||k==='v'||k==='tab')toggleCamera();if(k==='escape')helpToggle(false) });
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')input.left=false;if(k==='arrowright'||k==='d')input.right=false;if(k==='arrowup'||k==='shift'||k===' ')input.boost=false});
window.addEventListener('blur',()=>{input.left=input.right=input.boost=false});
// Automated evaluation probes: no debug control hooks or gameplay mutation.
window.pixelShiftDiagnostics=()=>({frames:frame,fps,mix:Number(cam.mix.toFixed(4)),target:cam.target,pitch:Number(cam.pitch.toFixed(3)),camera:{x:Number(cam.x.toFixed(1)),y:Number(cam.y.toFixed(1)),z:Number(cam.z.toFixed(1)),focal:Number(cam.focal.toFixed(1))},car:{z:Math.round(car.z),lane:Math.round(car.lane),speed:Math.round(car.speed),yawDegrees:Math.round(car.turnYaw*180/PI),rollDegrees:Math.round(car.tilt*180/PI),lateralSpeed:Math.round(car.sideV)},gatesPassed,gateMissed,collisionCount,drawCalls,viewport:[W,H],render:'single-3d-camera-volumetric-mesh-arcade-drift-v03',spriteLayers:stacks.car.length,meshFaces:Object.fromEntries(Object.entries(volumes).map(([n,mesh])=>[n,mesh.length]))});
requestAnimationFrame(tick);
})();
</script></body></html>
