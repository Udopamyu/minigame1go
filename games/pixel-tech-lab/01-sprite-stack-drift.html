<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07171b"><title>Sprite Stack Drift | Pixel Tech Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07171b;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#control{position:fixed;inset:0;pointer-events:none;user-select:none}#control button{pointer-events:auto;position:absolute;bottom:max(24px,env(safe-area-inset-bottom));width:72px;height:72px;border-radius:18px;border:2px solid #a5fff25c;background:#0a1d2bc2;color:#bdfff4;display:grid;place-items:center;backdrop-filter:blur(6px);touch-action:none;box-shadow:0 4px 0 #071217}#control button:active,#control button.on{background:#166776b9;transform:translateY(3px);box-shadow:none}#left{left:22px}#right{left:104px}#boost{right:24px;border-color:#f1ae7b88!important;background:#553b3bb8!important}button svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}@media(min-width:950px){#control button{opacity:.23;transition:opacity .2s}#control:hover button{opacity:.9}}@media(max-width:420px){#control button{width:60px;height:60px;bottom:max(20px,env(safe-area-inset-bottom))}#left{left:12px}#right{left:80px}#boost{right:12px}}</style></head><body><canvas id="game" aria-label="積層ドット絵の車で光るゲートを集めるドライブゲーム"></canvas><div id="control"><button id="left" aria-label="左に曲がる"><svg viewBox="0 0 32 32"><path d="M21 5 L10 16 L21 27"/></svg></button><button id="right" aria-label="右に曲がる"><svg viewBox="0 0 32 32"><path d="M11 5 L22 16 L11 27"/></svg></button><button id="boost" aria-label="加速"><svg viewBox="0 0 32 32"><path d="M17 2 L8 18 L16 17 L13 30 L25 12 L17 14 Z"/></svg></button></div><script>
(()=>{'use strict';const el=document.getElementById('game'),ctx=el.getContext('2d',{alpha:false});let W=480,H=270,sx=1;let now=0,last=0,frame=0,glow=0,all=0;let particles=[],skids=[],orbState=[];const PI=Math.PI,TAU=PI*2,R=(a,b,t)=>a+(b-a)*t,rand=(min,max)=>min+Math.random()*(max-min);const color={ground:'#092022',grass:'#0e302d',side:'#163839',road:'#24343c',line:'#fbdab0',neon:'#56f1e7',pink:'#ff98b1'};
function resize(){const dpr=Math.min(1.25,devicePixelRatio||1);W=Math.min(560,Math.max(310,Math.round(innerWidth*dpr*.68)));H=Math.max(220,Math.round(W*innerHeight/innerWidth));el.width=W;el.height=H;ctx.imageSmoothingEnabled=false;sx=W/480;}window.addEventListener('resize',resize);resize();
const route=[];const cps=[[-260,-450],[200,-460],[540,-230],[620,130],[420,420],[50,500],[-400,390],[-620,110],[-500,-200]];function sample(t){let len=cps.length,i=Math.floor(t)%len,f=t-i,p0=cps[(i-1+len)%len],p1=cps[i],p2=cps[(i+1)%len],p3=cps[(i+2)%len];function v(j){return .5*((2*p1[j])+(-p0[j]+p2[j])*f+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*f*f+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*f*f*f)}return{x:v(0),y:v(1)}}for(let i=0;i<270;i++)route.push(sample(i*cps.length/270));
const orbs=Array.from({length:9},(_,i)=>({x:sample(i*cps.length/9+.56).x,y:sample(i*cps.length/9+.56).y,got:false}));let origin=sample(.12),forward=sample(.18),car={x:origin.x,y:origin.y,a:Math.atan2(forward.x-origin.x,-(forward.y-origin.y)),v:170,drift:0};let cam={x:car.x,y:car.y};const keys={left:false,right:false,boost:false};
for(let id of ['left','right','boost']){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[id]=true;b.classList.add('on')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{keys[id]=false;b.classList.remove('on')})}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space','a','d','w','A','D','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w'||e.code==='Space')keys.boost=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false;if(e.key==='ArrowUp'||e.key.toLowerCase()==='w'||e.code==='Space')keys.boost=false});window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
// Each slice is an independent, hand-coded voxel-art horizontal cross-section.
function layer(type,z){const c=document.createElement('canvas');c.width=35;c.height=49;const g=c.getContext('2d');g.imageSmoothingEnabled=false;const q=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w|0,h|0)};
if(type==='car'){
if(z<=2){q(11,5,14,39,'#06141d');q(7,10,5,9,'#041019');q(23,10,5,9,'#041019');q(7,31,5,9,'#041019');q(23,31,5,9,'#041019');q(13,4,10,7,'#b4f8eb');q(13,41,10,3,'#ff998b')}
if(z>=2&&z<=8){let inset=z>6?1:0;q(8+inset,10+inset,19-inset*2,29-inset*2,z%2?'#166e81':'#258ea0');q(9+inset,9+inset,17-inset*2,4,'#5ce6de');q(9+inset,34-inset,17-inset*2,4,'#124c64');q(10,12,3,4,'#b1fff2');q(23,12,3,4,'#b1fff2')}
if(z>=9&&z<=13){q(10,19,15,16,z>11?'#b6f1de':'#368d9b');q(11,18,13,4,'#a7fff5');q(12,27,11,5,'#104052');q(13,20,9,6,z>11?'#79bed0':'#1c476a')}
if(z===14){q(12,20,11,11,'#dbfff0');q(13,21,9,8,'#6dced0')}
}else if(type==='tree'){
if(z<=8){q(15,15,5,6,'#432e3e');q(15,15,5,7,z%2?'#77515c':'#594350')}
if(z>=5){const r=z>=15?Math.max(2,17-(z-14)*2):Math.min(17,(z-3)*2);q(17-r,17-r,2*r,2*r,z%3===0?'#379d88':z%3===1?'#226a67':'#5fd0aa');q(14,8+(z%4)*3,4,4,'#bdf9ae');q(24,16,3,3,'#94ead2')}
}else if(type==='pylon'){
let radius=z>12?4:z>8?7:11;q(17-radius,17-radius,radius*2,radius*2,z%3===0?'#e6a87c':'#a45d70');q(16-radius,16-radius,radius*2-2,3,'#ffdab0');if(z>12)q(14,14,6,6,'#fff4c8')
}return c}
const stacks={car:Array.from({length:15},(_,i)=>layer('car',i)),tree:Array.from({length:19},(_,i)=>layer('tree',i)),pylon:Array.from({length:16},(_,i)=>layer('pylon',i))};
function stack(type,x,y,ang,scale=1,wind=0){let a=stacks[type],base= type==='car'?1.23: type==='tree'?1.04:0.91;ctx.save();for(let i=0;i<a.length;i++){ctx.save();ctx.translate(x,y-i*base*scale);ctx.rotate(ang+wind*(i/a.length));ctx.scale(scale,scale*.76);ctx.drawImage(a[i],-17.5,-24.5);ctx.restore()}ctx.restore()}
const deco=[];for(let i=0;i<165;i++){let t=rand(0,cps.length),p=sample(t),n=sample(t+.01),dx=n.x-p.x,dy=n.y-p.y,dist=Math.hypot(dx,dy),sign=i%2?1:-1;deco.push({x:p.x+(dy/dist)*(180+rand(0,340))*sign,y:p.y-(dx/dist)*(180+rand(0,340))*sign,type:i%7?'tree':'pylon',scale:rand(.72,1.4),tilt:rand(-.13,.13)})}
function world(x,y){return[(x-cam.x)*sx+W*.5,(y-cam.y)*sx+H*.5]};function near(x,y,margin=55){let [a,b]=world(x,y);return a>-margin&&a<W+margin&&b>-margin&&b<H+margin};
function tracePath(){ctx.beginPath();route.forEach((p,i)=>{let [x,y]=world(p.x,p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath()}
function star(x,y,r,t,col){ctx.save();ctx.translate(x,y);ctx.rotate(t);ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<8;i++){let a=i*PI/4,r0=i%2?r*.45:r;ctx.lineTo(Math.sin(a)*r0,-Math.cos(a)*r0)}ctx.closePath();ctx.fill();ctx.restore()}
function update(dt){now+=dt;let steering=(+keys.right)-(+keys.left),vTarget=keys.boost?295:185;car.v=R(car.v,vTarget,Math.min(1,dt*(keys.boost?1.4:.65)));car.drift=R(car.drift,steering,.08);car.a+=steering*(1.6+car.v/550)*dt;car.x+=Math.sin(car.a)*car.v*dt;car.y-=Math.cos(car.a)*car.v*dt;
cam.x=R(cam.x,car.x+Math.sin(car.a)*55,Math.min(1,dt*3));cam.y=R(cam.y,car.y-Math.cos(car.a)*55,Math.min(1,dt*3));if(frame%3===0){let a=car.a,ax=Math.cos(a),ay=Math.sin(a);for(let sign of [-1,1])skids.push({x:car.x+ax*11*sign-Math.sin(a)*16,y:car.y+ay*11*sign+Math.cos(a)*16,life:.8});if(keys.boost)particles.push({x:car.x+rand(-10,10),y:car.y+rand(8,19),vx:rand(-30,30),vy:rand(10,40),life:.65,size:rand(2,5),color:'#f8b57b'})}for(let s of skids)s.life-=dt;skids=skids.filter(s=>s.life>0).slice(-200);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0).slice(-300);
for(let o of orbs)if(!o.got&&Math.hypot(o.x-car.x,o.y-car.y)<53){o.got=true;glow=1;all++;for(let i=0;i<40;i++)particles.push({x:o.x,y:o.y,vx:rand(-90,90),vy:rand(-90,90),life:rand(.4,1),size:rand(2,7),color:i%3?'#6ff5df':'#fff1b5'})}glow=Math.max(0,glow-dt*1.7);if(orbs.every(o=>o.got)){for(let o of orbs)o.got=false;all=0;glow=1.2}
frame++}
function draw(){ctx.fillStyle=color.ground;ctx.fillRect(0,0,W,H);let tile=48*sx,dx=(-cam.x*sx)%tile,dy=(-cam.y*sx)%tile;for(let y=dy-tile;y<H+tile;y+=tile)for(let x=dx-tile;x<W+tile;x+=tile){ctx.fillStyle=(Math.floor((x-dx)/tile)+Math.floor((y-dy)/tile))%2?'#0b2427':'#0b292a';ctx.fillRect(x,y,tile+1,tile+1);ctx.fillStyle='#26534b';ctx.fillRect(x+9,y+9,2,2);ctx.fillRect(x+tile*.7,y+tile*.6,2,2)}
ctx.save();ctx.lineJoin='round';ctx.lineCap='round';tracePath();ctx.lineWidth=191*sx;ctx.strokeStyle='#092224';ctx.stroke();tracePath();ctx.lineWidth=167*sx;ctx.strokeStyle='#5ca88f';ctx.stroke();tracePath();ctx.lineWidth=157*sx;ctx.strokeStyle='#172c35';ctx.stroke();tracePath();ctx.lineWidth=147*sx;ctx.strokeStyle=color.road;ctx.stroke();tracePath();ctx.setLineDash([24*sx,29*sx]);ctx.lineWidth=3*sx;ctx.strokeStyle='#8397a077';ctx.stroke();ctx.setLineDash([]);ctx.restore();
ctx.save();for(let d of deco)if(near(d.x,d.y,50)){let [x,y]=world(d.x,d.y);ctx.fillStyle='#03171ca0';ctx.beginPath();ctx.ellipse(x+4,y+9,22*d.scale*sx,8*d.scale*sx,0,0,TAU);ctx.fill();stack(d.type,x,y,0, d.scale*sx,d.tilt)}ctx.restore();
for(let skid of skids)if(near(skid.x,skid.y)){let [x,y]=world(skid.x,skid.y);ctx.fillStyle=`rgba(7,20,23,${skid.life*.42})`;ctx.fillRect(x-2*sx,y-2*sx,4*sx,4*sx)}
for(let i=0;i<orbs.length;i++){const o=orbs[i];if(o.got||!near(o.x,o.y,100))continue;let [x,y]=world(o.x,o.y),r=(14+Math.sin(now*3+i)*3)*sx;ctx.globalAlpha=.2;ctx.fillStyle='#72fff4';ctx.beginPath();ctx.arc(x,y,r*2.2,0,TAU);ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#9cffdf';ctx.lineWidth=2*sx;ctx.beginPath();ctx.ellipse(x,y,r*1.1,r*.4,0,0,TAU);ctx.stroke();star(x,y-11*sx,r*.73,now*1.8,'#fff6ce');star(x,y-11*sx,r*.42,-now*1.2,'#70ffed')}
for(let p of particles)if(near(p.x,p.y)){let [x,y]=world(p.x,p.y);ctx.globalAlpha=Math.min(1,p.life*1.4);ctx.fillStyle=p.color;ctx.fillRect(x,y,p.size*sx,p.size*sx)}ctx.globalAlpha=1;
let [cx,cy]=world(car.x,car.y);ctx.fillStyle='#020b13a8';ctx.beginPath();ctx.ellipse(cx+4*sx,cy+7*sx,19*sx,10*sx,0,0,TAU);ctx.fill();stack('car',cx,cy,car.a,1.5*sx);if(keys.boost){ctx.fillStyle='#f8bc7b';ctx.fillRect(cx-Math.sin(car.a)*18*sx-5*sx,cy+Math.cos(car.a)*17*sx,10*sx,5*sx)}
// The HUD deliberately uses geometry only.
const rr=Math.min(W*.05,19*sx);for(let i=0;i<orbs.length;i++){const x=W/2+(i-(orbs.length-1)/2)*20*sx,y=18*sx;ctx.fillStyle=orbs[i].got?'#98ffe3':'#315058';ctx.strokeStyle='#b6e3d3';ctx.lineWidth=1.3*sx;ctx.beginPath();ctx.arc(x,y,rr*.36,0,TAU);ctx.fill();ctx.stroke()}
ctx.globalAlpha=.5;ctx.strokeStyle='#9affed';ctx.lineWidth=1.7*sx;ctx.beginPath();ctx.arc(W-25*sx,26*sx,12*sx,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(W-25*sx,26*sx,12*sx,-PI/2,-PI/2+TAU*Math.min(1,car.v/295));ctx.stroke();ctx.globalAlpha=1;
if(glow){ctx.fillStyle=`rgba(193,255,233,${glow*.13})`;ctx.fillRect(0,0,W,H)}
const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0614186b');grad.addColorStop(.25,'transparent');grad.addColorStop(.8,'transparent');grad.addColorStop(1,'#0614189c');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H)}
function loop(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);window.pixelTechDiagnostics=()=>({frame,car:{x:car.x,y:car.y,heading:car.a,speed:car.v},collected:all,scene:'sprite-stack',objects:stacks.car.length,viewport:[W,H]});})();
</script></body></html>
