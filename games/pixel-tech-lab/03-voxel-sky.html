  for(let p of sparks){g.globalAlpha=clamp(p.life,0,1);g.fillStyle=impact?'#ffb6a8':'#fff1af';g.fillRect(px+p.x,py+p.y,2+Math.abs(p.life*3),2+Math.abs(p.life*3))}g.globalAlpha=1;
}
function drawSpeedLines(px,py){
  if(boostStrength<.03)return;

  const shift=t*(.48+boostStrength*1.8);

    let a=i*2.3999632,frac=(i*.6180339887+shift) % 1;
    let radius=Math.pow(frac,1.3)*Math.max(W,H)*.74;

}
function drawHUD(){

  for(let i=0;i<rings.length;i++){g.fillStyle=i<ring?'#fbf0b4':'#264d65';let x=W*.5+(i-3.5)*17,y=17;g.beginPath();g.arc(x,y,3.8,0,TAU);g.fill();g.strokeStyle='#e5efe3';g.lineWidth=.8;g.stroke()}
  let vx=W-19,gy=H*.28,gh=Math.min(67,H*.23);g.globalAlpha=.78;g.fillStyle='#133e59';g.fillRect(vx-5,gy-3,10,gh+6);g.strokeStyle='#d8f5dc';g.strokeRect(vx-5,gy-3,10,gh+6);let fill=clamp((plane.h-44)/426,0,1);g.fillStyle='#ffe7b6';g.fillRect(vx-3,gy+gh*(1-fill),6,Math.max(2,gh*fill));g.globalAlpha=1;
  let n=16,cur=clamp((plane.speed-90)/360,0,1);for(let i=0;i<n;i++){
    let w=5,x=W*.5+(i-n/2)*(w+3)+2,y=H-13;
    g.fillStyle=i/n<cur?(i>n*.62?'#ffd29c':'#abfce7'):'#245567';g.fillRect(x,y-((i%4===0)?3:0),w,5)}
  // Switch icon halo conveys active viewpoint without labels.
  const cx=W-46,cy=41;g.strokeStyle='#e9ffda99';g.lineWidth=2;g.beginPath();g.arc(cx,cy,25,0,TAU*viewMix);g.stroke();
  if(finish){g.fillStyle=`rgba(255,245,203,${Math.min(.24,finish*.22)})`;g.fillRect(0,0,W,H)}
  if(impact){g.fillStyle=`rgba(243,112,92,${impact*.24})`;g.fillRect(0,0,W,H)}
}
function draw(){
  if(viewMix<.997){g=topG;g.setTransform(1,0,0,1,0,0);drawOverhead()}
  if(viewMix>.003){g=chaseG;g.setTransform(1,0,0,1,0,0);drawChase()}
  g=mainG;g.setTransform(1,0,0,1,0,0);
  if(viewMix<=.003)g.drawImage(overhead,0,0);
  else if(viewMix>=.997){
    g.save();let angle=-roll*.16*boostStrength;g.translate(W*.5,H*.5);g.rotate(angle);let z=1+.018*boostStrength;g.scale(z,z);g.drawImage(chase,-W*.5,-H*.5);g.restore();

}
function tick(ms){let dt=Math.min(.045,(ms-last)/1000||.016);last=ms;update(dt);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.pixelTechDiagnostics=()=>({frame:frames,scene:'voxel-space-cinematic',heightmap:MAP*MAP,ring,camera:{mix:viewMix,target:viewTarget,mode:viewMix<.15?'overhead':viewMix>.85?'chase':'transition'},boost:boostStrength,plane:{x:plane.x,z:plane.z,altitude:plane.h,heading:plane.yaw,speed:plane.speed},viewport:[W,H]});})();
