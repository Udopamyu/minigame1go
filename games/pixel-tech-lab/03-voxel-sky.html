<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#2d6477"><title>Voxel Sky | Pixel Tech Lab</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#5d8d9d;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}#controls{pointer-events:none;position:fixed;inset:0}#controls button{pointer-events:auto;position:absolute;bottom:max(23px,env(safe-area-inset-bottom));height:65px;width:65px;display:grid;place-items:center;border:2px solid #f5fff1a0;border-radius:17px;color:#fffce2;background:#234d6eb1;touch-action:none;box-shadow:0 4px 0 #173e55}#controls button.on,#controls button:active{background:#448a93c7;transform:translateY(3px);box-shadow:none}#turnL{left:20px}#turnR{left:96px}#climb{right:96px}#dive{right:20px}button svg{height:31px;width:31px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(max-width:430px){#controls button{height:54px;width:54px;bottom:max(15px,env(safe-area-inset-bottom))}#turnL{left:10px}#turnR{left:72px}#climb{right:72px}#dive{right:10px}}@media(min-width:1000px){#controls button{opacity:.25}#controls:hover button{opacity:.9}}</style></head><body><canvas id="game" aria-label="ポリゴンを使わず高さマップを描く擬似3Dの飛行機ゲーム。光るリングをくぐる"></canvas><div id="controls"><button id="turnL" aria-label="左旋回"><svg viewBox="0 0 32 32"><path d="M22 5 L10 16 L22 27"/></svg></button><button id="turnR" aria-label="右旋回"><svg viewBox="0 0 32 32"><path d="M10 5 L22 16 L10 27"/></svg></button><button id="climb" aria-label="上昇"><svg viewBox="0 0 32 32"><path d="M6 22 L16 10 L26 22"/></svg></button><button id="dive" aria-label="下降"><svg viewBox="0 0 32 32"><path d="M6 10 L16 22 L26 10"/></svg></button></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});const TAU=Math.PI*2,PI=Math.PI;let W=480,H=270,t=0,last=0,frames=0;const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a);function resize(){W=Math.min(560,Math.max(320,Math.round(innerWidth*.68)));H=Math.max(230,Math.round(W*innerHeight/innerWidth));c.width=W;c.height=H;g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
const MAP=512,WORLD=4096,TILE=WORLD/MAP;const hm=new Float32Array(MAP*MAP);const centers=[[680,780,650,237],[1600,1390,560,250],[2590,2200,655,240],[3300,2800,550,290],[800,3010,580,190],[3410,690,470,252],[2150,550,370,165]];
function noise(x,z){return (Math.sin(x*.011)*Math.cos(z*.014)+Math.sin(x*.038+z*.019)*.35+Math.cos(z*.044-x*.031)*.16)*.5}
for(let z=0;z<MAP;z++)for(let x=0;x<MAP;x++){let wx=x*TILE,wz=z*TILE,h=0;for(let [cx,cz,rad,peak] of centers){let dx=wx-cx,dz=wz-cz,dist=(dx*dx+dz*dz)/(rad*rad);if(dist<1){let a=Math.max(0,1-dist);h+=peak*a*a*(.91+noise(wx,wz)*.15)}}hm[z*MAP+x]=Math.max(0,h-1.3)}
function height(x,z){x=(x+WORLD)%WORLD;z=(z+WORLD)%WORLD;const ix=Math.floor(x/TILE)&511,iz=Math.floor(z/TILE)&511;return hm[iz*MAP+ix]}
const keys={turnL:false,turnR:false,climb:false,dive:false};for(let k in keys){const e=document.getElementById(k);e.addEventListener('pointerdown',a=>{a.preventDefault();e.setPointerCapture(a.pointerId);keys[k]=true;e.classList.add('on')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])e.addEventListener(ev,()=>{keys[k]=false;e.classList.remove('on')})}const bind={ArrowLeft:'turnL',a:'turnL',ArrowRight:'turnR',d:'turnR',ArrowUp:'climb',w:'climb',ArrowDown:'dive',s:'dive'};document.addEventListener('keydown',e=>{let k=bind[e.key]||bind[e.key.toLowerCase()];if(k){e.preventDefault();keys[k]=true}});document.addEventListener('keyup',e=>{let k=bind[e.key]||bind[e.key.toLowerCase()];if(k)keys[k]=false});addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));
const route=[[950,750,210],[860,1100,235],[960,1410,215],[1170,1720,190],[1410,1970,215],[1750,2200,255],[2080,2340,220],[2450,2550,275]];let rings=route.map((v,i)=>({x:v[0],z:v[1],h:v[2],i}));let ring=0,finish=0,impact=0,roll=0,trail=[],sparks=[];let plane={x:950,z:450,h:210,yaw:0,speed:134};
const slices=[];for(let z=0;z<11;z++){let b=document.createElement('canvas');b.width=63;b.height=51;const a=b.getContext('2d');a.imageSmoothingEnabled=false;function rect(x,y,w,h,col){a.fillStyle=col;a.fillRect(x,y,w,h)}
if(z<=1){rect(27,4,11,41,'#1b3650');rect(3,20,57,10,'#1a3550');rect(16,34,31,9,'#1a3550');rect(6,19,11,3,'#fabe94');rect(46,19,11,3,'#fabe94')}
if(z>=1&&z<=6){let s=z>4?z-4:0;rect(8+s,20,47-s*2,10,z%2?'#f5debb':'#dfc29f');rect(21,15,21,23,z%2?'#ec856e':'#b95860');rect(27,4,10,40,'#f2d9b5');rect(9,21,10,3,'#d37778');rect(45,21,9,3,'#d37778');rect(17,35,28,4,'#e9c4a2')}
if(z>=7){rect(27,10,10,29,'#f4d9b8');rect(25,19,14,9,'#d76872');rect(29,15,7,12,z>8?'#9bdfda':'#345d77');rect(27,28,10,5,'#fff0c7')}
if(z===10){rect(29,15,6,11,'#bcfff5')}slices.push(b)}
function planeStack(x,y,bank=0){g.save();g.translate(x,y);g.rotate(bank);for(let i=0;i<slices.length;i++){g.drawImage(slices[i],-31.5,-20.5-i*1.2)}g.restore()}
const cloudShapes=Array.from({length:26},(_,i)=>({x:i*87+Math.random()*66,y:20+Math.random()*38,z:.1+Math.random()*.8,size:rand(8,36)}));
function terrainColor(h,d,tx,tz){let pal;if(h<3)pal=['#1d6f8a','#2787a0','#459cb0','#6aafbf'];else if(h<13)pal=['#c8bd83','#d5c693','#e4d6a9','#f2e0b5'];else if(h<79)pal=['#305f60','#427864','#69a078','#a5be8b'];else if(h<158)pal=['#446b66','#688277','#9caa8c','#b5b49b'];else if(h<215)pal=['#5c6673','#84929a','#b3b3b4','#c6c3b9'];else pal=['#8d9d9e','#b4c8c6','#d4e2dc','#eef5e5'];let ix=d>1100?3:d>700?2:d>370?1:0;if((Math.floor(tx*.047)+Math.floor(tz*.041))%13===0&&h>12&&h<120)ix=Math.min(3,ix+1);return pal[ix]}
function drawSky(horizon){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#1d4d70');sky.addColorStop(.37,'#5e91a0');sky.addColorStop(.62,'#c9beb0');sky.addColorStop(1,'#a2babc');g.fillStyle=sky;g.fillRect(0,0,W,H);let sunX=W*(.77-.14*Math.sin(plane.yaw*.7)),sunY=horizon*.55;g.fillStyle='#e7c3a79c';g.fillRect(sunX-27,sunY-27,54,54);g.fillStyle='#ffe3b7';g.fillRect(sunX-17,sunY-17,34,34);g.fillStyle='#fff0d1';g.fillRect(sunX-8,sunY-8,16,16);for(let cloud of cloudShapes){let x=(cloud.x-t*cloud.z*5+(plane.yaw*.1)*W)%(W+130);if(x<0)x+=W+130;let y=cloud.y*H/270+Math.sin(t*.1+cloud.x)*2,gx=cloud.size/36;g.fillStyle='#c5e1d699';g.fillRect(x,y,cloud.size*1.7,cloud.size*.28);g.fillRect(x+cloud.size*.25,y-cloud.size*.14,cloud.size*.8,cloud.size*.31);g.fillStyle='#fff2de7d';g.fillRect(x+cloud.size*.34,y-cloud.size*.27,cloud.size*.54,cloud.size*.14)}}
function drawTerrain(){let f=W*.73,horizon=H*.46,camH=plane.h+38,camX=plane.x-Math.sin(plane.yaw)*67,camZ=plane.z-Math.cos(plane.yaw)*67;drawSky(horizon);
// Front-to-back heightmap column-casting (Voxel Space). No meshes, polygons or 3D engine.
for(let sx=0;sx<W;sx+=2){let ray=(sx-W*.5)/f,dX=Math.sin(plane.yaw)+Math.cos(plane.yaw)*ray,dZ=Math.cos(plane.yaw)-Math.sin(plane.yaw)*ray,len=1/Math.hypot(dX,dZ);dX*=len;dZ*=len;let lastY=H;for(let distance=10;distance<1650;distance+=4.2+distance*.018){let tx=camX+dX*distance,tz=camZ+dZ*distance,h=height(tx,tz);let yy=Math.round(horizon+(camH-h)*f/distance);if(yy<lastY){let top=clamp(yy,-H,H),bottom=clamp(lastY,0,H);if(top<bottom){g.fillStyle=terrainColor(h,distance,tx,tz);g.fillRect(sx,top,2,bottom-top)}lastY=yy;if(lastY<=0)break}}}
const mist=g.createLinearGradient(0,horizon-10,0,horizon+35);mist.addColorStop(0,'#cae8e625');mist.addColorStop(.5,'#a1c8c22a');mist.addColorStop(1,'transparent');g.fillStyle=mist;g.fillRect(0,horizon-10,W,45);return{f,horizon,camH,camX,camZ}}
function project(wx,wy,wz,view){let dx=wx-view.camX,dz=wz-view.camZ,cx=dx*Math.cos(plane.yaw)-dz*Math.sin(plane.yaw),depth=dx*Math.sin(plane.yaw)+dz*Math.cos(plane.yaw);if(depth<=6)return null;return{x:W*.5+cx*view.f/depth,y:view.horizon+(view.camH-wy)*view.f/depth,depth,scale:view.f/depth}}
function drawRing(view,data,alpha=1){let p=project(data.x,data.h,data.z,view);if(!p||p.depth>1650)return;let radius=clamp(39*p.scale,4,280);if(p.x<-radius||p.x>W+radius||p.y<-radius||p.y>H+radius)return;g.save();g.globalAlpha=alpha;g.lineWidth=clamp(3*p.scale,1.3,10);g.strokeStyle='#2a6781';g.beginPath();g.arc(p.x,p.y,radius+2,0,TAU);g.stroke();g.strokeStyle='#fff2b3';g.beginPath();g.arc(p.x,p.y,radius,0,TAU);g.stroke();g.strokeStyle='#76ffe3';g.lineWidth=clamp(1.4*p.scale,1,5);g.setLineDash([clamp(9*p.scale,3,80),clamp(8*p.scale,3,70)]);g.lineDashOffset=-t*16;g.beginPath();g.arc(p.x,p.y,radius,0,TAU);g.stroke();g.setLineDash([]);g.fillStyle='#f8eab5';for(let a=0;a<TAU;a+=PI/2){let u=p.x+Math.cos(a+t*.5)*radius,v=p.y+Math.sin(a+t*.5)*radius;g.fillRect(u-2*p.scale,v-2*p.scale,4*p.scale,4*p.scale)}g.restore()}
function targetIndicator(view){let a=rings[ring];if(!a)return;let p=project(a.x,a.h,a.z,view);if(p&&p.x>20&&p.x<W-20&&p.y>15&&p.y<H-20)return;let dx=a.x-plane.x,dz=a.z-plane.z,theta=Math.atan2(dx,dz)-plane.yaw,x=W*.5+Math.sin(theta)*Math.min(W*.39,130),y=H*.15+Math.abs(theta)*9;g.save();g.translate(x,y);g.rotate(theta);g.fillStyle='#fff3b1';g.beginPath();g.moveTo(0,-9);g.lineTo(6,5);g.lineTo(0,1);g.lineTo(-6,5);g.closePath();g.fill();g.restore()}
function update(dt){t+=dt;let yawInput=(+keys.turnR)-(+keys.turnL),climb=(+keys.climb)-(+keys.dive);plane.yaw+=yawInput*.9*dt;roll=lerp(roll,yawInput*.42,clamp(dt*3.5,0,1));plane.h=clamp(plane.h+climb*95*dt,52,430);plane.speed=lerp(plane.speed,climb?120:137,Math.min(1,dt*1.2));plane.x=(plane.x+Math.sin(plane.yaw)*plane.speed*dt+WORLD)%WORLD;plane.z=(plane.z+Math.cos(plane.yaw)*plane.speed*dt+WORLD)%WORLD;
const h=height(plane.x,plane.z);if(plane.h<h+18){impact=1;plane.h=h+63;for(let i=0;i<35;i++)sparks.push({x:rand(-25,25),y:rand(-15,15),vx:rand(-90,90),vy:rand(-90,90),life:rand(.4,1)})}impact=Math.max(0,impact-dt*1.5);let a=rings[ring];if(a&&Math.hypot(a.x-plane.x,a.z-plane.z)<51&&Math.abs(a.h-plane.h)<65){ring++;finish=.85;for(let i=0;i<70;i++)sparks.push({x:rand(-23,23),y:rand(-40,40),vx:rand(-150,150),vy:rand(-150,150),life:rand(.6,1.2)});if(ring===rings.length){ring=0;finish=1.6;plane.x=950;plane.z=450;plane.h=210;plane.yaw=0}}
for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0).slice(-180);finish=Math.max(0,finish-dt);frames++}
function draw(){let view=drawTerrain();if(rings[ring+1])drawRing(view,rings[ring+1],.28);if(rings[ring])drawRing(view,rings[ring]);targetIndicator(view);
// Cockpit-free tracked sprite stack: the plane is drawn from horizontal slices.
let px=W*.5,py=H*.79+Math.sin(t*5)*1.4,scale=Math.max(1.1,Math.min(2.05,W/290));g.save();g.translate(px,py);g.scale(scale,scale);g.fillStyle='#133d5377';g.beginPath();g.ellipse(2,9,40,7,0,0,TAU);g.fill();planeStack(0,0,roll);g.restore();
for(let p of sparks){g.globalAlpha=clamp(p.life,0,1);g.fillStyle=impact?'#ffb6a8':'#fff1af';g.fillRect(px+p.x,py+p.y,2+Math.abs(p.life*3),2+Math.abs(p.life*3))}g.globalAlpha=1;
// Ring progress and altitude are drawn as symbols, no text labels.
for(let i=0;i<rings.length;i++){g.fillStyle=i<ring?'#fbf0b4':'#264d65';let x=W*.5+(i-3.5)*18,y=17;g.beginPath();g.arc(x,y,4,0,TAU);g.fill();g.strokeStyle='#e5efe3';g.lineWidth=.8;g.stroke()}
let vx=W-22,gy=H*.28,gh=Math.min(67,H*.23);g.globalAlpha=.67;g.fillStyle='#13475d';g.fillRect(vx-5,gy-3,10,gh+6);g.strokeStyle='#d8f5dc';g.strokeRect(vx-5,gy-3,10,gh+6);let fill=clamp((plane.h-52)/378,0,1);g.fillStyle='#ffe7b6';g.fillRect(vx-3,gy+gh*(1-fill),6,Math.max(2,gh*fill));g.globalAlpha=1;
let cx=W*.5,cy=H*.46;g.strokeStyle='#c9f2e399';g.lineWidth=1;g.beginPath();g.moveTo(cx-16,cy);g.lineTo(cx-6,cy);g.moveTo(cx+6,cy);g.lineTo(cx+16,cy);g.moveTo(cx,cy-10);g.lineTo(cx,cy-4);g.stroke();
if(finish){g.fillStyle=`rgba(255,245,203,${Math.min(.24,finish*.22)})`;g.fillRect(0,0,W,H)}if(impact){g.fillStyle=`rgba(243,112,92,${impact*.24})`;g.fillRect(0,0,W,H)}}
function tick(ms){let dt=Math.min(.045,(ms-last)/1000||.016);last=ms;update(dt);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.pixelTechDiagnostics=()=>({frame:frames,scene:'voxel-space',heightmap:MAP*MAP,ring,plane:{x:plane.x,z:plane.z,altitude:plane.h,heading:plane.yaw},viewport:[W,H]});})();
</script></body></html>
