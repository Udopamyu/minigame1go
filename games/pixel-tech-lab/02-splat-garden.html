<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#100f2b"><title>Splat Garden | Pixel Tech Lab</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#100e22;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair}#rotate{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:22px;display:flex;gap:10px}#rotate button{width:53px;height:53px;border-radius:50%;background:#131438ac;border:1px solid #cbafe766;color:#d4bee8;display:grid;place-items:center;touch-action:none}#rotate button:active{background:#6a3d88aa}#rotate svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.8;fill:none;stroke-linejoin:round;stroke-linecap:round}@media(min-width:950px){#rotate{opacity:.35}#rotate:hover{opacity:1}}</style></head><body><canvas id="game" aria-label="粒子で描かれた幻想の浮遊庭園。光の精霊を操作して6つの花を灯す"></canvas><div id="rotate"><button id="ccw" aria-label="カメラを左回転"><svg viewBox="0 0 28 28"><path d="M9 7 L3 13 L9 19"/><path d="M4 13 C4 3 25 3 25 15 C25 24 17 27 12 23"/></svg></button><button id="cw" aria-label="カメラを右回転"><svg viewBox="0 0 28 28"><path d="M19 7 L25 13 L19 19"/><path d="M24 13 C24 3 3 3 3 15 C3 24 11 27 16 23"/></svg></button></div><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d',{alpha:false});const TAU=Math.PI*2,PI=Math.PI;const rand=(a,b)=>a+Math.random()*(b-a),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),lerp=(a,b,t)=>a+(b-a)*t;let W=480,H=300,now=0,last=0,frames=0;function resize(){W=Math.max(310,Math.min(560,Math.round(innerWidth*.73)));H=Math.max(210,Math.round(W*innerHeight/innerWidth));c.width=W;c.height=H;g.imageSmoothingEnabled=false}window.addEventListener('resize',resize);resize();
let seed=917;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const rr=(a,b)=>a+(b-a)*rnd();let motes=[[-165,-90],[0,-176],[145,-90],[145,100],[5,158],[-150,100]].map(([x,z],i)=>({x,z,lit:false,i}));const clouds=[];const sparks=[];const stars=Array.from({length:130},()=>({x:rnd(),y:rnd()*.76,s:rr(.3,1.6),phase:rr(0,TAU)}));
function height(x,z){let r=Math.sqrt((x/250)**2+(z/233)**2);return Math.max(4,26+9*Math.sin(x/52)*Math.cos(z/43)+7*Math.sin((x+z)/63)-Math.pow(r,3)*20)}
function add(x,y,z,ci,size,seedIndex=-1,kind=0){clouds.push({x,y,z,ci,size,seedIndex,kind,screenX:0,screenY:0,depth:0,scale:1})}
// Floating land is rendered as thousands of depth-tested pixel splats, not polygons or meshes.
for(let i=0;i<1750;i++){let a=rr(0,TAU),rad=Math.sqrt(rnd())*236,x=Math.cos(a)*rad,z=Math.sin(a)*rad*.94,h=height(x,z);add(x,h+rr(-2,2),z,rr(0,1)<.13?1:0,rr(1,2.7),-1,0)}
for(let i=0;i<800;i++){let a=rr(0,TAU),rad=Math.sqrt(rnd())*236,x=Math.cos(a)*rad,z=Math.sin(a)*rad*.94,h=height(x,z),d=rr(7,85)*Math.sqrt(1-rad/265);add(x*(1-d*.001),h-d,z*(1-d*.001),2,rr(1.2,3.1),-1,1)}
const treePos=[[-130,-115],[55,-137],[166,-80],[168,92],[-4,125],[-142,100],[-23,3],[77,34],[-82,-14]];
treePos.forEach(([tx,tz],j)=>{let ty=height(tx,tz);const nearMote=j<6?j:-1;for(let i=0;i<55;i++){let a=rr(0,TAU),r=rr(0,8),y=rr(0,52);add(tx+Math.cos(a)*r,ty+y,tz+Math.sin(a)*r,3,rr(1,3.5),nearMote,2)}
for(let blob=0;blob<4;blob++){const bx=tx+rr(-23,23),bz=tz+rr(-22,22),by=ty+rr(62,96);for(let i=0;i<175;i++){let u=rr(-1,1),v=rr(0,TAU),rad=Math.cbrt(rnd());let ex=Math.sqrt(1-u*u)*Math.cos(v)*rad,ez=Math.sqrt(1-u*u)*Math.sin(v)*rad,ey=u*rad;let x=bx+ex*34,z=bz+ez*31,y=by+ey*26;if(Math.hypot(x,z)<260)add(x,y,z,4+j%4,rr(1.3,3.6),nearMote,3)}}});
// Ruins and luminous floating stones, also point-built.
for(let k=0;k<8;k++){let a=k/8*TAU,tx=Math.cos(a)*91,tz=Math.sin(a)*86,ty=height(tx,tz);for(let i=0;i<75;i++){let x=tx+rr(-12,12),z=tz+rr(-12,12),y=ty+rr(1,26);add(x,y,z,12,rr(1.3,3.5),-1,4)}}
for(let k=0;k<300;k++){let a=rr(0,TAU),rad=rr(65,350);add(Math.cos(a)*rad,rr(-85,152),Math.sin(a)*rad,13,rr(.8,2.2),-1,5)}
const user={x:0,z:0,y:height(0,0)+13,vx:0,vz:0};let look={x:0,z:0},yaw=.55,elev=.49,dist=750,flash=0,completion=0;
const keys={up:false,down:false,left:false,right:false,ccw:false,cw:false};const keyMap={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',q:'ccw',e:'cw'};document.addEventListener('keydown',e=>{let k=keyMap[e.key]||keyMap[e.key.toLowerCase()];if(k){e.preventDefault();keys[k]=true}});document.addEventListener('keyup',e=>{let k=keyMap[e.key]||keyMap[e.key.toLowerCase()];if(k)keys[k]=false});window.addEventListener('blur',()=>{Object.keys(keys).forEach(k=>keys[k]=false);joy.on=false});for(let id of ['ccw','cw']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[id]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[id]=false)}
const joy={on:false,id:-1,x:0,y:0,dx:0,dy:0};c.addEventListener('pointerdown',e=>{if(joy.on)return;e.preventDefault();c.setPointerCapture(e.pointerId);joy.on=true;joy.id=e.pointerId;joy.x=e.clientX;joy.y=e.clientY;joy.dx=0;joy.dy=0});c.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;joy.dx=clamp((e.clientX-joy.x)/65,-1,1);joy.dy=clamp((e.clientY-joy.y)/65,-1,1)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,e=>{if(e.pointerId===joy.id)joy.on=false});
const palette=['#284a50','#5f9b7e','#3c2e50','#9f7492','#ad638c','#c67e94','#9d87b9','#81c6bc','#dd95b8','#f1c5ad','#a8ccca','#edb8ce','#a0a2ad','#b8d3e7'];
function project(wx,wy,wz){let se=Math.sin(elev),ce=Math.cos(elev),sy=Math.sin(yaw),cy=Math.cos(yaw),camX=look.x+sy*dist*ce,camZ=look.z+cy*dist*ce,camY=90+dist*se,rx=wx-camX,ry=wy-camY,rz=wz-camZ;let depth=-(sy*ce*rx+se*ry+cy*ce*rz),right=cy*rx-sy*rz,up=-sy*se*rx+ce*ry-cy*se*rz;let portraitZoom=H/W>1.45?Math.min(1.9,1+(H/W-1.45)*1.15):1;let scale=Math.min(W/520,H/310)*portraitZoom*810/Math.max(100,depth);return{x:W*.5+right*scale,y:H*.54-up*scale,scale,depth}}
function burst(x,y,z,col,count=38){for(let i=0;i<count;i++){const a=rand(0,TAU),vy=rand(-4,100),v=rand(13,88);sparks.push({x,y,z,vx:Math.cos(a)*v,vy,vz:Math.sin(a)*v,life:rand(.6,1.6),max:1.6,color:col,size:rand(1,4)})}}
function update(dt){now+=dt;let rot=(+keys.cw)-(+keys.ccw);yaw+=rot*dt*1.1;let mx=(+keys.right)-(+keys.left)+joy.dx,my=(+keys.down)-(+keys.up)+joy.dy,mag=Math.hypot(mx,my);if(mag>1){mx/=mag;my/=mag}let sy=Math.sin(yaw),cy=Math.cos(yaw);let vx=mx*cy-my*sy,vz=-mx*sy-my*cy;user.vx=lerp(user.vx,vx*95,Math.min(1,dt*5.2));user.vz=lerp(user.vz,vz*95,Math.min(1,dt*5.2));user.x+=user.vx*dt;user.z+=user.vz*dt;let bound=Math.sqrt((user.x/209)**2+(user.z/194)**2);if(bound>1){user.x/=bound;user.z/=bound;user.vx=0;user.vz=0}user.y=lerp(user.y,height(user.x,user.z)+17+Math.sin(now*4)*4,dt*3.8);look.x=lerp(look.x,user.x*.45,dt*1.9);look.z=lerp(look.z,user.z*.45,dt*1.9);
for(let m of motes){if(!m.lit&&Math.hypot(m.x-user.x,m.z-user.z)<29){m.lit=true;flash=.8;burst(m.x,height(m.x,m.z)+24,m.z,'#a8fff1',65)}}if(motes.every(m=>m.lit)&&completion===0){completion=3;burst(0,80,0,'#ffeebc',160)}if(completion>0){completion-=dt;if(completion<=0){for(let m of motes)m.lit=false;completion=0}}
for(let s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vy-=48*dt;s.life-=dt}for(let i=sparks.length-1;i>=0;i--)if(sparks[i].life<=0)sparks.splice(i,1);flash=Math.max(0,flash-dt);frames++}
function draw(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0e1028');bg.addColorStop(.56,'#25203a');bg.addColorStop(1,'#4a324d');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let s of stars){g.globalAlpha=.16+.6*Math.max(0,Math.sin(now*.9+s.phase));g.fillStyle='#dec9f5';g.fillRect(s.x*W,s.y*H,s.s,s.s)}g.globalAlpha=1;
// Every splat is independently projected from 3D coordinates, with depth-based pixel size.
const ordered=[];for(let p of clouds){const pp=project(p.x,p.y,p.z);if(pp.depth<120||pp.depth>1650||pp.x<-20||pp.x>W+20||pp.y<-20||pp.y>H+20)continue;p.screenX=pp.x;p.screenY=pp.y;p.depth=pp.depth;p.scale=pp.scale;ordered.push(p)}ordered.sort((a,b)=>b.depth-a.depth);
for(let p of ordered){let lit=p.seedIndex>=0&&motes[p.seedIndex].lit;let cc=palette[p.ci];if(p.kind===3){cc=lit?(p.ci%2?'#8ff9c9':'#ffd5b9'):(p.ci%2?'#5d738e':'#76516f')}else if(p.kind===2)cc=lit?'#cbab9f':'#775e73';else if(p.kind===0&&Math.sin(now*1.2+p.x*.04)>.94)cc='#75ad9b';else if(p.kind===5){g.globalAlpha=.25+.2*Math.sin(now*2+p.x);cc='#9a8db0'}let size=clamp(Math.ceil(p.size*p.scale*.67),1,7);g.fillStyle=cc;g.fillRect(p.screenX-size*.5,p.screenY-size*.5,size,size);if(p.kind===3&&(lit||p.size>3.1)&&((p.x+p.z)|0)%9===0){g.globalAlpha=.21;g.fillRect(p.screenX-size,p.screenY-size,size*2,size*2)}g.globalAlpha=1}
for(let m of motes){let py=height(m.x,m.z)+45+Math.sin(now*3+m.i)*11,p=project(m.x,py,m.z);if(p.depth<150)continue;let rr=clamp(11*p.scale,5,25);if(m.lit){g.globalAlpha=.3;g.fillStyle='#a7fff2';g.beginPath();g.arc(p.x,p.y,rr*1.45,0,TAU);g.fill();g.globalAlpha=1;g.fillStyle='#d9ffdd';g.fillRect(p.x-rr*.23,p.y-rr*.23,rr*.46,rr*.46)}else {g.globalAlpha=.12+.04*Math.sin(now*4);g.fillStyle='#bff5ff';g.beginPath();g.arc(p.x,p.y,rr*2,0,TAU);g.fill();g.globalAlpha=1;g.strokeStyle='#a9f3f1';g.lineWidth=Math.max(1,p.scale*2);g.beginPath();g.arc(p.x,p.y,rr,0,TAU);g.stroke();g.save();g.translate(p.x,p.y);g.rotate(now);g.fillStyle='#fff2d1';for(let i=0;i<4;i++){g.rotate(PI/2);g.fillRect(-rr*.2,-rr*.85,rr*.4,rr*.8)}g.restore()}}
for(let s of sparks){const p=project(s.x,s.y,s.z);if(p.depth<100)continue;g.globalAlpha=clamp(s.life,0,1);g.fillStyle=s.color;let size=clamp(s.size*p.scale,1,9);g.fillRect(p.x,p.y,size,size)}g.globalAlpha=1;
// The controlled firefly is intentionally drawn as a simple 2D billboard.
const actor=project(user.x,user.y,user.z);let a=clamp(13*actor.scale,8,21),wobble=Math.sin(now*13)*a*.45;g.globalAlpha=.12;g.fillStyle='#8ffff5';g.beginPath();g.arc(actor.x,actor.y,a*2.9,0,TAU);g.fill();g.globalAlpha=1;g.fillStyle='#c4faf4';g.fillRect(actor.x-a*1.1,actor.y-a*.3+wobble*.2,a*.9,a*.5);g.fillRect(actor.x+a*.2,actor.y-a*.3-wobble*.2,a*.9,a*.5);g.fillStyle='#fff9db';g.fillRect(actor.x-a*.28,actor.y-a*.52,a*.56,a*.95);g.fillStyle='#5df3e2';g.fillRect(actor.x-a*.18,actor.y-a*.42,a*.36,a*.6);
// Single unobtrusive progress constellation: no labels and no digits.
for(let i=0;i<motes.length;i++){let x=W/2+(i-2.5)*17,y=17;g.fillStyle=motes[i].lit?'#befff0':'#465064';g.beginPath();g.moveTo(x,y-5);g.lineTo(x+4,y);g.lineTo(x,y+5);g.lineTo(x-4,y);g.closePath();g.fill()}
if(joy.on){let jx=joy.x*W/innerWidth,jy=joy.y*H/innerHeight;g.globalAlpha=.38;g.strokeStyle='#cefef2';g.lineWidth=2;g.beginPath();g.arc(jx,jy,25,0,TAU);g.stroke();g.fillStyle='#d6fffb';g.beginPath();g.arc(jx+joy.dx*22,jy+joy.dy*22,7,0,TAU);g.fill();g.globalAlpha=1}if(flash){g.fillStyle=`rgba(218,255,232,${flash*.14})`;g.fillRect(0,0,W,H)}const v=g.createLinearGradient(0,0,0,H);v.addColorStop(0,'#04031133');v.addColorStop(.25,'transparent');v.addColorStop(.8,'transparent');v.addColorStop(1,'#10081b75');g.fillStyle=v;g.fillRect(0,0,W,H)}
function tick(t){const dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);window.pixelTechDiagnostics=()=>({frame:frames,scene:'pixel-splats',points:clouds.length,lit:motes.filter(m=>m.lit).length,player:[user.x,user.z],viewport:[W,H]});})();
</script></body></html>
