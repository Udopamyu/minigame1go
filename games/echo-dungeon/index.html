<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101522"><title>10秒分身ダンジョン</title>
<style>
:root{color-scheme:dark;--bg:#101522;--edge:#384358;--gold:#f4c879;--mint:#85eac7;--white:#e5ebf2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif;touch-action:none}
#app{height:100dvh;min-height:340px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at 50% 47%,#253044 0,#121927 57%,#0a0f19 100%)}
#shell{width:min(100vw,1100px);max-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#hud{width:min(100%,920px);height:42px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 4px}
#chapters,#echoes{display:flex;align-items:center;gap:7px}
.pip{width:10px;height:10px;border-radius:2px;transform:rotate(45deg);border:1px solid #526075;background:#1b2839;box-shadow:0 1px 5px #0006}
.pip.done{background:#81dfbf;border-color:#bffde5}.pip.active{background:#f2c97c;border-color:#fff0bd;box-shadow:0 0 12px #f0be69aa}
#clock{width:46px;height:46px;flex:0 0 46px;filter:drop-shadow(0 0 7px #f7d19044)}
#echoes{flex:1;justify-content:flex-end;margin-right:14px}.echo-pip{height:12px;width:12px;clip-path:polygon(50% 0,92% 25%,92% 75%,50% 100%,8% 75%,8% 25%);background:#46546a}.echo-pip.filled{background:#77c9ed;filter:drop-shadow(0 0 3px #61d8ff)}
#board{width:min(100%,920px);aspect-ratio:15/11;max-height:calc(100dvh - 175px);object-fit:contain;image-rendering:pixelated;display:block;border:2px solid #3b4960;border-radius:4px;box-shadow:0 14px 50px #000a, inset 0 0 18px #0008;background:#141d2e}
#controls{width:min(100%,920px);height:80px;display:flex;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none}
.controls-side{display:flex;align-items:center;gap:10px}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,36px);gap:3px}.pad .north{grid-column:2;grid-row:1}.pad .west{grid-column:1;grid-row:2}.pad .south{grid-column:2;grid-row:2}.pad .east{grid-column:3;grid-row:2}
button{color:#d9e9f1;border:1px solid #617084;background:linear-gradient(160deg,#26374d,#19283a);box-shadow:0 4px 0 #0a1321,0 5px 10px #0008;border-radius:9px;height:38px;width:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,button.pressed{transform:translateY(3px);box-shadow:0 1px 0 #0a1321;background:#35506b}button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
button:focus-visible{outline:2px solid #f3ce80;outline-offset:3px}.action{width:56px;height:56px;border-radius:50%;border-color:#9d7850;color:#f6cf94;background:linear-gradient(160deg,#715137,#372a2a)}.action svg{width:28px;height:28px}.rewind{color:#83d9fb;border-color:#477b93}.undo{color:#e1bcef}
#mini{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:5px}#mini button{width:27px;height:27px;background:#1f3041b8;border-color:#526274;color:#9fb2c7;box-shadow:none}#mini svg{width:18px;height:18px}
#overlay{position:absolute;inset:0;background:#0c1422ed;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;z-index:5}#overlay[hidden]{display:none}#overlay h2{margin:0;color:var(--gold);font-size:clamp(18px,4vw,25px)}#overlay p{margin:0;max-width:470px;font-size:14px;line-height:1.9;color:#c2cbd7}#overlay .help-actions{display:flex;gap:12px}#overlay .help-actions button{width:58px;height:46px}#overlay .help-actions button svg{width:27px;height:27px}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;background:#d2f6ff}
@media (max-width:650px){#shell{padding:6px 7px calc(6px + env(safe-area-inset-bottom));gap:5px}#hud{height:37px}#clock{width:39px;height:39px;flex-basis:39px}#board{max-height:calc(100dvh - 155px)}#controls{height:70px}.pad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,31px);gap:2px}.pad button{width:40px;height:31px}.controls-side{gap:7px}.controls-side>button{width:38px;height:36px}.controls-side>button.action{width:51px;height:51px}.controls-side button svg{width:20px;height:20px}}
@media (orientation:landscape) and (max-height:550px){#shell{width:100%;height:100%;flex-direction:row;padding:5px;gap:7px}#hud{position:absolute;top:6px;left:12px;width:calc(100% - 24px);height:32px;pointer-events:none}#board{height:calc(100dvh - 12px);width:auto;max-height:none;max-width:calc(100vw - 252px)}#controls{width:225px;min-width:205px;height:100%;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:48px 0 9px}.controls-side{justify-content:space-around}#mini{top:7px;right:7px;bottom:auto;left:auto;transform:none}#hud #chapters{margin-left:12px}#hud #echoes{margin-right:234px}}
</style>
</head>
<body>
<div id="app"><div id="shell">
<div id="hud" aria-label="進行状況"><div id="chapters" aria-label="ステージ進行"></div><div id="echoes" aria-label="分身の数"></div><svg id="clock" viewBox="0 0 48 48" role="img" aria-label="残り時間"><circle cx="24" cy="24" r="18" stroke="#344355" stroke-width="5" fill="none"/><circle id="clockArc" cx="24" cy="24" r="18" stroke="#f0c47c" stroke-width="5" stroke-linecap="round" fill="none" transform="rotate(-90 24 24)" stroke-dasharray="113.1" stroke-dashoffset="0"/><circle cx="24" cy="24" r="4" fill="#ecd9aa"/></svg></div>
<canvas id="board" width="750" height="550" aria-label="10秒分身ダンジョンのゲーム盤。方向操作、攻撃、巻き戻しで分身を作って進めます。"></canvas>
<div id="controls">
<div class="controls-side"><div class="pad"><button class="north" data-key="up" aria-label="上に移動"><svg viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></svg></button><button class="west" data-key="left" aria-label="左に移動"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button><button class="south" data-key="down" aria-label="下に移動"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></button><button class="east" data-key="right" aria-label="右に移動"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button></div></div>
<div class="controls-side"><button class="undo" id="undo" aria-label="最後の分身を消す"><svg viewBox="0 0 24 24"><path d="M9 5 4 10l5 5M5 10h9a5 5 0 0 1 0 10"/></svg></button><button class="rewind" id="rewind" aria-label="10秒巻き戻して分身を作る"><svg viewBox="0 0 24 24"><path d="M6 8H2V4M2 8a10 10 0 1 1 1 9"/><path d="m13 7-4 5 4 5"/></svg></button><button class="action" id="strike" data-key="attack" aria-label="剣で攻撃"><svg viewBox="0 0 24 24"><path d="M15 3 21 3 21 9 10 20 5 15 16 4M7 13l5 5M3 21l5-5"/></svg></button></div>
</div><div id="mini"><button id="help" aria-label="遊び方を見る"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9a2.3 2.3 0 1 1 4 2c-1 1-2 1-2 3M12 17v.4"/></svg></button><button id="restart" aria-label="部屋を最初からやり直す"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 4v7h7"/></svg></button></div>
<div id="flash"></div>
<div id="overlay" hidden><h2 id="overlayTitle"></h2><p id="overlayText"></p><div class="help-actions"><button id="closeOverlay" aria-label="ゲームに戻る"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></button></div></div>
</div></div>
<script>
(()=>{'use strict';
const W=15,H=11,T=50,STEP=1/30,MAX=3,LOOP=10,board=document.getElementById('board'),c=board.getContext('2d'),arc=document.getElementById('clockArc');c.imageSmoothingEnabled=false;
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},held=new Set(),codeMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'attack',KeyJ:'attack',KeyK:'attack'};
const center=(x,y)=>({x:x+.5,y:y+.5});
const L=[
 {spawn:[2,5],exit:[12,5],walls:[[7,1,1,4],[7,6,1,4]],plates:[[4,3,'sun']],gates:[[7,5,'sun']],foes:[]},
 {spawn:[2,5],exit:[12,5],walls:[[7,1,1,4],[7,6,1,4]],plates:[[3,3,'sun'],[4,7,'moon']],gates:[[7,5,'both']],foes:[]},
 {spawn:[2,8],exit:[12,3],walls:[[5,2,1,5],[9,1,1,3],[9,5,1,4]],plates:[[3,7,'sun']],gates:[[9,4,'sun']],foes:[{type:'watcher',x:7,y:3,patrol:[[7,3],[8,3],[8,6],[6,6]]}]},
 {spawn:[3,5],exit:[12,5],walls:[[6,2,1,2],[6,7,1,2],[10,2,1,2],[10,7,1,2]],plates:[],gates:[],foes:[{type:'shield',x:8,y:5}]},
 {spawn:[2,7],exit:[12,3],walls:[[6,2,1,3],[6,7,1,2],[10,5,1,4]],plates:[[3,3,'sun']],gates:[[11,3,'sun']],foes:[{type:'shield',x:8,y:3},{type:'watcher',x:9,y:7,patrol:[[9,7],[11,8],[11,5]]}]},
 {spawn:[2,5],exit:[12,5],walls:[[6,2,1,2],[6,7,1,2],[10,2,1,2],[10,7,1,2]],plates:[[4,3,'spike']],gates:[],spikes:[[8,5]],foes:[{type:'charger',x:11,y:5}]},
 {spawn:[3,8],exit:[12,2],walls:[[5,2,1,4],[9,5,1,4]],plates:[[3,3,'spike']],gates:[[10,2,'clear']],spikes:[[7,5]],foes:[{type:'charger',x:11,y:5},{type:'shield',x:8,y:3}]}];
let level=Number(localStorage.getItem('echoDungeonGithubV1')||0);if(!Number.isInteger(level)||level<0||level>=L.length)level=0;
let echoes=[],room,player,ghosts=[],enemies=[],records=[],elapsed=0,acc=0,last=0,freeze=0,transit=0,shake=0,particles=[],paused=false,cleared=false,loopCount=0,activeTime=0;
let audio;
function tone(freq=480,len=.07,type='square',gain=.045){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+len);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+len)}catch{}}
function rnd(n){return Math.sin(n*127.1+level*19.2)*43758.5453%1}
function wallsFor(v){const a=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>+(x===0||y===0||x===W-1||y===H-1)));for(const [x,y,w,h] of v.walls||[])for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)a[j][i]=1;return a}
function actor(x,y,kind,frames=null){return {...center(x,y),kind,alive:true,hp:kind==='player'?3:2,face:[1,0],swing:0,attackCooldown:0,frames,frameIdx:0,finished:false,invuln:0,glow:0}}
function initRoom(){room=L[level];echoes=[];loopCount=0;resetLoop();drawHUD()}
function resetLoop(){room=L[level];room.map=wallsFor(room);player=actor(...room.spawn,'player');ghosts=echoes.map(e=>actor(...room.spawn,'echo',e));enemies=(room.foes||[]).map((f,i)=>({...center(f.x,f.y),type:f.type,hp:f.type==='shield'?3:f.type==='charger'?3:2,alive:true,face:[-1,0],state:'idle',timer:0,cd:.6+i*.18,patrol:f.patrol||[],patrolIndex:0,chargeDx:0,chargeDy:0,glow:0,stun:0}));records=[];elapsed=0;acc=0;activeTime=0;particles=[];shake=0;freeze=.12;cleared=false;transit=0;held.clear();document.querySelectorAll('[data-key]').forEach(b=>b.classList.remove('pressed'));drawHUD()}
function drawHUD(){const root=document.getElementById('chapters');root.replaceChildren(...L.map((_,i)=>{let e=document.createElement('i');e.className='pip'+(i<level?' done':i===level?' active':'');return e}));const echoUI=document.getElementById('echoes');echoUI.replaceChildren(...Array.from({length:MAX},(_,i)=>{const e=document.createElement('i');e.className='echo-pip'+(i<echoes.length?' filled':'');return e}));}
function tickClock(){arc.style.strokeDashoffset=(113.1*(1-elapsed/LOOP)).toFixed(2);arc.style.stroke=elapsed>8.4?'#f18f82':'#f0c47c'}
function rewind(){if(paused||cleared)return;if(records.length>=1){const frames=records.map(a=>({x:a.x,y:a.y,face:a.face.slice(),attack:a.attack}));if(echoes.length>=MAX)echoes.shift();echoes.push(frames);tone(640,.07);setTimeout(()=>tone(400,.12),55);loopCount++;}resetLoop()}
function undo(){if(paused)return;if(echoes.length){echoes.pop();tone(310,.08);resetLoop()}}
function endDeath(){shake=8;tone(165,.17,'sawtooth');setTimeout(()=>tone(100,.2,'sawtooth'),110);resetLoop()}
function keyFrame(){const up=held.has('up'),down=held.has('down'),left=held.has('left'),right=held.has('right');let dx=(right?1:0)-(left?1:0),dy=(down?1:0)-(up?1:0);if(dx&&dy){dx*=.70710678;dy*=.70710678}return{dx,dy,attack:held.has('attack')}}
function blocked(x,y,r=.27){if(x<1+r||y<1+r||x>W-1-r||y>H-1-r)return true;for(let j=Math.floor(y-r);j<=Math.floor(y+r);j++)for(let i=Math.floor(x-r);i<=Math.floor(x+r);i++){if(room.map[j]?.[i]||gateAt(i,j)&&!gateOpen(gateAt(i,j)[2])){const cx=Math.max(i,x-r),cy=Math.max(j,y-r);if(cx<x+r&&cy<y+r)return true}}return false}
function move(o,dx,dy,speed,dt){if(!o.alive)return;const sx=o.x,sy=o.y,xx=sx+dx*speed*dt,yy=sy+dy*speed*dt;if(!blocked(xx,sy))o.x=xx;if(!blocked(o.x,yy))o.y=yy}
function gateAt(x,y){return room.gates?.find(v=>v[0]===x&&v[1]===y)}
function occupied(x,y){return [player,...ghosts].some(a=>a.alive&&Math.hypot(a.x-(x+.5),a.y-(y+.5))<.52)}
function plateOn(color){return (room.plates||[]).some(([x,y,key])=>key===color&&occupied(x,y))}
function gateOpen(color){return color==='clear'?enemies.every(e=>!e.alive):color==='both'?plateOn('sun')&&plateOn('moon'):plateOn(color)}
function rayClear(a,b){const d=Math.hypot(a.x-b.x,a.y-b.y);for(let t=.2;t<d;t+=.18){const x=a.x+(b.x-a.x)*t/d,y=a.y+(b.y-a.y)*t/d;if(room.map[Math.floor(y)]?.[Math.floor(x)]||gateAt(Math.floor(x),Math.floor(y))&&!gateOpen(gateAt(Math.floor(x),Math.floor(y))[2]))return false}return true}
function burst(x,y,color,n=9){for(let i=0;i<n;i++){const a=i*2.4+(Math.random()-.5),s=.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.18+Math.random()*.4,col:color})}if(particles.length>130)particles.splice(0,particles.length-130)}
function strike(a){if(!a.alive||a.attackCooldown>0)return;a.attackCooldown=.49;a.swing=.20;tone(a.kind==='player'?410:500,.048,'triangle',.028);burst(a.x+a.face[0]*.8,a.y+a.face[1]*.8,a.kind==='player'?'#ffe5a1':'#91e8fc',4);for(const e of enemies){if(!e.alive)continue;const vx=e.x-a.x,vy=e.y-a.y,d=Math.hypot(vx,vy);if(d>1.46||d<.01||!rayClear(a,e))continue;const dot=(vx*a.face[0]+vy*a.face[1])/d;if(dot<.38)continue;let block=false;if(e.type==='shield'){const incomingX=a.x-e.x,incomingY=a.y-e.y;block=(incomingX*e.face[0]+incomingY*e.face[1])/d>.1}if(block){e.glow=.22;tone(210,.06,'square',.022);burst(e.x,e.y,'#c7dcff',5);continue}e.hp-=1;e.glow=.2;shake=2;burst(e.x,e.y,'#f2ab7b',9);tone(142,.09,'sawtooth',.026);if(e.hp<=0)kill(e)}}
function kill(e){if(!e.alive)return;e.alive=false;burst(e.x,e.y,'#f4ca76',23);shake=5;tone(90,.3,'sawtooth',.035)}
function takeHit(a){if(!a.alive||a.invuln>0)return;a.hp--;a.invuln=.6;shake=6;burst(a.x,a.y,a.kind==='player'?'#fad18a':'#7fcfff',12);tone(100,.14,'sawtooth');if(a.hp<=0){a.alive=false;if(a.kind==='player'){setTimeout(()=>{if(!cleared)endDeath()},140)}}}
function closestTarget(e){let arr=[player,...ghosts].filter(a=>a.alive&&Math.hypot(a.x-e.x,a.y-e.y)<8.5&&rayClear(e,a));arr.sort((a,b)=>Math.hypot(a.x-e.x,a.y-e.y)-Math.hypot(b.x-e.x,b.y-e.y));return arr[0]||null}
function enemyTick(e,dt){if(!e.alive)return;if(room.spikes?.some(([x,y])=>plateOn('spike')&&Math.hypot(e.x-(x+.5),e.y-(y+.5))<.55)){kill(e);return}e.glow=Math.max(0,e.glow-dt);e.cd=Math.max(0,e.cd-dt);if(e.state==='windup'){e.timer-=dt;if(e.timer<=0){if(e.type==='charger'){e.state='charge';e.timer=.75;tone(175,.1,'sawtooth')}else{e.state='recover';e.timer=.60;for(let a of [player,...ghosts]){if(!a.alive)continue;const dx=a.x-e.x,dy=a.y-e.y,d=Math.hypot(dx,dy);if(d<1.28&&(dx*e.face[0]+dy*e.face[1])/Math.max(.01,d)>.42)takeHit(a)}burst(e.x+e.face[0],e.y+e.face[1],'#ff816e',8)}}return}
 if(e.state==='charge'){e.timer-=dt;const nx=e.x+e.chargeDx*7*dt,ny=e.y+e.chargeDy*7*dt;if(blocked(nx,ny,.35)){e.state='recover';e.timer=.75;burst(e.x,e.y,'#eab18c',12)}else{e.x=nx;e.y=ny}for(const a of [player,...ghosts])if(a.alive&&Math.hypot(a.x-e.x,a.y-e.y)<.65)takeHit(a);if(room.spikes?.some(([x,y])=>plateOn('spike')&&Math.hypot(e.x-(x+.5),e.y-(y+.5))<.67)){kill(e)}if(e.timer<=0){e.state='recover';e.timer=.7}return}
 if(e.state==='recover'){e.timer-=dt;if(e.timer<=0){e.state='idle';e.cd=.35}return}
 const target=closestTarget(e);if(target){const dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy),nx=dx/Math.max(.01,d),ny=dy/Math.max(.01,d);if(d>.02)e.face=[nx,ny];const strikeDist=e.type==='charger'?6:1.25;if(d<strikeDist&&e.cd<=0){e.state='windup';e.timer=e.type==='charger'?.68:.52;e.chargeDx=nx;e.chargeDy=ny;e.cd=2; tone(e.type==='charger'?220:320,.08,'square',.012)}else if(d>(e.type==='charger'?2.7:1)){move(e,nx,ny,e.type==='charger'?1.3:1.18,dt)}}else if(e.patrol.length){const [x,y]=e.patrol[e.patrolIndex],p=center(x,y),dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<.22)e.patrolIndex=(e.patrolIndex+1)%e.patrol.length;else{e.face=[dx/d,dy/d];move(e,dx/d,dy/d,.65,dt)}}}
function actorTick(a,input,dt){if(!a.alive)return;a.invuln=Math.max(0,a.invuln-dt);a.glow=Math.max(0,a.glow-dt);a.attackCooldown=Math.max(0,a.attackCooldown-dt);a.swing=Math.max(0,a.swing-dt);let {dx,dy,attack}=input;if(dx||dy){a.face=[dx,dy];move(a,dx,dy,3.15,dt)}if(attack)strike(a)}
function simulate(dt){if(paused||cleared)return;if(freeze>0){freeze-=dt;return}if(!player.alive)return;const input=keyFrame();actorTick(player,input,dt);records.push({x:player.x,y:player.y,face:player.face.slice(),attack:input.attack});for(const g of ghosts){if(!g.alive)continue;const f=g.frames[g.frameIdx];if(!f){g.finished=true;continue}const prev=g.frameIdx>0?g.frames[g.frameIdx-1]:{x:room.spawn[0]+.5,y:room.spawn[1]+.5};const dx=f.x-prev.x,dy=f.y-prev.y;let dest={dx:0,dy:0,attack:!!f.attack};if(Math.abs(dx)+Math.abs(dy)>.001){const norm=Math.hypot(dx,dy);dest.dx=dx/norm;dest.dy=dy/norm}g.face=f.face||g.face;g.x=f.x;g.y=f.y;g.attackCooldown=Math.max(0,g.attackCooldown-dt);g.swing=Math.max(0,g.swing-dt);g.invuln=Math.max(0,g.invuln-dt);if(dest.attack)strike(g);g.frameIdx++}
 for(const e of enemies)enemyTick(e,dt);if(plateOn('spike'))for(const a of [player,...ghosts])if(a.alive&&room.spikes?.some(([x,y])=>Math.hypot(a.x-(x+.5),a.y-(y+.5))<.55))takeHit(a);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt*25);elapsed+=dt;activeTime+=dt;tickClock();
 const [gx,gy]=room.exit;if(Math.hypot(player.x-(gx+.5),player.y-(gy+.5))<.65&&(!room.gates?.length||room.gates.every(g=>gateOpen(g[2])))&&enemies.every(e=>!e.alive)){cleared=true;transit=.85;burst(player.x,player.y,'#82ffca',32);tone(650,.13,'triangle');setTimeout(()=>tone(980,.21,'triangle'),130)}
 if(elapsed>=LOOP&&!cleared)rewind();}
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h))}
function tileShape(x,y){rect(x*T,y*T,T,T,(x+y)%2?'#202a3d':'#1c2839');rect(x*T+5,y*T+6,2,2,'#2b3a4f');rect(x*T+37,y*T+38,5,1,'#334054');if((x*17+y*13+level)%11===0)rect(x*T+24,y*T+17,6,2,'#2c3a4e')}
function drawFloor(){for(let y=0;y<H;y++)for(let x=0;x<W;x++){tileShape(x,y);if(room.map[y][x]){rect(x*T,y*T,T,T,'#263449');rect(x*T+3,y*T+4,T-6,T-9,'#48566e');rect(x*T+6,y*T+7,T-13,T-17,'#35445c');rect(x*T+8,y*T+31,28,5,'#222e43');rect(x*T,y*T,3,T,'#151e2d');rect(x*T+T-4,y*T,4,T,'#182438')}}}
function drawPortal(){const [x,y]=room.exit,cx=(x+.5)*T,cy=(y+.5)*T,open=enemies.every(e=>!e.alive)&&room.gates.every(g=>gateOpen(g[2]));c.save();c.translate(cx,cy);const w=17+Math.sin(performance.now()*.004)*2;rect(-19,-25,38,50,'#283343');rect(-16,-22,32,44,'#5d6982');rect(-13,-19,26,38,open?'#176f70':'#342e42');for(let i=0;i<4;i++){c.strokeStyle=open?'#a6ffe0':'#745b69';c.globalAlpha=.6-i*.1;c.lineWidth=2;c.beginPath();c.ellipse(0,0,w-i*3,24-i*4,0,0,Math.PI*2);c.stroke()}c.globalAlpha=1;rect(-3,-3,6,6,open?'#d2ffe7':'#6e5662');c.restore()}
function drawPlates(){for(const [x,y,key] of room.plates){const px=x*T,py=y*T,on=plateOn(key),sun=key==='sun',sp=key==='spike',col=sp?'#e5ab74':sun?'#e2c47e':'#b8a5e7';rect(px+5,py+6,40,38,'#152b35');rect(px+10,py+9,30,30,on?col:'#46516a');rect(px+14,py+13,22,22,'#203343');c.save();c.translate(px+25,py+24);c.strokeStyle=on?'#e9fff2':col;c.lineWidth=3;if(sp){c.beginPath();c.moveTo(-10,9);c.lineTo(0,-10);c.lineTo(10,9);c.closePath();c.stroke()}else if(sun){for(let i=0;i<4;i++){c.rotate(Math.PI/4);rect(-2,-13,4,6,col)}rect(-6,-6,12,12,on?'#f3ffe6':col)}else{c.beginPath();c.arc(-2,0,10,.7,5.6);c.stroke();rect(2,-7,5,4,col)}c.restore()}}
function drawGates(){for(const [x,y,key] of room.gates){if(gateOpen(key)){rect(x*T+12,y*T+5,4,40,'#3f7c77');rect(x*T+34,y*T+5,4,40,'#3f7c77');continue}const col=key==='sun'?'#e2c47e':key==='both'?'#bcade5':'#f2a674';rect(x*T+5,y*T,40,50,'#15232f');for(let i=0;i<4;i++)rect(x*T+10+i*9,y*T+5,4,40,col);rect(x*T+5,y*T+22,40,5,'#627185')}}
function drawSpikes(){for(const [x,y] of room.spikes||[]){const on=plateOn('spike'),px=x*T,py=y*T;rect(px+4,py+4,42,42,on?'#652c34':'#453b45');for(let i=0;i<3;i++)for(let j=0;j<3;j++){const sx=px+10+i*13,sy=py+11+j*13;c.fillStyle=on?'#ffc595':'#927c83';c.beginPath();c.moveTo(sx-5,sy+5);c.lineTo(sx,sy-(on?9:4));c.lineTo(sx+5,sy+5);c.fill()}}}
function drawShadow(x,y,w=17){c.globalAlpha=.26;c.fillStyle='#000';c.beginPath();c.ellipse(x,y+15,w,7,0,0,Math.PI*2);c.fill();c.globalAlpha=1}
function drawActor(a,i){if(!a.alive)return;const x=a.x*T,y=a.y*T;drawShadow(x,y);c.save();c.translate(Math.round(x),Math.round(y));if(a.kind==='echo')c.globalAlpha=.63;const col=a.kind==='player'?'#eac178':'#90dafa',edge=a.kind==='player'?'#6a4637':'#286278';if(a.invuln>0&&Math.floor(performance.now()/70)%2)c.globalAlpha*=.35;rect(-12,-14,24,27,edge);rect(-9,-18,18,28,col);rect(-7,-20,14,7,a.kind==='player'?'#fff0bd':'#d3f6ff');rect(-5,-9,10,9,'#1b3548');rect(-5,-7,3,3,'#fff4dc');rect(2,-7,3,3,'#fff4dc');rect(-11,12,7,6,'#30455b');rect(4,12,7,6,'#30455b');c.rotate(Math.atan2(a.face[1],a.face[0]));rect(7,-2,16,5,'#eaf2ef');rect(12,-3,12,1,'#7edbdf');rect(7,-4,4,9,'#ba8451');if(a.swing>0){c.strokeStyle=a.kind==='player'?'#fff5c1':'#a2efff';c.lineWidth=7;c.globalAlpha=.75;c.beginPath();c.arc(0,0,40,-.8,.8);c.stroke()}c.restore()}
function drawEnemy(e){if(!e.alive)return;const x=e.x*T,y=e.y*T;drawShadow(x,y,20);c.save();c.translate(Math.round(x),Math.round(y));const charger=e.type==='charger',shield=e.type==='shield',col=e.glow>0?'#f7e1bf':charger?'#b76a65':shield?'#8c9ea8':'#a1738b';rect(charger?-22:-15,-17,charger?44:30,34,'#302b3a');rect(charger?-18:-12,-21,charger?36:24,31,col);rect(-10,-12,20,11,'#352e40');rect(-8,-8,5,4,'#ff9f87');rect(3,-8,5,4,'#ff9f87');rect(-11,10,9,9,'#3b3945');rect(2,10,9,9,'#3b3945');c.rotate(Math.atan2(e.face[1],e.face[0]));if(shield){rect(16,-23,10,46,'#28394c');rect(20,-22,8,44,'#b7bdc6');rect(23,-9,5,19,'#dbe7e2')}else if(charger){rect(18,-15,19,9,'#d3b4a2');rect(18,6,19,9,'#d3b4a2')}else{rect(16,-3,12,6,'#9c566a')}c.restore();if(e.state==='windup'){const pulse=Math.sin(performance.now()*.025);c.strokeStyle='#ff8d75';c.lineWidth=3;c.setLineDash([7,6]);c.beginPath();c.moveTo(x,y);c.lineTo(x+e.chargeDx*(e.type==='charger'?300:75),y+e.chargeDy*(e.type==='charger'?300:75));c.stroke();c.setLineDash([]);rect(x-18,y-31,36*Math.max(0,1-e.timer/(e.type==='charger'?.68:.52)),4,'#ffa58d')}
 if(e.hp>0){for(let i=0;i<e.hp;i++)rect(x-e.hp*5+i*10,y-32,7,3,'#e8a396')}}
function drawEffects(dt){for(const p of particles)rect(p.x*T-2,p.y*T-2,4,4,p.col)}
function draw(){c.save();if(shake>0)c.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawFloor();drawPlates();drawSpikes();drawGates();drawPortal();for(let i=0;i<ghosts.length;i++)drawActor(ghosts[i],i);for(const e of enemies)drawEnemy(e);drawActor(player,-1);drawEffects();c.restore();if(cleared){rect(0,0,board.width,board.height,'#183c3b55');c.save();c.translate((room.exit[0]+.5)*T,(room.exit[1]+.5)*T);c.strokeStyle='#b5ffe1';c.lineWidth=6;c.beginPath();c.arc(0,0,33+Math.sin(performance.now()*.007)*8,0,7);c.stroke();c.restore()}}
function nextStage(){if(!cleared)return;if(level===L.length-1){localStorage.setItem('echoDungeonGithubV1','0');showOverlay('踏破','すべての部屋を突破しました。最初の部屋からもう一度挑戦できます。');level=0;initRoom()}else{level++;localStorage.setItem('echoDungeonGithubV1',String(level));initRoom();tone(760,.14,'triangle')}}
function animate(ms){const dt=Math.min(.1,(ms-last)/1000||0);last=ms;if(cleared){transit-=dt;if(transit<=0){transit=999;nextStage()}}else if(!paused){acc+=dt;let n=0;while(acc>=STEP&&n<5){simulate(STEP);acc-=STEP;n++}}draw();requestAnimationFrame(animate)}
function showOverlay(title,content){paused=true;const o=document.getElementById('overlay');document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayText').textContent=content;o.hidden=false;held.clear()}
function closeOverlay(){document.getElementById('overlay').hidden=true;paused=false;last=performance.now()}
window.addEventListener('keydown',e=>{const k=codeMap[e.code];if(k){e.preventDefault();held.add(k)}else if(e.code==='KeyR'||e.code==='Enter'){e.preventDefault();rewind()}else if(e.code==='KeyZ'||e.code==='Backspace'){e.preventDefault();undo()}else if(e.code==='Escape'){if(paused)closeOverlay();else showOverlay('遊び方','方向キー／WASDで移動、スペース／Jで攻撃、Rで巻き戻し、Zで最後の分身を取り消し。10秒分の行動が分身となって繰り返されます。敵を別の分身に向け、背後を攻撃。スイッチに乗っている間だけ罠が動きます。')}});window.addEventListener('keyup',e=>{const k=codeMap[e.code];if(k)held.delete(k)});window.addEventListener('blur',()=>held.clear());
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;const press=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);held.add(k);b.classList.add('pressed')};const lift=e=>{e.preventDefault();held.delete(k);b.classList.remove('pressed')};b.addEventListener('pointerdown',press);b.addEventListener('pointerup',lift);b.addEventListener('pointercancel',lift);b.addEventListener('lostpointercapture',lift)}
document.getElementById('rewind').addEventListener('click',rewind);document.getElementById('undo').addEventListener('click',undo);document.getElementById('restart').addEventListener('click',()=>{tone(250,.08);initRoom()});document.getElementById('help').addEventListener('click',()=>showOverlay('遊び方','10秒間の行動を記録して、分身を残します。分身は攻撃も再現します。敵の注意を分身に向け、その隙に背後へ回ってください。床の印に立つと、扉や棘の罠が反応します。PCでは矢印／WASDで移動、J／スペースで攻撃、Rで巻き戻し、Zで分身を消せます。'));document.getElementById('closeOverlay').addEventListener('click',closeOverlay);
// Read-only diagnostic surface for automated QA; not a cheat or gameplay control.
Object.defineProperty(window,'echoDiagnostics',{get:()=>Object.freeze({level,elapsed,echoes:echoes.length,ghosts:ghosts.map(g=>({x:g.x,y:g.y,alive:g.alive,swing:g.swing,frameIdx:g.frameIdx,frameCount:g.frames.length,first:g.frames[0],last:g.frames[g.frames.length-1]})),player:{x:player.x,y:player.y,hp:player.hp,alive:player.alive},enemies:enemies.map(e=>({x:e.x,y:e.y,hp:e.hp,alive:e.alive,state:e.state})),plates:(room.plates||[]).map(p=>({key:p[2],on:plateOn(p[2])})),gateOpen:room.gates.map(g=>gateOpen(g[2])),paused})});
initRoom();requestAnimationFrame(animate);
