<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19252b">
<title>PATROL × ROBO SALVAGE</title>
<style>:root{color-scheme:dark;--paper:#eceae0;--muted:#a2aaa5;--teal:#95d8c8;--amber:#efaa73;--dark:#141d21;--line:#52605e;--edge:max(18px,env(safe-area-inset-left));font:15px/1.48 "Barlow","Arial","Noto Sans CJK JP","Yu Gothic",sans-serif}
*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#1e3038;color:var(--paper)}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ffbb78;outline-offset:3px}
button:disabled{opacity:.47;cursor:default}#app{position:relative;isolation:isolate;touch-action:none;user-select:none}
#world,#software,#hud,#sky,#vignette{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:0}#world,#software{z-index:1}#hud{z-index:3;pointer-events:auto}#vignette{z-index:2;background:radial-gradient(ellipse at 52% 46%,transparent 54%,#171b2427)}
[hidden]{display:none!important}#toolbar{position:absolute;z-index:7;top:max(16px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right))}
button.icon{width:43px;height:43px;border:1px solid #d2dfd553;border-radius:7px;background:#19262bd1;display:grid;place-items:center;box-shadow:0 2px 8px #1113;touch-action:none}
.icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
#overlay{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(15px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom));background:#0c141ad1;touch-action:pan-y}
#overlay.show{display:flex}#dialog{width:min(710px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;padding:clamp(17px,3vw,34px);background:#172024;border:1px solid #465353;border-radius:6px;scrollbar-width:thin;box-shadow:0 15px 65px #0b121874}
#overlay:has(.titleDialog){justify-content:flex-start;padding:0;background:linear-gradient(90deg,#122029ef 0%,#14212acb 22%,#17252c61 47%,transparent 68%),linear-gradient(0deg,#0d182c55,transparent 34%);pointer-events:none}
#dialog.titleDialog{width:auto;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;margin-left:clamp(28px,7.6vw,130px);padding:0;pointer-events:auto}
.titleMark{width:clamp(45px,5.1vw,74px);height:auto;color:var(--amber);margin-bottom:clamp(9px,2vh,20px)}
.wordmark{margin:0;line-height:.91;font-family:"Archivo Black","Arial Black","DejaVu Sans",sans-serif;color:#f4f0de;font-weight:950;letter-spacing:-.052em;text-shadow:0 3px 20px #10171b3a}
.wordmark .patrol{display:block;font-size:clamp(52px,7.6vw,118px)}.wordmark .robo{display:block;font-size:clamp(17px,2.36vw,37px);letter-spacing:.065em;margin:13px 0 0 4px;color:#e5d7b9}
.title-actions{display:flex;align-items:stretch;gap:10px;margin-top:clamp(25px,4.7vh,46px)}
.title-actions button{padding:11px 23px}.title-actions svg{width:17px;height:17px;vertical-align:middle;margin-right:9px}
.primary,.secondary,.plainBtn{border-radius:4px;border:1px solid transparent;padding:11px 18px;font-weight:750;line-height:1.3}
.primary{background:#ecad77;color:#192529}.primary:hover{background:#ffc28c}.secondary,.plainBtn{border-color:#64716d;background:#1c292d;color:var(--paper)}.secondary:hover,.plainBtn:hover{border-color:var(--teal)}
.flag{margin:0 0 3px;color:var(--amber);font:700 11px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.17em}
h2,h3,p{margin-top:0}h2{font-size:clamp(23px,3vw,33px);line-height:1.18;letter-spacing:.02em;margin:0 0 16px}h3{font-size:15px;margin:20px 0 8px}
.resourceLine,.metaSummary,.statline,.mapLegend{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;color:#b9c4bd;font-size:13px;font-variant-numeric:tabular-nums}
.resourceLine,.metaSummary{padding:8px 0;border-block:1px solid #405051;margin:0 0 12px}
.metaHint,.eventFlavor,.nodeReward,.resultBreakdown,.endlessNotice{color:#cdd2c6}.resultBreakdown,.resultBreakdown span{display:block}.metaReward,.cost,.metaPrice,.good{color:var(--teal)}.bad,.compareLoss{color:#ef9f8d}.neutral{color:var(--muted)}
.mapWrap{height:clamp(210px,48vh,435px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;background:radial-gradient(ellipse at 50% 84%,#1c2d30 0%,#10191d 55%,#0c1318);border:1px solid #3b484b;border-radius:4px;touch-action:pan-y}
.mapBoard{width:100%;height:auto;display:block}.map-edge{fill:none;stroke:#5a696a;stroke-width:2;opacity:.27}.map-edge.done{stroke:#ba946e;opacity:.85}.map-edge.active{stroke:#8cd1be;stroke-width:4;opacity:.9}
.map-node circle,.startNode{fill:#1c282d;stroke:#72807b;stroke-width:2}.map-node{opacity:.3}.map-node.completed{opacity:.72}.map-node.current{opacity:1;cursor:pointer}.map-node.current circle{stroke:#9fdfc9;stroke-width:4;fill:#27413e}.map-node.current:hover circle,.map-node.current:focus circle{fill:#3d5851;stroke:#f2b77f}
.map-node text,.map-caption{fill:#cdd5c9;text-anchor:middle;dominant-baseline:middle;font:bold 22px sans-serif;pointer-events:none}.map-node .small{fill:#c7d6c8;font-size:13px;paint-order:stroke;stroke:#141f24;stroke-width:3px}
.map-node.boss circle{stroke:#d49d77}.map-caption{font-size:11px}.mapLegend{margin-top:10px;font-size:12px}.statusDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--teal);margin-right:7px}.routeDialog h2{margin-bottom:9px}
.starterGrid,.metaUpgradeGrid,.lootGrid,.shopGrid,.routeChoices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:13px}
.starterGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.starterOption,.metaUpgrade,.lootCard,.shopItem,.routeChoice{padding:11px;text-align:left;border:1px solid #425052;border-radius:4px;background:#213034;min-width:0}
.starterOption:not(:disabled):hover,.metaUpgrade:not(:disabled):hover,.lootCard:hover,.shopItem:not(:disabled):hover,.routeChoice:not(:disabled):hover,.starterOption.selected{border-color:#a8c8b6;background:#2a3c3d}
.starterOption strong,.starterOption small,.starterStatus,.shopItem small,.metaUpgrade small,.cost,.routeChoice small,.detail,.repl,.slot{display:block}
.starterOption small,.metaUpgrade small,.shopItem small,.routeChoice small,.detail,.repl,.slot,.compareStat,.compareSynergy,.compareLoss,.synergyEntry small{color:#afbbba;font-size:11px;line-height:1.5}.starterOption small{display:none}.starterGlyph{font:700 20px monospace}.starterStatus,.rarity{font-size:10px;color:var(--amber);margin-top:3px}
.metaUpgrade{display:flex;justify-content:space-between;gap:6px;align-items:center}.metaPrice{font-size:11px;white-space:nowrap}.hangarStart{width:100%;position:sticky;bottom:0}.hangarTitle{font-size:13px;letter-spacing:.04em}
.phaseDialog{text-align:center;max-width:290px}.phaseDialog .phaseIcon{font-size:34px;color:var(--amber);line-height:1.3}.phaseDialog h2{font-family:ui-monospace,monospace;letter-spacing:.08em}.partname{font-size:16px;font-weight:700}.compareStat{margin-right:8px}.compareStat.good{color:var(--teal)}.compareStat.bad{color:#e99b85}
#drawer{position:absolute;z-index:11;right:0;top:0;height:100%;width:min(430px,100%);overflow:auto;background:#192226fa;border-left:1px solid #677270;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) 20px;touch-action:pan-y;overscroll-behavior:contain}
#shade{position:absolute;inset:0;background:#08101577;border:0;z-index:10}.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer-head h2{margin:0}.tabs{display:flex;gap:5px;margin:15px 0;flex-wrap:wrap}.tabs button{border:1px solid #4e5c5e;border-radius:4px;background:#233033;padding:6px 10px;font-size:13px}.tabs button.active{background:#42534f;color:#ecf3de;border-color:#839c8c}
.option{display:grid;grid-template-columns:1fr minmax(72px,.75fr) auto;align-items:center;gap:9px;margin:10px 0;color:#d4dacf;font-size:13px}.option output{color:var(--amber);font:11px ui-monospace,monospace;min-width:34px;text-align:right}.option input{accent-color:var(--teal);width:100%}.option input[type=checkbox]{justify-self:end;width:18px;height:18px}.option select{grid-column:2/4;background:#243136;color:var(--paper);border:1px solid #596668;padding:6px;width:100%}
#settingsBody .row{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}#settingsBody hr{border:none;border-top:1px solid #425052;margin:18px 0}#settingsBody p,#settingsBody li{font-size:13px;color:#c4cec6}textarea{display:block;width:100%;min-height:130px;user-select:text;background:#111b21;color:#d4dfd7;border:1px solid #4c5c5e}#settingsBody [role=status]{min-height:1.5em;color:var(--teal)}
.flight-controls{position:absolute;inset:0;z-index:4;pointer-events:none;display:none}.pad{width:94px;aspect-ratio:1;position:absolute;bottom:max(20px,env(safe-area-inset-bottom));border:1px solid #e5eece91;border-radius:50%;background:#172a325e;touch-action:none;pointer-events:auto}
.pad:before,.pad:after{content:"";position:absolute;background:#d7e9d85c;left:50%;top:50%;transform:translate(-50%,-50%)}.pad:before{width:74%;height:1px}.pad:after{height:74%;width:1px}.pad i{position:absolute;inset:16%;border:1px solid #c6ded849;border-radius:50%}.pad b{width:31%;height:31%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:2px solid #d6efdebd;border-radius:50%;background:#8ba39c9e}
#movePad,.left-actions{left:max(18px,env(safe-area-inset-left))}#lookPad,.right-actions{right:max(18px,env(safe-area-inset-right))}
.actions{position:absolute;bottom:max(126px,calc(env(safe-area-inset-bottom) + 111px));display:flex;gap:5px;pointer-events:none}.actions .icon{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:#172b32a1}.actions .icon:active,.actions .icon.held{background:#63817d}.actions .icon svg{width:19px}
#app[data-paused=true] #pads,#app[data-scene=finisher] #toolbar{display:none}
@media(pointer:coarse),(max-width:720px){#app[data-scene=fight]:not([data-paused=true]) #pads{display:block}}
@media(max-width:520px){:root{font-size:14px}#toolbar{right:12px;top:max(12px,env(safe-area-inset-top))}#dialog{padding:16px}.starterGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.mapWrap{height:51vh}#overlay:has(.titleDialog){align-items:flex-end;background:linear-gradient(0deg,#122027f5,#122027c7 24%,#16242a26 59%,transparent 78%)}#dialog.titleDialog{padding:0;margin:0 24px max(8vh,32px)}.wordmark .patrol{font-size:clamp(58px,16vw,80px)}.wordmark .robo{font-size:21px}.titleMark{width:36px;margin-bottom:8px}.title-actions{margin-top:22px}.title-actions button{padding:10px 19px}.metaUpgradeGrid{grid-template-columns:1fr}.mapBoard{min-width:300px}.pad{width:80px}.actions{bottom:max(110px,calc(env(safe-area-inset-bottom) + 96px))}}
@media(max-height:480px) and (orientation:landscape){#toolbar{top:8px;right:max(10px,env(safe-area-inset-right))}.pad{width:72px;bottom:10px}.actions{bottom:90px}.actions .icon{width:40px;height:40px}.mapWrap{height:42vh}#dialog{max-height:95vh;padding:12px 20px}.titleMark{width:32px;margin-bottom:4px}.wordmark .patrol{font-size:49px}.wordmark .robo{font-size:17px}.title-actions{margin-top:16px}}
.statRadar{width:100%;max-height:190px}.radarRing,.radarSpoke{fill:none;stroke:#4c5e60}.radarFill{fill:#86cbb441;stroke:#94d7bd;stroke-width:2}.radarAxisText{fill:#bdc8bf;font:13px monospace}.radarPoint{fill:#e3b27d}.radarReadout{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.radarStat,.radarDetails,.synergyEntry,.part{display:flex;gap:6px;justify-content:space-between}.radarDetails,.radarResearch,.statPanelTitle,.lvl,.synergyLabel{font-size:12px;color:#aebdb4}.radarDetails{margin-top:9px}.part{border-top:1px solid #405050;padding:6px 0}.synergyEntry,.synergySummary{margin-block:8px}.synergyEntry{flex-direction:column}

.right-actions{display:grid;grid-template-columns:repeat(2,42px);grid-template-areas:"down up" "fire dash"}#down{grid-area:down}#up{grid-area:up}#fire{grid-area:fire}#dash{grid-area:dash;border-color:#b3ded0b3}

.utility-action{right:calc(max(18px,env(safe-area-inset-right)) + 105px);bottom:max(32px,calc(env(safe-area-inset-bottom) + 32px))}
@media(max-width:520px),(max-height:480px){.utility-action{right:calc(max(18px,env(safe-area-inset-right)) + 90px);bottom:max(22px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<main id="app" data-scene="title" aria-label="PATROL × ROBO SALVAGE">
<canvas id="sky" aria-hidden="true"></canvas><canvas id="world" aria-hidden="true"></canvas>
<canvas id="hud" aria-label="3Dホバー戦闘フィールド"></canvas>
<div id="vignette" aria-hidden="true"></div>
<nav id="toolbar" aria-label="ゲーム設定">
<button class="icon" id="menuBtn" aria-label="装備と設定を開く" title="装備・設定 (T)"></button>
</nav>
<div class="flight-controls" id="pads">
<div class="pad" id="movePad" role="group" aria-label="移動スティック"><i></i><b id="moveThumb"></b></div>
<div class="pad" id="lookPad" role="group" aria-label="視点スティック"><i></i><b id="lookThumb"></b></div>
<div class="actions utility-action"><button class="icon" id="reload" aria-label="リロード"></button></div>
<div class="actions right-actions"><button class="icon" id="dash" aria-label="ダッシュ"></button><button class="icon" id="down" aria-label="下降"></button><button class="icon" id="up" aria-label="上昇"></button><button class="icon" id="fire" aria-label="手動射撃"></button></div>
</div>
<div id="overlay"><section id="dialog" aria-live="polite"></section></div>
<aside id="drawer" hidden aria-label="装備と設定"><div class="drawer-head"><h2 id="drawerTitle">設定</h2><button class="icon" id="closeDrawer" aria-label="閉じる"></button></div>
<div class="tabs" id="tabs"></div><div id="settingsBody"></div></aside>
<button id="shade" hidden aria-label="メニューを閉じる"></button>
</main>
<script>
(()=>{
'use strict';
const TAU=Math.PI*2,canvas=document.getElementById('hud'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const SLOT={weapon:'WEAPON / 武器',armor:'ARMOR / 装甲',legs:'LEGS / 脚部',core:'CORE / コア'};
const DEF={
 weapon:[
  {id:'pulse',name:'パルスガン',detail:'連射に優れる標準銃',damage:14,cool:.32,velocity:810,count:1,spread:0,mag:12,reload:1.6,idealRange:345,color:'#63eff3'},
  {id:'shot',name:'スプレッド砲',detail:'中央と四隅に5発の散弾',damage:8,cool:.78,velocity:740,count:5,spread:.19,mag:5,reload:2.35,idealRange:190,color:'#ffce78'},
  {id:'rail',name:'レールランサー',detail:'壁を貫通する長射程ビーム。着弾で装甲を弱体化',damage:18,cool:1.35,velocity:1160,count:1,spread:0,mag:3,reload:3.2,idealRange:485,color:'#c1acff'},
  {id:'missile',name:'ホーミング弾',detail:'追尾する低速ミサイル',damage:25,cool:1.02,velocity:425,count:1,spread:0,mag:4,reload:2.75,idealRange:400,color:'#ff867d',homing:true},
  {id:'micro',name:'ニードルガン',detail:'低威力・高速連射',damage:7,cool:.19,velocity:960,count:1,spread:.015,mag:30,reload:2.15,idealRange:295,color:'#82f5bb'},
  {id:'burst',name:'バーストライフル',detail:'3発同時射撃の中距離型',damage:8,cool:.62,velocity:920,count:3,spread:.072,mag:9,reload:2.35,idealRange:345,color:'#8ab5fa'},
  {id:'slug',name:'グラビティスラグ',detail:'遅い連射の一撃重視型',damage:49,cool:1.5,velocity:950,count:1,spread:0,mag:3,reload:2.9,idealRange:375,color:'#e5bcff'},
 ],
 armor:[
  {id:'mesh',name:'メッシュ装甲',detail:'軽量で基本的な防御',hp:125,guard:.025,color:'#65e1e9'},
  {id:'plated',name:'プレート装甲',detail:'高耐久の積層プレート',hp:158,guard:.065,color:'#91acd0'},
  {id:'fortress',name:'フォートレス',detail:'重装甲と厚いシールド',hp:184,guard:.105,color:'#f5b56e'},
  {id:'reactive',name:'リアクティブ装甲',detail:'反応装甲で被弾を軽減',hp:147,guard:.15,color:'#bc98f6'},
  {id:'composite',name:'コンポジット装甲',detail:'重さと防御力のバランス',hp:168,guard:.09,color:'#9dbdb2'},
  {id:'feather',name:'フェザー装甲',detail:'軽装甲・機動型ビルド向け',hp:118,guard:.045,color:'#c4d5f1'},
  {id:'prism',name:'プリズム装甲',detail:'最大HPより被弾軽減を重視',hp:136,guard:.18,color:'#a2e5f4'}
 ],
 legs:[
  {id:'wheel',name:'ローラー脚',detail:'安定した移動性能',speed:223,dash:2.8,color:'#74dce0'},
  {id:'booster',name:'ブースター脚',detail:'高機動・素早い回避',speed:262,dash:2.5,color:'#ffca80'},
  {id:'tank',name:'キャタピラ脚',detail:'低速だが耐久補助',speed:184,dash:3.0,bonusHp:18,color:'#c4b89a'},
  {id:'spider',name:'スパイダー脚',detail:'小回りの効く俊敏型',speed:246,dash:2.1,color:'#d0a7fa'},
  {id:'jet',name:'ジェット脚',detail:'直進速度が高い軽量型',speed:278,dash:2.35,color:'#f7ab84'},
  {id:'crawler',name:'ヘビークローラー',detail:'頑丈だが低速、HP増加',speed:180,dash:3,bonusHp:33,color:'#b4bfa2'},
  {id:'ranger',name:'レンジャー脚',detail:'回避と速度の中間',speed:252,dash:2.25,color:'#89d1fb'}
 ],
 core:[
  {id:'balance',name:'バランスコア',detail:'標準性能／ダッシュ1秒',damage:1,rate:1,heal:0,hpFactor:1,speedFactor:1,dashCooldown:1,color:'#71f3d0'},
  {id:'power',name:'パワーコア',detail:'攻撃+25%／移動-15%／HP+8%／ダッシュ2秒',damage:1.25,rate:1,heal:0,hpFactor:1.08,speedFactor:.85,dashCooldown:2,color:'#ff9d79'},
  {id:'speed',name:'スピードコア',detail:'移動+22%／攻撃-15%／HP-6%／ダッシュ0.3秒',damage:.85,rate:1,heal:0,hpFactor:.94,speedFactor:1.22,dashCooldown:.3,color:'#9cdafa'},
  {id:'tactical',name:'タクティカルコア',detail:'移動・HP-5%／弾倉1.5倍／装填-20%／ダッシュ1秒',damage:1,rate:1,heal:0,hpFactor:.95,speedFactor:.95,dashCooldown:1,magBonus:1.5,reloadFactor:.8,color:'#f5cb89'}

 ]
};
const WEAPON_TRAITS={
 pulse:{name:'感電',stun:.14,slow:.45},
 shot:{name:'吹き飛ばし',push:30},
 rail:{name:'装甲破砕',sunder:1.5},
 missile:{name:'爆風',splash:68},
 micro:{name:'装甲削り',sunder:1.25},
 burst:{name:'炎上',burn:1.65},
 slug:{name:'強制停止',stun:.42,push:64},
};
const RAR=['','STANDARD','ADVANCED','RARE','LEGEND'],RARCOL=['','#a9bbc9','#65dece','#b9a5ff','#ffca7b'];
const part=(slot,id,lv=1,tier=1)=>({slot,id,lv,tier});
const find=p=>DEF[p.slot].find(d=>d.id===p.id)||DEF[p.slot][0];
const clone=p=>({slot:p.slot,id:p.id,lv:p.lv,tier:p.tier});
const score=p=>p.lv*(1+.23*(p.tier-1));
const rarity=wave=>{const r=Math.random();return r<Math.max(.02,(wave-8)*.025)?4:r<Math.min(.38,.04+wave*.021)?3:r<Math.min(.66,.16+wave*.034)?2:1};
const enemyNames=['NEON JACKAL','IRON MOTH','RUST VIPER','VOID CAT','DUST HOUND','SKY MANTIS','STEEL GHOST','COBALT FOX'];
// Tactical roles alter positioning and aiming without adding raw damage.
const ENEMY_ROLES={
 skirmisher:{label:'SKIRMISHER',distance:265,strafe:.8,speed:1,accuracy:1,attackRange:700},
 charger:{label:'CHARGER',distance:152,strafe:.25,speed:1.05,accuracy:1.1,attackRange:680},
 sniper:{label:'SNIPER',distance:410,strafe:.35,speed:.86,accuracy:.65,attackRange:820},
 flanker:{label:'FLANKER',distance:290,strafe:1.25,speed:1.08,accuracy:1.25,attackRange:730},
 guardian:{label:'GUARDIAN',distance:250,strafe:.55,speed:.9,accuracy:.85,attackRange:730},
 boss:{label:'OMEGA',distance:280,strafe:.75,speed:1,accuracy:.88,attackRange:790}
};
const NORMAL_ROLES=['skirmisher','charger','sniper','flanker'];
const chooseEnemyRole=kind=>kind==='boss'?'boss':kind==='elite'?'guardian':pick(NORMAL_ROLES);
// Enemy archetypes bias two slots toward recognisable combat styles.
// The other two slots, all levels and rarities remain random. Roughly
// one quarter of enemies are completely random to preserve roguelite variety.
const ENEMY_ARCHETYPES=[

const SYNERGY_METRIC_LABELS={
 hp:'最大HP',damage:'攻撃力',speed:'移動速度',fireCooldown:'射撃間隔',
 dashCooldown:'ダッシュ待機',guard:'防御率',repair:'戦闘後回復率',
 stun:'スタン時間',slow:'減速時間',sunder:'装甲破砕時間',
 burn:'炎上時間',push:'吹き飛ばし距離',splash:'爆風範囲',
 reactive:'反応装甲の被ダメージ'
};
function synergyPercent(value){return Number((value*100).toFixed(1)).toString();}
function synergyEffectText(rule){
 return Object.entries(rule.modifiers).map(([key,value])=>{
  const name=SYNERGY_METRIC_LABELS[key]||key;
  if(key==='guard'||key==='repair')return name+(value>=0?'+':'')+synergyPercent(value)+'pt';
  const change=Number(((value-1)*100).toFixed(1));
  return name+(change>0?'+':'')+change+'%';
 }).join('・');
}
function synergyConditionText(rule){return rule.description.split('：')[0];}

const SYNERGY_DEFAULT={
 hp:1,damage:1,speed:1,fireCooldown:1,dashCooldown:1,
 guard:0,repair:0,stun:1,slow:1,sunder:1,burn:1,
 push:1,splash:1,reactive:1
};

function findBuildSynergies(load){
 if(!load||!load.weapon||!load.armor||!load.legs||!load.core)return [];
 return SYNERGY_RULES.filter(rule=>
  Object.entries(rule.requires).every(([slot,ids])=>
   Boolean(load[slot])&&ids.includes(load[slot].id)));
}

function resolveBuildSynergies(load){
 const active=findBuildSynergies(load);
 const modifiers={...SYNERGY_DEFAULT};
 for(const rule of active){
  for(const [stat,value] of Object.entries(rule.modifiers)){
   if(stat==='guard'||stat==='repair'){
    modifiers[stat]+=value;
   }else{
    modifiers[stat]*=value;
   }
  }
 }
 // Limit stacked synergies so synergy hunting is rewarding but not explosive.
 const bounds={
  hp:[.7,1.55],damage:[.7,1.65],speed:[.72,1.5],
  fireCooldown:[.65,1.4],dashCooldown:[.65,1.35],
  stun:[1,2],slow:[1,2],sunder:[1,2],burn:[1,2],
  push:[1,1.8],splash:[1,1.8],reactive:[.5,1.2]
 };
 for(const [stat,[min,max]] of Object.entries(bounds))
  modifiers[stat]=clamp(modifiers[stat],min,max);
 modifiers.guard=clamp(modifiers.guard,0,.11);
 modifiers.repair=clamp(modifiers.repair,0,.24);
 return {active,modifiers};
}

function buildComparison(previous,candidate){
 const oldStats=specs(previous,true);
 const newStats=specs(candidate,true);
 const pairs=[
  {name:'弾倉',old:oldStats.mag,next:newStats.mag,digits:0,higher:true},
  {name:'装填時間',old:oldStats.reloadTime,next:newStats.reloadTime,digits:2,higher:false},
  {name:'最大HP',old:oldStats.hp,next:newStats.hp,digits:0,higher:true},
  {name:'攻撃威力',old:oldStats.dmg,next:newStats.dmg,digits:0,higher:true},
  {name:'連射間隔',old:oldStats.fireCooldown,next:newStats.fireCooldown,digits:2,higher:false},
  {name:'防御率',old:oldStats.guard,next:newStats.guard,digits:0,higher:true,percent:true},
  {name:'移動速度',old:oldStats.speed,next:newStats.speed,digits:0,higher:true}
 ];
 return {
  old:oldStats,new:newStats,
  diffs:pairs.map(metric=>{
   const prev=metric.percent?metric.old*100:metric.old;
   const next=metric.percent?metric.next*100:metric.next;
   return {...metric,previous:Number(prev.toFixed(metric.digits)),
    current:Number(next.toFixed(metric.digits)),
    improved:metric.higher?next>prev:next<prev,
    worsened:metric.higher?next<prev:next>prev};
  }),
  gains:newStats.synergies.filter(rule=>!oldStats.synergies.some(old=>old.id===rule.id)),
  losses:oldStats.synergies.filter(rule=>!newStats.synergies.some(next=>next.id===rule.id))
 };
}

function buildComparisonMarkup(previous,candidate){
 const result=buildComparison(previous,candidate);
 const main=result.diffs.filter(d=>Math.abs(d.old-d.next)>0.04).slice(0,3);
 let html='<div class="compareStats">';
 for(const metric of main){
  const color=metric.improved?'good':metric.worsened?'bad':'neutral';
  const arrow=metric.improved?'↑':metric.worsened?'↓':'→';
  html+='<span class="compareStat '+color+'">'+metric.name+' '
   +metric.previous+(metric.percent?'%':'')+' '+arrow+' '
   +metric.current+(metric.percent?'%':'')+'</span>';
 }
 if(!main.length)html+='<span class="compareStat neutral">基礎性能は同等</span>';
 html+='</div>';
 if(result.gains.length)
  html+='<div class="compareSynergy">コンボ発動：'
   +result.gains.map(x=>x.name+'【'+synergyEffectText(x)+'】').join('／')+'</div>';
 if(result.losses.length)
  html+='<div class="compareLoss">失うコンボ：'
   +result.losses.map(x=>x.name).join('、')+'</div>';
 return html;
}

function specs(load,forPlayer=false){

 const af=1+.095*(load.armor.lv-1)+.12*(load.armor.tier-1);
 const lf=1+.053*(load.legs.lv-1)+.055*(load.legs.tier-1);
 const cf=1+.06*(load.core.lv-1)+.08*(load.core.tier-1);
 const wf=1+.095*(load.weapon.lv-1)+.15*(load.weapon.tier-1);
 const synergy=resolveBuildSynergies(load),m=synergy.modifiers;
 const permanent=forPlayer?metaState.upgrades:{hull:0,power:0,drive:0,recovery:0};

  hp:Math.round(2*(a.hp*af+(l.bonusHp||0)*lf)*m.hp*(c.hpFactor||1)*(1+permanent.hull*.05)*(1+(forPlayer&&endlessMode?endlessUpgrades.hp*.06:0))),
  guard:clamp(a.guard+.007*(load.armor.lv-1)+.008*(load.armor.tier-1)+(c.guardBonus||0)+m.guard,0,.38),

  dmg:w.damage*wf*c.damage*cf*m.damage*(1+permanent.power*.04)*(1+(forPlayer&&endlessMode?endlessUpgrades.atk*.07:0)),fireCooldown:Math.max(.125,w.cool/(c.rate*cf)*m.fireCooldown),
  weapon:w,armor:a,legs:l,core:c,mag:Math.max(1,Math.ceil(w.mag*(c.magBonus||1))),
  reloadTime:Math.max(.5,w.reload*(c.reloadFactor||1)),
  repair:clamp(c.heal*cf+m.repair+permanent.recovery*.04,0,.65),
  synergies:synergy.active,modifiers:m
 };
}

function initMusic(){

  if(audio.state==='suspended')audio.resume();
  if(!musicBus){musicBus=audio.createGain();musicBus.gain.value=0;musicBus.connect(audio.destination)}

function setMusicMode(mode){

function chipNote(hz,t,duration,vol,type){
 if(!hz||!audio||!musicBus)return;
 const osc=audio.createOscillator(),amp=audio.createGain();

 amp.gain.linearRampToValueAtTime(vol,t+.008);
 amp.gain.exponentialRampToValueAtTime(.0001,t+duration);

function musicTick(){

 if(musicMode!==musicPlaying){
  if(audio.currentTime<musicSwitchAt)return;
  musicPlaying=musicMode;musicBeat=0;musicNext=audio.currentTime+.035;
  musicBus.gain.setTargetAtTime(musicPlaying==='silent'?0:1,audio.currentTime,.17);
 }
 const notes=CHIP_SCORES[musicPlaying];if(!notes)return;
 const beat=musicPlaying==='combat'?.165:musicPlaying==='boss'?.19:.24;
 let count=0;
 while(musicNext<audio.currentTime+.095&&count++<3){
  const hz=notes[musicBeat%notes.length];
  chipNote(hz,musicNext,beat*.75,.018,'square');
  if(musicBeat%4===0)chipNote(hz?hz/2:110,musicNext,beat*1.65,.012,'triangle');
  musicBeat++;musicNext+=beat;

}

function buildRouteGraph(){
 const pool=['shop','rest','elite','event','cache','shop','event','elite','rest','shop'];
 return Array.from({length:10},(_,row)=>{
  const left=pick(pool),right=pick(pool.filter(t=>t!==left));
  return Array.from({length:5},(_,lane)=>{
   const kind=lane===1?left:lane===3?right:lane===2?'fight':row%2===lane%2?'fight':'fight2';
   return endlessMode&&(kind==='fight'||kind==='fight2')?'elite':kind;
  });
 });
}

function restoreVitalsFromLoad(){
 if(!player)return;
 const previous=player.maxHp,missing=Math.max(0,previous-player.hp);
 const previousGun=player.stats.weapon.id,previousMag=player.stats.mag;
 const reloadProgress=player.reloadLeft>0?player.reloadLeft/player.reloadTotal:0;
 player.stats=specs(player.load,true);player.maxHp=player.stats.hp;
 if(previousGun!==player.stats.weapon.id){
  player.ammo=player.stats.mag;player.reloadLeft=0;
 }else{
  player.ammo=clamp(player.ammo+player.stats.mag-previousMag,0,player.stats.mag);
  if(reloadProgress>0)player.reloadLeft=player.stats.reloadTime*reloadProgress;
 }
 player.reloadTotal=player.stats.reloadTime;
 player.hp=clamp(player.maxHp-missing,0,player.maxHp);
 updatePanels(true);
}

  {key:'MAG',value:stats.mag,scale:50,display:String(stats.mag)}
 ];
 const cx=164,cy=132,radius=84,count=metrics.length;
 const xy=(index,scale)=>{
  const angle=-Math.PI/2+index*2*Math.PI/count;
  return [cx+Math.cos(angle)*scale,cy+Math.sin(angle)*scale];
 };
 const pointText=arr=>arr.map(([x,y])=>x.toFixed(1)+','+y.toFixed(1)).join(' ');
 const grid=[.25,.5,.75,1].map(frac=>'<polygon points="'+pointText(metrics.map((_,i)=>xy(i,radius*frac)))+'" class="radarRing"/>').join('');
 const spokes=metrics.map((_,i)=>{const [x,y]=xy(i,radius);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="radarSpoke"/>'}).join('');
 const data=metrics.map((m,i)=>xy(i,radius*Math.max(.04,Math.min(1,m.value/m.scale))));
 const poly='<polygon points="'+pointText(data)+'" class="radarFill"/>';
 const dots=data.map(([x,y])=>'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3" class="radarPoint"/>').join('');

 const modifiers=b.source?.stats?.modifiers||SYNERGY_DEFAULT;
 for(const key of ['burn','slow','stun','sunder'])
  if(traits[key])target.status[key]=Math.max(target.status[key],traits[key]*modifiers[key]);

  const dx=target.x-b.source.x,dy=target.y-b.source.y,d=Math.max(1,Math.hypot(dx,dy));
  moveRobot(target,dx/d*traits.push*modifiers.push,dy/d*traits.push*modifiers.push);

 }
 if(traits.splash){

 }

 ctx.fillStyle=edge;ctx.fillRect(bx+bar*.64,y+10*ui,bar*.36,3*ui);ctx.fillStyle='#b9ced4';ctx.fillRect(bx+bar*.64,y+10*ui,bar*.36*recharge,3*ui);
 const radarR=clamp(25*ui,17,width*.059),rx=width-26*ui-radarR,ry=72*ui+radarR;
 ctx.fillStyle='#14252e84';ctx.beginPath();ctx.arc(rx,ry,radarR,0,TAU);ctx.fill();arc(rx,ry,radarR,0,TAU,'#d4e1ce9e',1);
 const plot=(o,col,r)=>{const sn=Math.sin(bearing),cs=Math.cos(bearing);ctx.fillStyle=col;ctx.beginPath();ctx.arc(rx+(o.x*cs-o.y*sn)/FIELD*radarR,ry-(o.x*sn+o.y*cs)/FIELD*radarR,r*ui,0,TAU);ctx.fill()};
 plot(player,'#b5f1dc',2.2);plot(enemy,'#ffa282',2.5);
 if(bossAttack||ai?.aim&&enemy.stats.weapon.id==='rail'){
  const pulse=.35+.55*Math.abs(Math.sin(clock*11));ctx.globalAlpha=pulse;
  for(const s of [-1,1])line([[cx+s*(r+10*ui),cy-7*ui],[cx+s*(r+15*ui),cy],[cx+s*(r+10*ui),cy+7*ui]],'#ff8d63',2);ctx.globalAlpha=1;
 }
 if(player.hitFlash>.02){ctx.strokeStyle='rgba(255,124,83,'+player.hitFlash*2+')';ctx.lineWidth=7*ui;ctx.strokeRect(0,0,width,height)}
 ctx.restore();
}
function combatFrame(){
 const mesh=[];drawMachine(mesh,player);drawMachine(mesh,enemy);renderEffects(mesh);
 if(state==='fight'&&ai?.aim&&enemy.stats.weapon.id==='rail'&&aimState.visible){
  tube(mesh,shotOrigin(enemy),V.mix(shotOrigin(enemy),ai.aim,.82),.54,.27,'#eaa787');
 }
 drawWorld(mesh);drawHUD();
}
let previous=0,carry=0,lastVisual=0;
function frame(time){
 const dt=previous?clamp((time-previous)/1000,0,.12):0;previous=time;
 if(dt>0&&state==='fight'&&!menuOpen)adaptQuality(dt);
 const resized=resizeScene();
 if(state==='fight'||state==='finisher'){
  if(resized&&state==='fight'){refreshCamera(1,true);aimState=acquire()}
  if(!menuOpen){carry+=dt;while(carry>=1/90){simulation(1/90);carry-=1/90}}
  else carry=0;
  if((state==='fight'||state==='finisher')&&(!menuOpen||sceneDirty)){
   ctx.clearRect(0,0,width,height);combatFrame();sceneDirty=false;
  }
 }else if(state==='title'&&(sceneDirty||time-lastVisual>40)){
  ctx.clearRect(0,0,width,height);titleFrame(Math.min((time-lastVisual)/1000,.15));lastVisual=time;sceneDirty=false;
 }else if(sceneDirty){
  ctx.clearRect(0,0,width,height);sceneDirty=false;
 }
 musicTick();requestAnimationFrame(frame);
}
soundOn=stored('patrolHover.sound')!=='0';
initGPU();resizeScene();showTitle();requestAnimationFrame(frame);

})();
</script>
