window.addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')){const n=e.code.slice(5).toLowerCase();if(n in arrow)arrow[n]=true;input.moved=true}});
window.addEventListener('keyup',e=>{if(e.code.startsWith('Arrow')){const n=e.code.slice(5).toLowerCase();if(n in arrow){arrow[n]=false;if(!arrow.left&&!arrow.right)input.x=0;if(!arrow.up&&!arrow.down)input.y=0}}});
const stick=$('stick');let touchId=null;
function setTouchStick(e){const rc=stick.getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2,dx=e.clientX-cx,dy=e.clientY-cy,r=rc.width*.35,d=hypot(dx,dy),s=Math.min(1,d/r);
 input.x=d?dx/d*s:0;input.y=d?dy/d*s:0;input.moved=true;
 $('knob').style.transform=`translate(calc(-50% + ${input.x*r}px), calc(-50% + ${input.y*r}px))`;
}
stick.addEventListener('pointerdown',e=>{e.preventDefault();input.touch=true;input.stickActive=true;touchId=e.pointerId;stick.setPointerCapture(e.pointerId);setTouchStick(e)});
stick.addEventListener('pointermove',e=>{if(touchId===e.pointerId)setTouchStick(e)});
function releaseStick(e){if(touchId===e.pointerId){touchId=null;input.stickActive=false;input.x=0;input.y=0;$('knob').style.transform='translate(-50%,-50%)'}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
$('roll').addEventListener('pointerdown',e=>{e.preventDefault();startRoll()});
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireMissile()});
$('cam').addEventListener('pointerdown',e=>{e.preventDefault();cycleView()});
$('boost').addEventListener('pointerdown',e=>{e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);input.boostTouch=true;e.currentTarget.classList.add('held')});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])$('boost').addEventListener(ev,e=>{input.boostTouch=false;e.currentTarget.classList.remove('held')});
function patchKeyboardInput(){if(arrow.left||arrow.right){input.x=clamp((arrow.right?1:0)-(arrow.left?1:0),-1,1);input.moved=true;}if(arrow.up||arrow.down){input.y=clamp((arrow.down?1:0)-(arrow.up?1:0),-1,1);input.moved=true;}}
// QA hook is read-only in production; mutators are only exposed to headless webdriver.
window.PatrolDiagnostics=()=>({ready,mode:cam.mode,view:['top','chase','cockpit'][cam.mode],frame,internalHeight:internalH,fps:Math.round(fps),worldSeconds,jet:{pos:jet.pos.slice(),speed:jet.speed,pitch:jet.pitch,yaw:jet.yaw,bank:jet.bank,g:jet.g,radarHeight:jet.radarHeight,boost:jet.boost,rollRemaining:jet.rollRemaining},missileCount:railRearm.filter(t=>t<=worldSeconds).length,missileLaunches,strikes,activeMissiles:missiles.length,impacts:impacts.length,errors:gameErrors.slice()});
if(navigator.webdriver)window.__PATROL_QA={
 setView(mode){cam.mode=mode;cam.modeElapsed=2;let t=mode===0?{pos:add(jet.pos,[0,1550,0]),to:jet.pos.slice(),up:[0,0,1]}:mode===1?{pos:add(add(add(jet.pos,mul(jet.forward,W<H*.8?-430:-195)),mul(jet.up,W<H*.8?130:70)),mul(jet.right,W<H*.8?0:20)),to:add(jet.pos,mul(jet.forward,W<H*.8?20:105)),up:[0,1,0]}:{pos:localToWorld(0,11,15),to:localToWorld(0,11,155),up:jet.up};cam.pos=t.pos;cam.forward=unit(sub(t.to,t.pos));cam.right=unit(cross(t.up,cam.forward));cam.up=unit(cross(cam.forward,cam.right));},
 fire:fireMissile,
 forceImpact(){blast(missileTarget())},
 forceImpactNear(){const p=localToWorld(0,0,460);blast(p);},
 simulate(seconds){let n=Math.floor(seconds*60),errors=0;for(let k=0;k<n;k++){if(k%60===0){input.x=Math.sin(k*.083)*.45;input.y=Math.sin(k*.042)*.28;input.moved=true;input.boostTouch=(k%360)<120;}if(k%235===0)fireMissile();try{gameplay(1/60)}catch(e){errors++;gameErrors.push(String(e));break;}}input.boostTouch=false;return {seconds,errors,jet:jet.pos.slice(),strikes,missileLaunches};},
 setAircraft(x,y,z,yaw,pitch){jet.pos=[x,y,z];jet.yaw=yaw;jet.pitch=pitch;flightAxes();},
 step(dt){gameplay(dt)},
 terrainAt:(x,z)=>terrainHeight(x,z),
 soundOff:()=>!soundOn
};
try{initGL();buildJet();flightAxes();resize();startWorker();requestAnimationFrame(tick)}catch(e){shaderError=String(e);console.error(e);$('loadingText').textContent='RENDERER ERROR';$('pct').textContent=String(e).slice(0,140);}
})();
